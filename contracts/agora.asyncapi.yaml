asyncapi: 3.0.0
info:
  title: Agora events
  version: 0.3.0
  description: |
    Events Agora publishes to the `agora.events` topic exchange on RabbitMQ;
    the routing key is the event type. Every message is the Krepis
    `DomainEvent` envelope (see `../docs/events.md`), JSON, persistent, with
    the event ID as AMQP `messageId` and the event type as `type`.

    Delivery is at least once (transactional outbox and relay): deduplicate
    on `eventId`. Agents' events have the agent as their aggregate, skills'
    the skill, councils' the council, and its `aggregateVersion` grows by one with each change (its
    creation is 1), so a consumer can tell an old event from a newer one.

    Hephaestus keeps a copy of agents and their published versions, and of
    skills and their versions, from these events, to create and run tasks
    with. Versions are immutable, so `agent-version.published` and
    `skill-version.published` carry the whole version (a skill version's
    files too: at most 1 MiB). It keeps councils and their published versions
    too (`../docs/councils.md`), for the sessions it will run with them;
    `council-version.published` carries the whole version.

defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from ../docker-compose.yml

channels:
  agoraEvents:
    address: agora.events
    description: Topic exchange; consumers bind their own durable queue (`<consumer>.agora-events`) to the routing keys they need.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: agora.events
          type: topic
          durable: true
          autoDelete: false
    messages:
      agentCreated: { $ref: '#/components/messages/agentCreated' }
      agentArchived: { $ref: '#/components/messages/agentArchived' }
      agentVersionPublished: { $ref: '#/components/messages/agentVersionPublished' }
      agentVersionDeprecated: { $ref: '#/components/messages/agentVersionDeprecated' }
      skillCreated: { $ref: '#/components/messages/skillCreated' }
      skillArchived: { $ref: '#/components/messages/skillArchived' }
      skillVersionPublished: { $ref: '#/components/messages/skillVersionPublished' }
      councilCreated: { $ref: '#/components/messages/councilCreated' }
      councilArchived: { $ref: '#/components/messages/councilArchived' }
      councilVersionPublished: { $ref: '#/components/messages/councilVersionPublished' }
      councilVersionDeprecated: { $ref: '#/components/messages/councilVersionDeprecated' }

operations:
  publishAgoraEvents:
    action: send
    channel: { $ref: '#/channels/agoraEvents' }
    messages:
      - $ref: '#/channels/agoraEvents/messages/agentCreated'
      - $ref: '#/channels/agoraEvents/messages/agentArchived'
      - $ref: '#/channels/agoraEvents/messages/agentVersionPublished'
      - $ref: '#/channels/agoraEvents/messages/agentVersionDeprecated'
      - $ref: '#/channels/agoraEvents/messages/skillCreated'
      - $ref: '#/channels/agoraEvents/messages/skillArchived'
      - $ref: '#/channels/agoraEvents/messages/skillVersionPublished'
      - $ref: '#/channels/agoraEvents/messages/councilCreated'
      - $ref: '#/channels/agoraEvents/messages/councilArchived'
      - $ref: '#/channels/agoraEvents/messages/councilVersionPublished'
      - $ref: '#/channels/agoraEvents/messages/councilVersionDeprecated'

components:
  messages:
    agentCreated:
      name: agent.created
      summary: An agent was created (Hephaestus's copy).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: agent.created }
              payload: { $ref: '#/components/schemas/AgentCreated' }
    agentArchived:
      name: agent.archived
      summary: An agent was archived; no new tasks start with it (Hephaestus, Kairos).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: agent.archived }
              payload: { $ref: '#/components/schemas/AgentArchived' }
    agentVersionPublished:
      name: agent-version.published
      summary: A version became the agent's published one; new tasks run it (Hephaestus, Kairos, Kriterion).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: agent-version.published }
              payload: { $ref: '#/components/schemas/AgentVersionPublished' }
    agentVersionDeprecated:
      name: agent-version.deprecated
      summary: A published version was replaced by a newer one (Kairos warns about automations still using it).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: agent-version.deprecated }
              payload: { $ref: '#/components/schemas/AgentVersionDeprecated' }
    skillCreated:
      name: skill.created
      summary: A skill was created; its first version follows (`skill-version.published`) in the same transaction (Hephaestus's copy).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: skill.created }
              payload: { $ref: '#/components/schemas/SkillCreated' }
    skillArchived:
      name: skill.archived
      summary: A skill was archived; new agent versions can't choose it, versions that pinned it keep running with it.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: skill.archived }
              payload: { $ref: '#/components/schemas/SkillArchived' }
    councilCreated:
      name: council.created
      summary: A council was created, without a version yet (Hephaestus's copy).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: council.created }
              payload: { $ref: '#/components/schemas/CouncilCreated' }
    councilArchived:
      name: council.archived
      summary: A council was archived; no new sessions start with it.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: council.archived }
              payload: { $ref: '#/components/schemas/CouncilArchived' }
    councilVersionPublished:
      name: council-version.published
      summary: A version became the council's published one; new sessions use it (Hephaestus's copy).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: council-version.published }
              payload: { $ref: '#/components/schemas/CouncilVersionPublished' }
    councilVersionDeprecated:
      name: council-version.deprecated
      summary: A published council version was replaced by a newer one.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: council-version.deprecated }
              payload: { $ref: '#/components/schemas/CouncilVersionDeprecated' }
    skillVersionPublished:
      name: skill-version.published
      summary: A skill got a new version, with its files; agent versions can pin it (Hephaestus's copy, Kriterion).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: skill-version.published }
              payload: { $ref: '#/components/schemas/SkillVersionPublished' }

  schemas:
    Uuid: { type: string, format: uuid }
    Envelope:
      type: object
      description: Krepis's `DomainEvent`.
      required: [eventId, eventType, schemaVersion, aggregateId, aggregateVersion, occurredAt, organizationId, projectId, actor, payload]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid', description: 'UUIDv7; the deduplication key.' }
        eventType: { type: string }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        aggregateVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        projectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor:
          description: Who made the change; null for system work (an import).
          oneOf:
            - type: 'null'
            - type: object
              required: [sub, sub_type]
              properties:
                sub: { type: string }
                sub_type: { enum: [user, service_account, service] }
        payload: { type: object }
    CouncilCreated:
      type: object
      additionalProperties: false
      required: [councilId, key, name, description, createdBy, createdAt]
      properties:
        councilId: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    CouncilArchived:
      type: object
      additionalProperties: false
      required: [councilId]
      properties:
        councilId: { $ref: '#/components/schemas/Uuid' }
    CouncilVersionPublished:
      type: object
      additionalProperties: false
      required: [councilId, councilVersionId, previousVersionId, version]
      properties:
        councilId: { $ref: '#/components/schemas/Uuid' }
        councilVersionId: { $ref: '#/components/schemas/Uuid' }
        previousVersionId:
          description: The version it replaced, now deprecated (`council-version.deprecated` follows); null for the first.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        version: { $ref: '#/components/schemas/CouncilVersion' }
    CouncilVersionDeprecated:
      type: object
      additionalProperties: false
      required: [councilId, councilVersionId]
      properties:
        councilId: { $ref: '#/components/schemas/Uuid' }
        councilVersionId: { $ref: '#/components/schemas/Uuid' }
    CouncilVersion:
      type: object
      description: The whole version, as `CouncilVersionResponse` in `agora.openapi.yaml` (immutable once created).
      additionalProperties: false
      required: [id, councilId, organizationId, version, status, facilitator, members, settings, discussion, createdBy, createdAt, publishedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        councilId: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { enum: [draft, published, deprecated] }
        facilitator:
          type: object
          required: [agentId]
          properties:
            agentId: { $ref: '#/components/schemas/Uuid' }
        members:
          type: array
          items:
            type: object
            required: [agentId, participation]
            properties:
              agentId: { $ref: '#/components/schemas/Uuid' }
              participation: { enum: [required, conditional, optional] }
              when: { type: string }
              role: { type: string }
        settings:
          type: object
          required: [defaultMode, allowDirectInteraction, allowDiscussion, allowPlanning, allowDelegation, requireSynthesis]
          properties:
            defaultMode: { enum: [direct, facilitated, discussion, planning, delegation] }
            allowDirectInteraction: { type: boolean }
            allowDiscussion: { type: boolean }
            allowPlanning: { type: boolean }
            allowDelegation: { type: boolean }
            requireSynthesis: { type: boolean }
        discussion:
          type: object
          required: [maxRounds, allowAgentResponses, requireFacilitatorConclusion]
          properties:
            maxRounds: { type: integer, minimum: 1 }
            allowAgentResponses: { type: boolean }
            requireFacilitatorConclusion: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    AgentCreated:
      type: object
      additionalProperties: false
      required: [agentId, name, description, createdBy, createdAt]
      properties:
        agentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    AgentArchived:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId: { $ref: '#/components/schemas/Uuid' }
    AgentVersionPublished:
      type: object
      additionalProperties: false
      required: [agentId, agentVersionId, policySetVersionId, previousVersionId, version]
      properties:
        agentId: { $ref: '#/components/schemas/Uuid' }
        agentVersionId: { $ref: '#/components/schemas/Uuid' }
        policySetVersionId:
          description: The policy set version it runs under (Themis); null until policies exist.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        previousVersionId:
          description: The version it replaced, now deprecated (`agent-version.deprecated` follows); null for the first.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        version: { $ref: '#/components/schemas/AgentVersion' }
    AgentVersionDeprecated:
      type: object
      additionalProperties: false
      required: [agentId, agentVersionId]
      properties:
        agentId: { $ref: '#/components/schemas/Uuid' }
        agentVersionId: { $ref: '#/components/schemas/Uuid' }
    AgentVersion:
      type: object
      description: The whole version, as `AgentVersionResponse` in `agora.openapi.yaml` (immutable once created).
      additionalProperties: false
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        agentId: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { enum: [draft, published, deprecated] }
        instructions: { type: string }
        model:
          type: object
          required: [provider, model]
          properties:
            provider: { type: string }
            model: { type: string }
            temperature: { type: number }
            maxTokens: { type: integer }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items:
            type: object
            required: [name, enabled]
            properties:
              name: { type: string }
              enabled: { type: boolean }
              tools:
                type: array
                items: { type: string }
        skills:
          type: array
          items:
            type: object
            required: [name, version, enabled]
            properties:
              name: { type: string }
              version: { type: string }
              enabled: { type: boolean }
        runtime:
          type: object
          required: [provider, executionMode, sandboxRequired]
          properties:
            provider: { type: string }
            executionMode: { enum: [standard, coding] }
            sandboxRequired: { type: boolean }
            networkAccess: { enum: [none, restricted] }
            allowedHosts:
              type: array
              items: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        publishedAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
    SkillCreated:
      type: object
      additionalProperties: false
      required: [skillId, name, createdBy, createdAt]
      properties:
        skillId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    SkillArchived:
      type: object
      additionalProperties: false
      required: [skillId]
      properties:
        skillId: { $ref: '#/components/schemas/Uuid' }
    SkillVersionPublished:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId, version]
      properties:
        skillId: { $ref: '#/components/schemas/Uuid' }
        skillVersionId: { $ref: '#/components/schemas/Uuid' }
        version: { $ref: '#/components/schemas/SkillVersion' }
    SkillVersion:
      type: object
      description: The whole version, as `SkillVersionResponse` in `agora.openapi.yaml` with its files (immutable once created).
      additionalProperties: false
      required: [id, skillId, organizationId, name, version, description, files, fileCount, sizeBytes, createdBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        skillId: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        description: { type: string }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
        fileCount: { type: integer, minimum: 1 }
        sizeBytes: { type: integer, minimum: 0 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
