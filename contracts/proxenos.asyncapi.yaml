asyncapi: 3.0.0
info:
  title: Proxenos events
  version: 0.3.0
  description: |
    Events Proxenos publishes to the `proxenos.events` topic exchange on
    RabbitMQ; the routing key is the event type. Every message is the Krepis
    `DomainEvent` envelope (see `../docs/events.md`), JSON, persistent, with
    the event ID as AMQP `messageId` and the event type as `type`.

    Delivery is at least once (transactional outbox and relay): deduplicate on
    `eventId`, and ignore an event whose `aggregateVersion` is not newer than
    the one already applied for that `aggregateId`.

    For now: the GitHub App's installations, the repository links of
    projects, pull requests, and issues and their comments on connected
    repositories (`../docs/git.md`), which Kairos's automations trigger on.
    Issue events have the webhook delivery as their aggregate: each is
    published once, and none replaces another.

defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from ../docker-compose.yml

channels:
  proxenosEvents:
    address: proxenos.events
    description: Topic exchange; consumers bind their own durable queue (`<consumer>.proxenos-events`) to the routing keys they need.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: proxenos.events
          type: topic
          durable: true
          autoDelete: false
    messages:
      installationChanged: { $ref: '#/components/messages/installationChanged' }
      repositoryLinked: { $ref: '#/components/messages/repositoryLinked' }
      repositoryUnlinked: { $ref: '#/components/messages/repositoryUnlinked' }
      pullRequestUpdated: { $ref: '#/components/messages/pullRequestUpdated' }
      githubIssueOpened: { $ref: '#/components/messages/githubIssueOpened' }
      githubIssueLabeled: { $ref: '#/components/messages/githubIssueLabeled' }
      githubIssueCommentCreated: { $ref: '#/components/messages/githubIssueCommentCreated' }

operations:
  publishProxenosEvents:
    action: send
    channel: { $ref: '#/channels/proxenosEvents' }
    messages:
      - $ref: '#/channels/proxenosEvents/messages/installationChanged'
      - $ref: '#/channels/proxenosEvents/messages/repositoryLinked'
      - $ref: '#/channels/proxenosEvents/messages/repositoryUnlinked'
      - $ref: '#/channels/proxenosEvents/messages/pullRequestUpdated'
      - $ref: '#/channels/proxenosEvents/messages/githubIssueOpened'
      - $ref: '#/channels/proxenosEvents/messages/githubIssueLabeled'
      - $ref: '#/channels/proxenosEvents/messages/githubIssueCommentCreated'

components:
  messages:
    githubIssueOpened:
      name: github.issue.opened
      summary: Someone opened an issue on a connected repository.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: github.issue.opened }
              payload: { $ref: '#/components/schemas/GitHubIssueEvent' }
    githubIssueLabeled:
      name: github.issue.labeled
      summary: Someone added a label to an issue (`label`).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: github.issue.labeled }
              payload: { $ref: '#/components/schemas/GitHubIssueEvent' }
    githubIssueCommentCreated:
      name: github.issue-comment.created
      summary: Someone commented on an issue (`commentId`; `isPullRequest` for a pull request's conversation).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: github.issue-comment.created }
              payload: { $ref: '#/components/schemas/GitHubIssueEvent' }
    installationChanged:
      name: git.installation-changed
      summary: |
        An installation was connected, suspended, unsuspended or deleted, or
        the repositories it covers changed. Stop starting tasks against
        repositories it lost (their links are gone already).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: git.installation-changed }
              payload: { $ref: '#/components/schemas/GitInstallationChanged' }
    repositoryLinked:
      name: git.repository-linked
      summary: A repository was linked to a project (`projectId` is also in the envelope).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: git.repository-linked }
              payload: { $ref: '#/components/schemas/GitRepositoryLinked' }
    repositoryUnlinked:
      name: git.repository-unlinked
      summary: A repository link was removed, by a person or because the installation lost the repository.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: git.repository-unlinked }
              payload: { $ref: '#/components/schemas/GitRepositoryUnlinked' }

    pullRequestUpdated:
      name: git.pull-request.updated
      summary: |
        A pull request on a connected repository was opened, changed,
        closed or merged (GitHub's `pull_request` webhook). `aggregateId`
        is Proxenos's record of the pull request; its `aggregateVersion`
        grows with every update.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: git.pull-request.updated }
              payload: { $ref: '#/components/schemas/GitPullRequestUpdated' }

  schemas:
    Uuid:
      type: string
      format: uuid
    Envelope:
      type: object
      description: Krepis's `DomainEvent`.
      required: [eventId, eventType, schemaVersion, aggregateId, aggregateVersion, occurredAt, organizationId, projectId, actor, payload]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid', description: 'UUIDv7; the deduplication key.' }
        eventType: { type: string }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        aggregateVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        projectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor:
          description: The caller whose request caused the event (from its Pistis token); null for GitHub's webhooks and other system work.
          oneOf:
            - type: 'null'
            - type: object
              required: [sub, sub_type]
              properties:
                sub: { type: string }
                sub_type: { enum: [user, service_account, service] }
                act:
                  type: object
                  properties:
                    sub: { type: string }
        payload: { type: object }
    # ---------- event payloads (the envelope's `payload`) ----------
    RepositoryRef:
      type: object
      additionalProperties: false
      required: [repositoryId, fullName]
      properties:
        repositoryId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
    GitInstallationChanged:
      type: object
      additionalProperties: false
      required: [installationId, provider, externalId, account, status, repositoriesAdded, repositoriesRemoved]
      properties:
        installationId: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [github] }
        externalId: { type: string }
        account: { type: string, description: The GitHub account's login. }
        status: { type: string, enum: [active, suspended, deleted] }
        repositoriesAdded:
          type: array
          items: { $ref: '#/components/schemas/RepositoryRef' }
        repositoriesRemoved:
          type: array
          items: { $ref: '#/components/schemas/RepositoryRef' }
    GitPullRequestUpdated:
      type: object
      additionalProperties: false
      required: [repositoryId, repository, number, url, state, branch, baseBranch, headSha, mergedAt, fromAetherOs]
      properties:
        repositoryId: { $ref: '#/components/schemas/Uuid' }
        repository: { type: string, description: '`owner/name`.' }
        number: { type: integer, minimum: 1 }
        url: { type: string }
        state: { type: string, enum: [open, closed, merged] }
        branch: { type: string, description: The head branch (`aether/<top-level task ID>` for Aether-os's). }
        baseBranch: { type: string }
        headSha: { type: string }
        mergedAt: { type: [string, 'null'], format: date-time }
        fromAetherOs: { type: boolean, description: The app's own bot made the change. }
    RepositoryPermission:
      type: string
      description: |
        The author's role on the repository, from GitHub (`docs/git.md`,
        Untrusted input: automations fire for `write` and above by
        default); `none` for someone without access.
      enum: [admin, maintain, write, triage, read, none]
    GitHubIssueEvent:
      type: object
      additionalProperties: false
      required: [webhookDeliveryId, deliveryId, repositoryId, repository, projectIds, links, number, title, url, isPullRequest, labels, label, commentId, author, authorPermission, fromAetherOs]
      properties:
        webhookDeliveryId:
          description: The stored delivery, whose full payload (the body, the comment) `GET /v1/organizations/{organizationId}/webhook-deliveries/{id}` returns.
          $ref: '#/components/schemas/Uuid'
        deliveryId: { type: string, description: "GitHub's `X-GitHub-Delivery`." }
        repositoryId: { $ref: '#/components/schemas/Uuid' }
        repository: { type: string, description: '`owner/name`.' }
        projectIds:
          type: array
          description: The projects the repository is linked to (none when it isn't linked yet).
          items: { $ref: '#/components/schemas/Uuid' }
        links:
          type: array
          description: The same projects with their repository link, whose ID a task working in the repository names (Hephaestus's `repository.linkId`).
          items:
            type: object
            additionalProperties: false
            required: [projectId, linkId]
            properties:
              projectId: { $ref: '#/components/schemas/Uuid' }
              linkId: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, minimum: 1 }
        title: { type: string, description: The issue's title, written by whoever opened it (untrusted). }
        url: { type: string }
        isPullRequest: { type: boolean, description: "A pull request's conversation (GitHub sends its comments as issue comments)." }
        labels:
          type: array
          description: The issue's labels after the event.
          items: { type: string }
        label: { type: [string, 'null'], description: The label added (`github.issue.labeled`). }
        commentId: { type: [string, 'null'], description: "GitHub's comment ID (`github.issue-comment.created`)." }
        author:
          type: object
          description: Who did it (opened, labeled or commented), GitHub's `sender`.
          additionalProperties: false
          required: [login, type]
          properties:
            login: { type: string }
            type: { type: string, description: '`User`, `Bot` or `Organization`.' }
        authorPermission:
          description: Their permission on the repository; null when GitHub couldn't be asked (treat as untrusted).
          oneOf:
            - $ref: '#/components/schemas/RepositoryPermission'
            - type: 'null'
        fromAetherOs: { type: boolean, description: "The app's own bot did it: automations ignore it unless they opt in (no loops)." }
    GitRepositoryLinked:
      type: object
      additionalProperties: false
      required: [linkId, projectId, repositoryId, fullName]
      properties:
        linkId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        repositoryId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
    GitRepositoryUnlinked:
      type: object
      additionalProperties: false
      required: [linkId, projectId, repositoryId, fullName, reason]
      properties:
        linkId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        repositoryId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        reason: { type: string, enum: [unlinked, repository-removed] }
