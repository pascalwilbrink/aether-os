asyncapi: 3.0.0
info:
  title: Hephaestus events and commands
  version: 0.10.0
  description: |
    Events Hephaestus publishes to the `hephaestus.events` topic exchange on
    RabbitMQ; the routing key is the event type. Every message is the Krepis
    `DomainEvent` envelope (see `../docs/events.md`), JSON, persistent, with
    the event ID as AMQP `messageId` and the event type as `type`.

    Delivery is at least once (transactional outbox and relay): deduplicate on
    `eventId`, and ignore an event whose `aggregateVersion` (the task's or
    artifact's `version`) is not newer than the one already applied for it.

    Every task and artifact event has the task's `projectId` in the envelope;
    artifact events have the artifact as their aggregate. Budget events are
    Pylon's (`pylon.asyncapi.yaml`).

    Hephaestus also **receives commands** on its own direct exchange,
    `hephaestus.commands` (routing key = the command name), from other
    platform services (Kairos). A command is the same envelope; its
    `eventId` is its idempotency key, its `organizationId` and `projectId`
    say where, and its `actor` (required) who sent it. The outcome comes
    back as events, never as a reply.

defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from ../docker-compose.yml

channels:
  hephaestusEvents:
    address: hephaestus.events
    description: Topic exchange; consumers bind their own durable queue (`<consumer>.hephaestus-events`) to the routing keys they need.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: hephaestus.events
          type: topic
          durable: true
          autoDelete: false
    messages:
      taskCreated: { $ref: '#/components/messages/taskCreated' }
      taskCreateRejected: { $ref: '#/components/messages/taskCreateRejected' }
      taskStatusChanged: { $ref: '#/components/messages/taskStatusChanged' }
      taskSucceeded: { $ref: '#/components/messages/taskSucceeded' }
      taskFailed: { $ref: '#/components/messages/taskFailed' }
      taskCancelled: { $ref: '#/components/messages/taskCancelled' }
      taskAwaitingReview: { $ref: '#/components/messages/taskAwaitingReview' }
      taskVerified: { $ref: '#/components/messages/taskVerified' }
      taskPaused: { $ref: '#/components/messages/taskPaused' }
      taskResumed: { $ref: '#/components/messages/taskResumed' }
      artifactCreated: { $ref: '#/components/messages/artifactCreated' }
      artifactStatusChanged: { $ref: '#/components/messages/artifactStatusChanged' }

  hephaestusCommands:
    address: hephaestus.commands
    description: Direct exchange owned by Hephaestus; it consumes its own durable queue `hephaestus.commands`, bound to the command names.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: hephaestus.commands
          type: direct
          durable: true
          autoDelete: false
    messages:
      taskCreate: { $ref: '#/components/messages/taskCreate' }

operations:
  receiveHephaestusCommands:
    action: receive
    channel: { $ref: '#/channels/hephaestusCommands' }
    messages:
      - $ref: '#/channels/hephaestusCommands/messages/taskCreate'
  publishHephaestusEvents:
    action: send
    channel: { $ref: '#/channels/hephaestusEvents' }
    messages:
      - $ref: '#/channels/hephaestusEvents/messages/taskCreated'
      - $ref: '#/channels/hephaestusEvents/messages/taskCreateRejected'
      - $ref: '#/channels/hephaestusEvents/messages/taskStatusChanged'
      - $ref: '#/channels/hephaestusEvents/messages/taskSucceeded'
      - $ref: '#/channels/hephaestusEvents/messages/taskFailed'
      - $ref: '#/channels/hephaestusEvents/messages/taskCancelled'
      - $ref: '#/channels/hephaestusEvents/messages/taskAwaitingReview'
      - $ref: '#/channels/hephaestusEvents/messages/taskVerified'
      - $ref: '#/channels/hephaestusEvents/messages/taskPaused'
      - $ref: '#/channels/hephaestusEvents/messages/taskResumed'
      - $ref: '#/channels/hephaestusEvents/messages/artifactCreated'
      - $ref: '#/channels/hephaestusEvents/messages/artifactStatusChanged'

components:
  messages:
    taskCreate:
      name: task.create
      summary: A command to create a task (docs/events.md, Commands); answered with `task.created` or `task.create-rejected`.
      description: |
        Handled like `POST …/tasks` or, with `template`, `POST
        …/task-templates/{templateId}/tasks`, by the same services, with the
        envelope's `eventId` as the idempotency key: a redelivered or resent
        command never creates a second task, and `task.created` is published
        again for the task it created. The task's `requestedBy` is the
        envelope's `actor.sub`. A command that can't become a task (an
        unpublished agent, an archived project, invalid fields) is answered
        with `task.create-rejected` and not retried.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [projectId, actor]
            properties:
              eventType: { const: task.create }
              projectId: { $ref: '#/components/schemas/Uuid' }
              payload: { $ref: '#/components/schemas/TaskCreate' }
    taskCreateRejected:
      name: task.create-rejected
      summary: A `task.create` command couldn't become a task; its aggregate is the command (`aggregateId` = its `eventId`).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.create-rejected }
              payload: { $ref: '#/components/schemas/TaskCreateRejected' }
    taskPaused:
      name: task.paused
      summary: A budget ran out (docs/models.md); the task resumes when it's raised or renewed (Kerykes tells the budget's admins).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.paused }
              payload: { $ref: '#/components/schemas/TaskPaused' }
    taskResumed:
      name: task.resumed
      summary: The budget that paused a task has room again; it's queued.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.resumed }
              payload: { $ref: '#/components/schemas/TaskResumed' }
    taskVerified:
      name: task.verified
      summary: Hephaestus checked a run against the task's acceptance criteria (Kriterion tracks pass rates).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.verified }
              payload: { $ref: '#/components/schemas/TaskVerified' }
    taskAwaitingReview:
      name: task.awaiting-review
      summary: A task's drafts wait for someone with `task:approve` (Kerykes tells them).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.awaiting-review }
              payload: { $ref: '#/components/schemas/TaskAwaitingReview' }
    artifactCreated:
      name: artifact.created
      summary: An agent recorded an artifact (`pending` until its execution ends).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: artifact.created }
              payload: { $ref: '#/components/schemas/ArtifactCreated' }
    artifactStatusChanged:
      name: artifact.status-changed
      summary: An artifact's status changed (e.g. `pending` → `final` or `partial`).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: artifact.status-changed }
              payload: { $ref: '#/components/schemas/ArtifactStatusChanged' }
    taskCreated:
      name: task.created
      summary: A task (or subtask) was created; its agent version is pinned.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.created }
              payload: { $ref: '#/components/schemas/TaskCreated' }
    taskStatusChanged:
      name: task.status-changed
      summary: A task moved from one state to another.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.status-changed }
              payload: { $ref: '#/components/schemas/TaskStatusChanged' }
    taskSucceeded:
      name: task.succeeded
      summary: A task succeeded (terminal).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.succeeded }
              payload: { $ref: '#/components/schemas/TaskSucceeded' }
    taskFailed:
      name: task.failed
      summary: A task failed (terminal; it can be retried).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.failed }
              payload: { $ref: '#/components/schemas/TaskFailed' }
    taskCancelled:
      name: task.cancelled
      summary: A task was cancelled (terminal).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: task.cancelled }
              payload: { $ref: '#/components/schemas/TaskCancelled' }

  schemas:
    # ---------- command payloads ----------
    TaskCreate:
      type: object
      additionalProperties: false
      description: Exactly one of `task` and `template`.
      properties:
        automationId:
          description: The Kairos automation that sent it, echoed in `task.create-rejected`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        task:
          type: object
          description: |
            A `CreateTaskRequest` of `hephaestus.openapi.yaml` (title,
            instructions, agentId, serviceAccountId, and the optional
            fields), validated against that schema. Not repeated here: the
            HTTP API's schema is the one definition.
        template:
          type: object
          description: |
            A task from a template: `templateId` (UUID) plus a
            `CreateTaskFromTemplateRequest` of `hephaestus.openapi.yaml`
            (serviceAccountId, version, inputs, and the optional fields),
            validated against that schema.
    TaskCreateRejected:
      type: object
      additionalProperties: false
      required: [idempotencyKey, automationId, code, message]
      properties:
        idempotencyKey:
          type: string
          description: The command's `eventId`.
        automationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        code:
          type: string
          description: The problem's code, as the HTTP API would give it (`VALIDATION_FAILED`, `AGENT_NOT_PUBLISHED`, `PROJECT_ARCHIVED`, `NOT_FOUND`, …).
        message: { type: string }
    # ---------- event payloads ----------
    Uuid: { type: string, format: uuid }
    Envelope:
      type: object
      description: Krepis's `DomainEvent`.
      required: [eventId, eventType, schemaVersion, aggregateId, aggregateVersion, occurredAt, organizationId, projectId, actor, payload]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid', description: 'UUIDv7; the deduplication key.' }
        eventType: { type: string }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        aggregateVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        projectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor:
          description: The caller whose request caused the event (from its Pistis token); null for system work.
          oneOf:
            - type: 'null'
            - type: object
              required: [sub, sub_type]
              properties:
                sub: { type: string }
                sub_type: { enum: [user, service_account, service] }
                act:
                  type: object
                  properties:
                    sub: { type: string }
        payload: { type: object }
    # ---------- event payloads (the envelope's `payload`) ----------
    TaskCreated:
      type: object
      additionalProperties: false
      required: [taskId, parentTaskId, topLevelTaskId, agentId, agentVersionId, serviceAccountId, requestedBy, idempotencyKey, status, taskTemplateId, taskTemplateVersion]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        parentTaskId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        agentId: { $ref: '#/components/schemas/Uuid' }
        agentVersionId: { $ref: '#/components/schemas/Uuid' }
        serviceAccountId: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        idempotencyKey: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        taskTemplateId:
          type: [string, 'null']
          format: uuid
        taskTemplateVersion:
          type: [integer, 'null']
          minimum: 1
    TaskStatusChanged:
      type: object
      additionalProperties: false
      required: [taskId, from, to, reason]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        from: { $ref: '#/components/schemas/TaskStatus' }
        to: { $ref: '#/components/schemas/TaskStatus' }
        reason:
          type: [string, 'null']
          description: Why, when there is one (a failure reason, `retry`, `cancelled-with-parent`, `dependencies-met`).
    TaskSucceeded:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId, requestedBy, primaryArtifactId, artifactIds]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        primaryArtifactId: { $ref: '#/components/schemas/Uuid' }
        artifactIds:
          type: array
          description: Every `final` artifact of the task, the primary one included.
          items: { $ref: '#/components/schemas/Uuid' }
    TaskVerified:
      type: object
      additionalProperties: false
      required: [taskId, executionId, agentVersionId, round, passed, results]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        executionId: { $ref: '#/components/schemas/Uuid' }
        agentVersionId: { $ref: '#/components/schemas/Uuid' }
        round: { type: integer, minimum: 1 }
        passed: { type: boolean, description: No criterion failed (manual ones are left to the reviewer). }
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, outcome]
            properties:
              key: { type: string }
              outcome: { type: string, enum: [passed, failed, manual] }
    TaskAwaitingReview:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId, requestedBy, draftArtifactIds, round]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        draftArtifactIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        round: { type: integer, minimum: 1, description: '1 for the first review, plus one per revision.' }
    ArtifactCreated:
      type: object
      additionalProperties: false
      required: [artifactId, taskId, executionId, kind, status, primary]
      properties:
        artifactId: { $ref: '#/components/schemas/Uuid' }
        taskId: { $ref: '#/components/schemas/Uuid' }
        executionId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, description: 'An open set: `text`, `json`, `verification`, `pull_request` so far.' }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        primary: { type: boolean }
    ArtifactStatusChanged:
      type: object
      additionalProperties: false
      required: [artifactId, taskId, from, to, revisionOf]
      properties:
        artifactId: { $ref: '#/components/schemas/Uuid' }
        taskId: { $ref: '#/components/schemas/Uuid' }
        from: { $ref: '#/components/schemas/ArtifactStatus' }
        to: { $ref: '#/components/schemas/ArtifactStatus' }
        revisionOf: { type: [string, 'null'], format: uuid }
    ArtifactStatus:
      enum: [pending, draft, final, rejected, changes_requested, partial]
    TaskFailed:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId, requestedBy, failureReason]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        failureReason: { $ref: '#/components/schemas/TaskFailureReason' }
    TaskCancelled:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId, cancelledBy]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        cancelledBy:
          type: [string, 'null']
          description: The `sub` of whoever cancelled it (the task itself or an ancestor); null when the system did.
    BudgetScope:
      enum: [organization, project, agent, task_tree]
    TaskPaused:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId, requestedBy, scope]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        scope:
          description: The budget that ran out.
          $ref: '#/components/schemas/BudgetScope'
    TaskResumed:
      type: object
      additionalProperties: false
      required: [taskId, topLevelTaskId]
      properties:
        taskId: { $ref: '#/components/schemas/Uuid' }
        topLevelTaskId: { $ref: '#/components/schemas/Uuid' }
    TaskStatus:
      enum: [blocked, queued, provisioning, running, verifying, awaiting_review, waiting, paused, delivering, succeeded, failed, cancelled]
    TaskFailureReason:
      enum: [agent_failed, verification_failed, rejected, timeout, budget_exceeded, infrastructure, subtask_failed, access_denied]
