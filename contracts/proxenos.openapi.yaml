openapi: 3.1.0
info:
  title: Proxenos API
  version: 0.2.0
  description: |
    Connections to external systems (see `../docs/git.md`). For now: the
    GitHub App. An organization **connects** the app (installs it on a GitHub
    account), Proxenos records the **installation** and the **repositories**
    it covers, and a project admin **links** repositories to a project. A
    running task gets a short-lived **token** for a linked repository, narrowed
    to that repository and to read or write. GitHub's **webhooks** arrive at
    one public endpoint, verified and deduplicated.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details,
    cursor pagination, UUIDs. Every route needs a Pistis access token except
    GitHub's two entry points (the setup callback and the webhook), which
    prove themselves in other ways.

security:
  - pistis: []

tags:
  - name: installations
  - name: repositories
  - name: github
  - name: webhooks

paths:
  /v1/organizations/{organizationId}/github/connect:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [installations]
      operationId: connectGitHub
      x-permission: '`org:manage`'
      description: |
        Starts connecting the GitHub App: a single-use `state` (10 minutes)
        bound to this organization and the caller, and the app's installation
        page to send the person to. GitHub comes back to `GET /v1/github/setup`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubConnectRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubConnectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/github/setup:
    get:
      tags: [github]
      operationId: githubSetup
      x-permission: 'none: GitHub sends the browser here after an installation; the single-use `state` and the installing person''s GitHub authorization (`code`) are the proof'
      security: []
      description: |
        Where GitHub sends people after installing the app (its callback
        URL, with "Request user authorization (OAuth) during installation"
        on). Proxenos checks the `state`, redeems
        `code` for the person's GitHub token and checks with it that they can
        access the installation, then records the installation and its
        repositories for the state's organization. Always answers with a
        redirect back to Iris: `?github=connected`, or `?github=failed&reason=…`.
      parameters:
        - { name: installation_id, in: query, required: false, schema: { type: string, pattern: '^[0-9]{1,20}$' } }
        - { name: setup_action, in: query, required: false, schema: { type: string, maxLength: 50 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '303':
          description: Back to Iris.
          headers:
            Location: { schema: { type: string } }

  /v1/webhooks/github:
    post:
      tags: [github]
      operationId: githubWebhook
      x-permission: 'none: every delivery is verified with `X-Hub-Signature-256` (the app''s webhook secret) before anything else'
      security: []
      description: |
        GitHub's webhook deliveries. Unverified requests are refused (`401`).
        A delivery is stored once (`X-GitHub-Delivery`; a redelivery is
        acknowledged without being handled again). Installation events
        (`installation`, `installation_repositories`) update installations,
        their repositories and links, and publish `git.installation-changed`;
        `pull_request` events on connected repositories publish
        `git.pull-request.updated`.
      parameters:
        - { name: x-github-event, in: header, required: true, schema: { type: string, maxLength: 100 } }
        - { name: x-github-delivery, in: header, required: true, schema: { type: string, maxLength: 100 } }
        - { name: x-hub-signature-256, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Accepted (or already received). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/installations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [installations]
      operationId: listInstallations
      x-permission: '`org:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/installations/{installationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [installations]
      operationId: getInstallation
      x-permission: '`org:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/installations/{installationId}/sync:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InstallationId'
    post:
      tags: [installations]
      operationId: syncInstallation
      x-permission: '`org:manage`'
      description: |
        Reads the installation and its repositories from GitHub again (when a
        webhook was missed). Same effect as the webhooks: repositories it no
        longer covers lose their links.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/repositories:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [repositories]
      operationId: listRepositories
      x-permission: '`org:read`'
      description: The repositories the organization's installations cover (`available`), to link to projects.
      parameters:
        - name: installationId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By full name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/repositories:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [repositories]
      operationId: linkRepository
      x-permission: '`project:manage` in that project'
      description: |
        Links one of the organization's available repositories to the
        project, which is then repository-backed (`../docs/tasks.md`). A
        repository can be linked to several projects, once each.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkRepositoryRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryLinkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [repositories]
      operationId: listRepositoryLinks
      x-permission: '`project:read` in that project'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryLinkPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/repositories/{linkId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/LinkId'
    get:
      tags: [repositories]
      operationId: getRepositoryLink
      x-permission: '`project:read` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryLinkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [repositories]
      operationId: unlinkRepository
      x-permission: '`project:manage` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Unlinked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/repositories/{linkId}/tokens:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [repositories]
      operationId: createRepositoryToken
      x-permission: '`repository:token` in that project, with a task token (Hephaestus, for one of the project''s tasks)'
      description: |
        A GitHub installation token for this one repository, at most an hour,
        never stored. `read`: contents and metadata, to clone and fetch.
        `write`: also contents and pull requests, to push `aether/*` branches
        and open pull requests (Hephaestus does, never the sandbox).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepositoryTokenRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryTokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/webhook-deliveries/{deliveryId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: deliveryId
        in: path
        required: true
        description: The stored delivery's ID (an event's `webhookDeliveryId`), not GitHub's.
        schema: { type: string, format: uuid }
    get:
      tags: [webhooks]
      operationId: getWebhookDelivery
      x-permission: '`org:read`; platform services with `platform:read` (Kairos)'
      description: |
        A webhook delivery GitHub sent for one of the organization's
        installations, with its full payload: what an event left out, such
        as an issue's body or a comment (untrusted: written by whoever
        opened or commented).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - INSTALLATION_NOT_ACTIVE
        - REPOSITORY_UNAVAILABLE
        - REPOSITORY_ALREADY_LINKED
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- connecting ----------
    GitHubConnectRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          type: string
          maxLength: 500
          pattern: '^/[A-Za-z0-9_-]'
          description: A path in Iris to come back to after the installation (default `/orgs/<organizationId>`).
    GitHubConnectResponse:
      type: object
      required: [installUrl, expiresAt]
      properties:
        installUrl:
          type: string
          format: uri
          description: The GitHub App's installation page, with the `state`.
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    # ---------- installations ----------
    InstallationStatus:
      type: string
      enum: [active, suspended, deleted]
      description: '`deleted`: uninstalled on GitHub; its repositories are unavailable and their links gone.'
    InstallationResponse:
      type: object
      required: [id, organizationId, provider, externalId, account, repositorySelection, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        provider: { type: string, enum: [github] }
        externalId:
          type: string
          description: GitHub's installation ID.
        account:
          type: object
          required: [login, type]
          properties:
            login: { type: string }
            type: { type: string, enum: [Organization, User] }
        repositorySelection:
          type: string
          enum: [all, selected]
          description: Whether the installation covers all the account's repositories or a chosen few.
        status: { $ref: '#/components/schemas/InstallationStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { type: integer, minimum: 1 }
    InstallationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InstallationResponse' }

    # ---------- repositories ----------
    RepositoryStatus:
      type: string
      enum: [available, removed]
      description: '`removed`: the installation no longer covers it (or was uninstalled).'
    RepositoryResponse:
      type: object
      required: [id, organizationId, installationId, externalId, fullName, defaultBranch, private, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        externalId:
          type: string
          description: GitHub's repository ID.
        fullName:
          type: string
          description: '`owner/name`.'
        defaultBranch: { type: string }
        private: { type: boolean }
        status: { $ref: '#/components/schemas/RepositoryStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    RepositoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RepositoryResponse' }

    # ---------- links ----------
    LinkRepositoryRequest:
      type: object
      additionalProperties: false
      required: [repositoryId]
      properties:
        repositoryId: { type: string, format: uuid }
    RepositoryLinkResponse:
      type: object
      required: [id, organizationId, projectId, repository, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        repository: { $ref: '#/components/schemas/RepositoryResponse' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    RepositoryLinkPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RepositoryLinkResponse' }

    # ---------- tokens ----------
    RepositoryAccess:
      type: string
      enum: [read, write]
    CreateRepositoryTokenRequest:
      type: object
      additionalProperties: false
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/RepositoryAccess' }
    RepositoryTokenResponse:
      type: object
      required: [token, expiresAt, access, repository, committer]
      properties:
        token:
          type: string
          description: Use as the password with user `x-access-token` for HTTPS Git, or as a bearer token for GitHub's API. Never store it.
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        access: { $ref: '#/components/schemas/RepositoryAccess' }
        repository:
          type: object
          required: [fullName, cloneUrl, defaultBranch, apiUrl]
          properties:
            fullName: { type: string }
            cloneUrl: { type: string, format: uri }
            defaultBranch: { type: string }
            apiUrl:
              type: string
              format: uri
              description: GitHub's REST API for this repository's host (github.com's, or a GitHub Enterprise Server's), for pull requests.
        committer:
          type: object
          required: [name, email]
          description: The GitHub App's bot identity (`<slug>[bot]`), which commits Aether-os makes are made as (docs/git.md).
          properties:
            name: { type: string }
            email: { type: string }

    # ---------- webhook deliveries ----------
    WebhookDeliveryResponse:
      type: object
      required: [id, organizationId, deliveryId, event, action, receivedAt, payload]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        deliveryId: { type: string, description: "GitHub's `X-GitHub-Delivery`." }
        event: { type: string, description: "GitHub's `X-GitHub-Event` (`issues`, `issue_comment`, …)." }
        action: { type: [string, 'null'] }
        receivedAt: { $ref: '#/components/schemas/Timestamp' }
        payload:
          type: object
          additionalProperties: true
          description: As GitHub sent it.
