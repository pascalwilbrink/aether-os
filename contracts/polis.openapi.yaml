openapi: 3.1.0
info:
  title: Polis API
  version: 0.11.0
  description: |
    Tenancy service for Aether-os: organizations, their optional
    departments (which group projects), persons (the people in an
    organization, in any of its departments), the projects inside them,
    memberships (which principal belongs to which organization, with which
    roles) and project memberships (a member's role in one project).
    Other services store organization and project IDs and resolve them here.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Actions are idempotent: suspending a suspended organization, or
    archiving an archived project, returns the unchanged resource.

    Every operation needs a Pistis access token (`Authorization: Bearer`);
    `x-permission` names what it requires (`../docs/identity.md`). Tokens are
    scoped to one organization: an `{organizationId}` other than the token's
    is 404. Platform services call with their own token and its platform
    permissions (`platform:read`, `platform:manage`). `createdBy` is the
    caller's `sub`.

security:
  - pistis: []

tags:
  - name: organizations
  - name: departments
  - name: persons
  - name: teams
  - name: projects
  - name: memberships
  - name: project-memberships

paths:
  /v1/organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      x-permission: 'any user (becomes its `owner`), or a platform service with `platform:manage`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [organizations]
      operationId: listOrganizations
      x-permission: 'platform services with `platform:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/organizations/by-slug/{slug}:
    get:
      tags: [organizations]
      operationId: getOrganizationBySlug
      x-permission: 'the token''s own organization, or `platform:read`'
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      operationId: getOrganization
      x-permission: '`org:read`, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/suspend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      operationId: suspendOrganization
      x-permission: '`platform:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Suspended (or already suspended)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      operationId: activateOrganization
      x-permission: '`platform:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Active (or already active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/departments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [departments]
      operationId: createDepartment
      x-permission: '`org:manage`'
      description: |
        Creates an active department. Departments are optional: they group
        an organization's projects (a project is in at most one). They grant
        no permissions: roles stay on organization and project memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [departments]
      operationId: listDepartments
      x-permission: '`org:read`, or `platform:read`'
      parameters:
        - name: status
          in: query
          required: false
          description: Only active, or only archived, departments.
          schema: { $ref: '#/components/schemas/DepartmentStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/departments/{departmentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DepartmentId'
    get:
      tags: [departments]
      operationId: getDepartment
      x-permission: '`org:read`, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [departments]
      operationId: updateDepartment
      x-permission: '`org:manage`'
      description: |
        Replaces the name and description (the slug stays). Unchanged → no
        new version and no event. An archived department can't be changed
        (`DEPARTMENT_ARCHIVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/departments/{departmentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DepartmentId'
    post:
      tags: [departments]
      operationId: archiveDepartment
      x-permission: '`org:manage`'
      description: |
        Archives the department (final). Refused while an active project is
        in it (`DEPARTMENT_HAS_PROJECTS`): move those projects out first.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/persons/announce:
    post:
      tags: [persons]
      operationId: announcePersons
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Publishes every person of every organization again as `person.updated`,
        at their current version (no new version): the backfill for services
        that keep a copy of the persons (Ergon) and missed ones created before
        they subscribed. Deleted persons are gone and aren't announced.

        Consumers keep what they have when it's as new, so running it again
        is harmless.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The events are in the outbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementResponse' }

  /v1/organizations/{organizationId}/persons:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [persons]
      operationId: createPerson
      x-permission: '`member:manage`'
      description: |
        Records a person of the organization, in any of its active
        departments (`DEPARTMENT_ARCHIVED`; another organization's is `404`).
        The email address is unique in the organization
        (`PERSON_EMAIL_TAKEN`, compared case-insensitively). A person is
        linked to the Pistis user with the same email address (`userId`),
        when exactly one user has it and no other person of the organization
        is linked to them; otherwise when such a user is created later.
        Persons grant nothing: roles stay on memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [persons]
      operationId: listPersons
      x-permission: '`member:read`, or `platform:read`'
      parameters:
        - name: departmentId
          in: query
          required: false
          description: Only the persons in this department.
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          required: false
          description: Only the person linked to this Pistis user.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: personId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [persons]
      operationId: getPerson
      x-permission: '`member:read`, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [persons]
      operationId: updatePerson
      x-permission: '`member:manage`'
      description: |
        Replaces the person's fields and departments (departments it joins
        must be active; one it stays in may be archived). A new email
        address links the person anew: to the one user with that address,
        else to no one. Unchanged → no new version and no event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [persons]
      operationId: deletePerson
      x-permission: '`member:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/teams:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [teams]
      operationId: createTeam
      x-permission: '`org:manage`'
      description: |
        Creates an active team of the organization, in any of its active
        departments (`DEPARTMENT_ARCHIVED`; another organization's is
        `404`). Its slug is unique in the organization (`TEAM_SLUG_TAKEN`).
        Teams grant nothing: roles stay on memberships. Its people are
        persons, added with `…/members`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [teams]
      operationId: listTeams
      x-permission: '`org:read`, or `platform:read`'
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TeamStatus' }
        - name: departmentId
          in: query
          required: false
          description: Only the teams in this department.
          schema: { type: string, format: uuid }
        - name: personId
          in: query
          required: false
          description: Only the teams this person is in.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      operationId: getTeam
      x-permission: '`org:read`, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [teams]
      operationId: updateTeam
      x-permission: '`org:manage`'
      description: |
        Replaces the name, description and departments (the slug stays;
        departments it joins must be active, one it stays in may be
        archived). Unchanged → no new version and no event. An archived team
        can't be changed (`TEAM_ARCHIVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/teams/{teamId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [teams]
      operationId: archiveTeam
      x-permission: '`org:manage`'
      description: Archives the team (final); its members and departments stay, for the record.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [teams]
      operationId: addTeamMember
      x-permission: '`org:manage`'
      description: |
        Adds a person of the organization to the team (another
        organization's is `404`), once (`TEAM_MEMBER_EXISTS`); the team must
        be active (`TEAM_ARCHIVED`). Deleting the person removes them from
        their teams.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTeamMemberRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [teams]
      operationId: listTeamMembers
      x-permission: '`org:read`, or `platform:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/teams/{teamId}/members/{personId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TeamId'
      - name: personId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      x-permission: '`org:manage`'
      description: Takes the person out of the team (`404` when they aren't in it); the team must be active.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [projects]
      operationId: createProject
      x-permission: '`project:create`'
      description: |
        Creates an active project. Its creator gets the highest role their
        organization role allows in it (a `member` becomes `approver`, a
        service account `editor`), so they can open it; owners and admins get
        none, being admins in every project already. With a `departmentId`
        it's in that department, which must be active (`DEPARTMENT_ARCHIVED`;
        another organization's is `404`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [projects]
      operationId: listProjects
      x-permission: '`org:read`; lists only the projects the caller can read (all with `platform:read`)'
      parameters:
        - name: departmentId
          in: query
          required: false
          description: Only the projects in this department.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      x-permission: '`project:read` in that project, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: archiveProject
      x-permission: '`project:manage` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/department:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [projects]
      operationId: setProjectDepartment
      x-permission: '`project:manage` in that project'
      description: |
        Moves the project into a department, or out of one (`null`). The
        department must be active (`DEPARTMENT_ARCHIVED`) and the project
        too (`PROJECT_ARCHIVED`). Unchanged → no new version and no event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProjectDepartmentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [memberships]
      operationId: createMembership
      x-permission: '`member:manage`; granting `owner` needs an `owner`'
      description: Adds a principal to the organization with one or more roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [memberships]
      operationId: listMemberships
      x-permission: '`member:read`, or `platform:read` (Pistis, for the organization''s people)'
      parameters:
        - name: subjectType
          in: query
          required: false
          description: Only users, or only service accounts.
          schema: { $ref: '#/components/schemas/SubjectType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [memberships]
      operationId: getMembership
      x-permission: '`member:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [memberships]
      operationId: updateMembership
      x-permission: '`member:manage`; changing an `owner`''s roles, or granting `owner`, needs an `owner`'
      description: |
        Replaces the membership's roles. The organization keeps at least one
        owner: taking `owner` from the last one is `LAST_OWNER`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [memberships]
      operationId: deleteMembership
      x-permission: '`member:manage`; removing an `owner` needs an `owner`'
      description: |
        Removes the principal from the organization; never its last owner
        (`LAST_OWNER`).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/memberships:
    get:
      tags: [memberships]
      operationId: listMembershipsOfSubject
      x-permission: 'the caller''s own memberships (`subject` = the token''s `sub`), or `platform:read`'
      description: |
        Every organization membership of one principal, across organizations,
        with each organization's name and slug. Pistis uses it to put
        organization and role claims in tokens; Iris to let a person choose an
        organization (they can't read organizations before they have a token
        for one).
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SubjectType' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Subject' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/organizations/{organizationId}/projects/{projectId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [project-memberships]
      operationId: createProjectMembership
      x-permission: '`project-member:manage` in that project'
      description: |
        Grants a member of the organization one role in the project. The
        role can't exceed what the organization role allows (`member` →
        `approver`, `viewer` → `viewer`; `PROJECT_ROLE_EXCEEDS_CAP`), and a
        service account is never an `approver`. The principal must be a
        member of the organization (`PROJECT_MEMBER_NOT_IN_ORGANIZATION`);
        the project must be active (`PROJECT_ARCHIVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [project-memberships]
      operationId: listProjectMemberships
      x-permission: '`project:read` in that project'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [project-memberships]
      operationId: getProjectMembership
      x-permission: '`project:read` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [project-memberships]
      operationId: updateProjectMembership
      x-permission: '`project-member:manage` in that project'
      description: Replaces the role (same cap as granting).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [project-memberships]
      operationId: deleteProjectMembership
      x-permission: '`project-member:manage` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/project-memberships:
    get:
      tags: [project-memberships]
      operationId: listProjectMembershipsOfSubject
      x-permission: "the caller's own (`subject` = the token's `sub`), or `platform:read`"
      description: |
        One principal's project roles in one organization. Pistis uses it to
        put `project_roles` in tokens.
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SubjectType' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Subject' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - ORGANIZATION_SLUG_TAKEN
        - ORGANIZATION_SUSPENDED
        - PROJECT_SLUG_TAKEN
        - MEMBERSHIP_EXISTS
        - PROJECT_ARCHIVED
        - PROJECT_MEMBERSHIP_EXISTS
        - PROJECT_MEMBER_NOT_IN_ORGANIZATION
        - PROJECT_ROLE_EXCEEDS_CAP
        - DEPARTMENT_SLUG_TAKEN
        - DEPARTMENT_ARCHIVED
        - DEPARTMENT_HAS_PROJECTS
        - PERSON_EMAIL_TAKEN
        - TEAM_SLUG_TAKEN
        - TEAM_ARCHIVED
        - TEAM_MEMBER_EXISTS
        - LAST_OWNER
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Slug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      description: Lowercase letters, digits and single hyphens.
    Timestamp:
      type: string
      format: date-time
    Version:
      type: integer
      minimum: 1
      description: |
        Increases with every change; the same number as the `aggregateVersion`
        of the resource's events, so a consumer can tell whether what it
        fetched is newer than an event it receives.

    # ---------- organizations ----------
    OrganizationStatus:
      type: string
      enum: [active, suspended]
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { $ref: '#/components/schemas/Slug' }
    OrganizationResponse:
      type: object
      required: [id, name, slug, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/OrganizationStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    OrganizationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrganizationResponse' }

    # ---------- departments ----------
    DepartmentStatus:
      type: string
      enum: [active, archived]
    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name, slug, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          $ref: '#/components/schemas/Slug'
          description: Unique within the organization.
        description: { type: string, maxLength: 2000 }
    UpdateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    DepartmentResponse:
      type: object
      required: [id, organizationId, name, slug, description, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/DepartmentStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    DepartmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DepartmentResponse' }

    # ---------- persons ----------
    PersonRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          format: email
          maxLength: 320
          description: Unique in the organization (case-insensitive); stored in lowercase. Links the person to the Pistis user with this address.
        description: { type: string, maxLength: 2000, default: '' }
        role:
          type: [string, 'null']
          maxLength: 200
          description: Their job title, e.g. "Backend engineer". Informational; permissions stay on memberships.
        gender:
          type: [string, 'null']
          maxLength: 100
          description: As the person describes it; optional.
        departmentIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
          description: The organization's departments the person is in.
    PersonResponse:
      type: object
      required: [id, organizationId, name, email, description, role, gender, departmentIds, userId, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        description: { type: string }
        role: { type: [string, 'null'] }
        gender: { type: [string, 'null'] }
        departmentIds:
          type: array
          items: { type: string, format: uuid }
        userId:
          type: [string, 'null']
          format: uuid
          description: The Pistis user (their `sub`) with the same email address, once linked.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    AnnouncementResponse:
      type: object
      required: [announced]
      properties:
        announced:
          type: integer
          minimum: 0
          description: How many were published.
    PersonPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PersonResponse' }

    # ---------- teams ----------
    TeamStatus:
      type: string
      enum: [active, archived]
    TeamDepartmentIds:
      type: array
      maxItems: 50
      uniqueItems: true
      items: { type: string, format: uuid }
      description: The organization's departments the team is in.
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          $ref: '#/components/schemas/Slug'
          description: Unique within the organization.
        description: { type: string, maxLength: 2000, default: '' }
        departmentIds:
          $ref: '#/components/schemas/TeamDepartmentIds'
          default: []
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, description, departmentIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        departmentIds: { $ref: '#/components/schemas/TeamDepartmentIds' }
    TeamResponse:
      type: object
      required: [id, organizationId, name, slug, description, departmentIds, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        departmentIds:
          type: array
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TeamStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    TeamPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TeamResponse' }
    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId: { type: string, format: uuid, description: A person of the organization. }
    TeamMemberResponse:
      type: object
      required: [teamId, personId, addedBy, addedAt]
      properties:
        teamId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        addedBy: { type: string }
        addedAt: { $ref: '#/components/schemas/Timestamp' }
    TeamMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TeamMemberResponse' }

    # ---------- projects ----------
    ProjectStatus:
      type: string
      enum: [active, archived]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, slug, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          $ref: '#/components/schemas/Slug'
          description: Unique within the organization.
        description: { type: string, maxLength: 2000 }
        departmentId:
          type: [string, 'null']
          format: uuid
          description: The department it's in; none when left out.
    SetProjectDepartmentRequest:
      type: object
      additionalProperties: false
      required: [departmentId]
      properties:
        departmentId:
          type: [string, 'null']
          format: uuid
          description: The department to move it into; `null` takes it out of its department.
    ProjectResponse:
      type: object
      required: [id, organizationId, name, slug, description, departmentId, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        departmentId:
          type: [string, 'null']
          format: uuid
          description: The department it's in, if any.
        status: { $ref: '#/components/schemas/ProjectStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectResponse' }

    # ---------- memberships ----------
    SubjectType:
      type: string
      enum: [user, service_account]
      description: The kind of principal (`sub_type` in Pistis tokens).
    Subject:
      type: string
      minLength: 1
      maxLength: 255
      description: The principal's Pistis `sub`.
    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]
      description: A fixed organization role (see `docs/identity.md`).
    OrganizationRoles:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/OrganizationRole' }
      description: |
        One or more roles. Duplicates are ignored; responses list each role
        once, in the order owner, admin, member, viewer.
    CreateMembershipRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subject, roles]
      properties:
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { $ref: '#/components/schemas/Subject' }
        roles: { $ref: '#/components/schemas/OrganizationRoles' }
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles: { $ref: '#/components/schemas/OrganizationRoles' }
    MembershipResponse:
      type: object
      required: [id, organizationId, subjectType, subject, roles, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/OrganizationRole' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MembershipResponse' }

    ProjectRole:
      type: string
      enum: [approver, editor, viewer]
      description: |
        A project role that can be granted (`docs/identity.md`). Project
        `admin` is never granted: organization owners and admins have it in
        every project.
    CreateProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subject, role]
      properties:
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { $ref: '#/components/schemas/Subject' }
        role: { $ref: '#/components/schemas/ProjectRole' }
    UpdateProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    ProjectMembershipResponse:
      type: object
      required: [id, organizationId, projectId, subjectType, subject, role, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ProjectMembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectMembershipResponse' }

    SubjectMembershipResponse:
      allOf:
        - $ref: '#/components/schemas/MembershipResponse'
        - type: object
          required: [organization]
          properties:
            organization:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
    SubjectMembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SubjectMembershipResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }
