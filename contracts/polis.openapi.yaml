openapi: 3.1.0
info:
  title: Polis API
  version: 0.7.0
  description: |
    Tenancy service for Aether-os: organizations, the projects inside them,
    memberships (which principal belongs to which organization, with which
    roles) and project memberships (a member's role in one project).
    Other services store organization and project IDs and resolve them here.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Actions are idempotent: suspending a suspended organization, or
    archiving an archived project, returns the unchanged resource.

    Every operation needs a Pistis access token (`Authorization: Bearer`);
    `x-permission` names what it requires (`../docs/identity.md`). Tokens are
    scoped to one organization: an `{organizationId}` other than the token's
    is 404. Platform services call with their own token and its platform
    permissions (`platform:read`, `platform:manage`). `createdBy` is the
    caller's `sub`.

security:
  - pistis: []

tags:
  - name: organizations
  - name: projects
  - name: memberships
  - name: project-memberships

paths:
  /v1/organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      x-permission: 'any user (becomes its `owner`), or a platform service with `platform:manage`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [organizations]
      operationId: listOrganizations
      x-permission: 'platform services with `platform:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/organizations/by-slug/{slug}:
    get:
      tags: [organizations]
      operationId: getOrganizationBySlug
      x-permission: 'the token''s own organization, or `platform:read`'
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      operationId: getOrganization
      x-permission: '`org:read`, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/suspend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      operationId: suspendOrganization
      x-permission: '`platform:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Suspended (or already suspended)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      operationId: activateOrganization
      x-permission: '`platform:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Active (or already active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [projects]
      operationId: createProject
      x-permission: '`project:create`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [projects]
      operationId: listProjects
      x-permission: '`org:read`; lists only the projects the caller can read (all with `platform:read`)'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      x-permission: '`project:read` in that project, or `platform:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: archiveProject
      x-permission: '`project:manage` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [memberships]
      operationId: createMembership
      x-permission: '`member:manage`; granting `owner` needs an `owner`'
      description: Adds a principal to the organization with one or more roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [memberships]
      operationId: listMemberships
      x-permission: '`member:read`, or `platform:read` (Pistis, for the organization''s people)'
      parameters:
        - name: subjectType
          in: query
          required: false
          description: Only users, or only service accounts.
          schema: { $ref: '#/components/schemas/SubjectType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [memberships]
      operationId: getMembership
      x-permission: '`member:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [memberships]
      operationId: updateMembership
      x-permission: '`member:manage`; changing an `owner`''s roles, or granting `owner`, needs an `owner`'
      description: Replaces the membership's roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [memberships]
      operationId: deleteMembership
      x-permission: '`member:manage`; removing an `owner` needs an `owner`'
      description: Removes the principal from the organization.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/memberships:
    get:
      tags: [memberships]
      operationId: listMembershipsOfSubject
      x-permission: 'the caller''s own memberships (`subject` = the token''s `sub`), or `platform:read`'
      description: |
        Every organization membership of one principal, across organizations,
        with each organization's name and slug. Pistis uses it to put
        organization and role claims in tokens; Iris to let a person choose an
        organization (they can't read organizations before they have a token
        for one).
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SubjectType' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Subject' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/organizations/{organizationId}/projects/{projectId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [project-memberships]
      operationId: createProjectMembership
      x-permission: '`project-member:manage` in that project'
      description: |
        Grants a member of the organization one role in the project. The
        role can't exceed what the organization role allows (`member` →
        `approver`, `viewer` → `viewer`; `PROJECT_ROLE_EXCEEDS_CAP`), and a
        service account is never an `approver`. The principal must be a
        member of the organization (`PROJECT_MEMBER_NOT_IN_ORGANIZATION`);
        the project must be active (`PROJECT_ARCHIVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [project-memberships]
      operationId: listProjectMemberships
      x-permission: '`project:read` in that project'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [project-memberships]
      operationId: getProjectMembership
      x-permission: '`project:read` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [project-memberships]
      operationId: updateProjectMembership
      x-permission: '`project-member:manage` in that project'
      description: Replaces the role (same cap as granting).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectMembershipRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [project-memberships]
      operationId: deleteProjectMembership
      x-permission: '`project-member:manage` in that project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/project-memberships:
    get:
      tags: [project-memberships]
      operationId: listProjectMembershipsOfSubject
      x-permission: "the caller's own (`subject` = the token's `sub`), or `platform:read`"
      description: |
        One principal's project roles in one organization. Pistis uses it to
        put `project_roles` in tokens.
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SubjectType' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Subject' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembershipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - ORGANIZATION_SLUG_TAKEN
        - ORGANIZATION_SUSPENDED
        - PROJECT_SLUG_TAKEN
        - MEMBERSHIP_EXISTS
        - PROJECT_ARCHIVED
        - PROJECT_MEMBERSHIP_EXISTS
        - PROJECT_MEMBER_NOT_IN_ORGANIZATION
        - PROJECT_ROLE_EXCEEDS_CAP
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Slug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      description: Lowercase letters, digits and single hyphens.
    Timestamp:
      type: string
      format: date-time
    Version:
      type: integer
      minimum: 1
      description: |
        Increases with every change; the same number as the `aggregateVersion`
        of the resource's events, so a consumer can tell whether what it
        fetched is newer than an event it receives.

    # ---------- organizations ----------
    OrganizationStatus:
      type: string
      enum: [active, suspended]
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { $ref: '#/components/schemas/Slug' }
    OrganizationResponse:
      type: object
      required: [id, name, slug, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/OrganizationStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    OrganizationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrganizationResponse' }

    # ---------- projects ----------
    ProjectStatus:
      type: string
      enum: [active, archived]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, slug, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          $ref: '#/components/schemas/Slug'
          description: Unique within the organization.
        description: { type: string, maxLength: 2000 }
    ProjectResponse:
      type: object
      required: [id, organizationId, name, slug, description, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectResponse' }

    # ---------- memberships ----------
    SubjectType:
      type: string
      enum: [user, service_account]
      description: The kind of principal (`sub_type` in Pistis tokens).
    Subject:
      type: string
      minLength: 1
      maxLength: 255
      description: The principal's Pistis `sub`.
    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]
      description: A fixed organization role (see `docs/identity.md`).
    OrganizationRoles:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/OrganizationRole' }
      description: |
        One or more roles. Duplicates are ignored; responses list each role
        once, in the order owner, admin, member, viewer.
    CreateMembershipRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subject, roles]
      properties:
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { $ref: '#/components/schemas/Subject' }
        roles: { $ref: '#/components/schemas/OrganizationRoles' }
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles: { $ref: '#/components/schemas/OrganizationRoles' }
    MembershipResponse:
      type: object
      required: [id, organizationId, subjectType, subject, roles, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/OrganizationRole' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MembershipResponse' }

    ProjectRole:
      type: string
      enum: [approver, editor, viewer]
      description: |
        A project role that can be granted (`docs/identity.md`). Project
        `admin` is never granted: organization owners and admins have it in
        every project.
    CreateProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subject, role]
      properties:
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { $ref: '#/components/schemas/Subject' }
        role: { $ref: '#/components/schemas/ProjectRole' }
    UpdateProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    ProjectMembershipResponse:
      type: object
      required: [id, organizationId, projectId, subjectType, subject, role, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subject: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ProjectMembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectMembershipResponse' }

    SubjectMembershipResponse:
      allOf:
        - $ref: '#/components/schemas/MembershipResponse'
        - type: object
          required: [organization]
          properties:
            organization:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
    SubjectMembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SubjectMembershipResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }
