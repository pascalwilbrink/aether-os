asyncapi: 3.0.0
info:
  title: Polis events
  version: 0.5.0
  description: |
    Events Polis publishes to the `polis.events` topic exchange on RabbitMQ;
    the routing key is the event type. Every message is the Krepis
    `DomainEvent` envelope (see `../docs/events.md`), JSON, persistent, with
    the event ID as AMQP `messageId` and the event type as `type`.

    Delivery is at least once (transactional outbox and relay): deduplicate on
    `eventId`, and ignore an event whose `aggregateVersion` is not newer than
    the one already applied for that `aggregateId`. Polis emits an event only
    when something changed: repeated actions (suspending a suspended
    organization, a PUT that keeps the same roles) publish nothing.

    Each message's `payload` has a named schema (e.g. `MembershipGranted`);
    consumers and Polis generate their TypeScript types from this file
    (`aether-asyncapi-types`, see `README.md`).

defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from ../docker-compose.yml

channels:
  polisEvents:
    address: polis.events
    description: Topic exchange; consumers bind their own durable queue (`<consumer>.polis-events`) to the routing keys they need.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: polis.events
          type: topic
          durable: true
          autoDelete: false
    messages:
      organizationCreated: { $ref: '#/components/messages/organizationCreated' }
      organizationSuspended: { $ref: '#/components/messages/organizationSuspended' }
      organizationReactivated: { $ref: '#/components/messages/organizationReactivated' }
      projectCreated: { $ref: '#/components/messages/projectCreated' }
      projectArchived: { $ref: '#/components/messages/projectArchived' }
      membershipGranted: { $ref: '#/components/messages/membershipGranted' }
      membershipRoleChanged: { $ref: '#/components/messages/membershipRoleChanged' }
      membershipRevoked: { $ref: '#/components/messages/membershipRevoked' }
      projectMembershipGranted: { $ref: '#/components/messages/projectMembershipGranted' }
      projectMembershipRoleChanged: { $ref: '#/components/messages/projectMembershipRoleChanged' }
      projectMembershipRevoked: { $ref: '#/components/messages/projectMembershipRevoked' }
      departmentCreated: { $ref: '#/components/messages/departmentCreated' }
      departmentUpdated: { $ref: '#/components/messages/departmentUpdated' }
      departmentArchived: { $ref: '#/components/messages/departmentArchived' }
      projectDepartmentChanged: { $ref: '#/components/messages/projectDepartmentChanged' }
      personCreated: { $ref: '#/components/messages/personCreated' }
      personUpdated: { $ref: '#/components/messages/personUpdated' }
      personDeleted: { $ref: '#/components/messages/personDeleted' }
      teamCreated: { $ref: '#/components/messages/teamCreated' }
      teamUpdated: { $ref: '#/components/messages/teamUpdated' }
      teamArchived: { $ref: '#/components/messages/teamArchived' }
      teamMemberAdded: { $ref: '#/components/messages/teamMemberAdded' }
      teamMemberRemoved: { $ref: '#/components/messages/teamMemberRemoved' }

operations:
  publishPolisEvents:
    action: send
    channel: { $ref: '#/channels/polisEvents' }
    messages:
      - $ref: '#/channels/polisEvents/messages/organizationCreated'
      - $ref: '#/channels/polisEvents/messages/organizationSuspended'
      - $ref: '#/channels/polisEvents/messages/organizationReactivated'
      - $ref: '#/channels/polisEvents/messages/projectCreated'
      - $ref: '#/channels/polisEvents/messages/projectArchived'
      - $ref: '#/channels/polisEvents/messages/membershipGranted'
      - $ref: '#/channels/polisEvents/messages/membershipRoleChanged'
      - $ref: '#/channels/polisEvents/messages/membershipRevoked'
      - $ref: '#/channels/polisEvents/messages/projectMembershipGranted'
      - $ref: '#/channels/polisEvents/messages/projectMembershipRoleChanged'
      - $ref: '#/channels/polisEvents/messages/projectMembershipRevoked'
      - $ref: '#/channels/polisEvents/messages/departmentCreated'
      - $ref: '#/channels/polisEvents/messages/departmentUpdated'
      - $ref: '#/channels/polisEvents/messages/departmentArchived'
      - $ref: '#/channels/polisEvents/messages/projectDepartmentChanged'
      - $ref: '#/channels/polisEvents/messages/personCreated'
      - $ref: '#/channels/polisEvents/messages/personUpdated'
      - $ref: '#/channels/polisEvents/messages/personDeleted'
      - $ref: '#/channels/polisEvents/messages/teamCreated'
      - $ref: '#/channels/polisEvents/messages/teamUpdated'
      - $ref: '#/channels/polisEvents/messages/teamArchived'
      - $ref: '#/channels/polisEvents/messages/teamMemberAdded'
      - $ref: '#/channels/polisEvents/messages/teamMemberRemoved'

components:
  messages:
    organizationCreated:
      name: organization.created
      summary: An organization was created.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: organization.created }
              payload: { $ref: '#/components/schemas/OrganizationCreated' }
    organizationSuspended:
      name: organization.suspended
      summary: An organization was suspended; reject writes for it.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: organization.suspended }
              payload: { $ref: '#/components/schemas/OrganizationSuspended' }
    organizationReactivated:
      name: organization.reactivated
      summary: A suspended organization was activated again.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: organization.reactivated }
              payload: { $ref: '#/components/schemas/OrganizationReactivated' }
    projectCreated:
      name: project.created
      summary: A project was created (`projectId` is also in the envelope).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project.created }
              payload: { $ref: '#/components/schemas/ProjectCreated' }
    projectArchived:
      name: project.archived
      summary: A project was archived (final).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project.archived }
              payload: { $ref: '#/components/schemas/ProjectArchived' }
    membershipGranted:
      name: membership.granted
      summary: A principal became a member of an organization.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: membership.granted }
              payload: { $ref: '#/components/schemas/MembershipGranted' }
    membershipRoleChanged:
      name: membership.role-changed
      summary: A membership's roles changed; drop cached permissions.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: membership.role-changed }
              payload: { $ref: '#/components/schemas/MembershipRoleChanged' }
    membershipRevoked:
      name: membership.revoked
      summary: A principal was removed from an organization.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: membership.revoked }
              payload: { $ref: '#/components/schemas/MembershipRevoked' }

    projectMembershipGranted:
      name: project-membership.granted
      summary: A member got a role in a project.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project-membership.granted }
              payload: { $ref: '#/components/schemas/ProjectMembershipGranted' }
    projectMembershipRoleChanged:
      name: project-membership.role-changed
      summary: A project membership's role changed (also when an organization role was lowered and the grant was capped); drop cached permissions.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project-membership.role-changed }
              payload: { $ref: '#/components/schemas/ProjectMembershipRoleChanged' }
    projectMembershipRevoked:
      name: project-membership.revoked
      summary: A principal lost its role in a project (also when it left the organization).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project-membership.revoked }
              payload: { $ref: '#/components/schemas/ProjectMembershipRevoked' }

    departmentCreated:
      name: department.created
      summary: "A department was created."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: department.created }
              payload: { $ref: '#/components/schemas/DepartmentCreated' }
    departmentUpdated:
      name: department.updated
      summary: "A department's name or description changed."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: department.updated }
              payload: { $ref: '#/components/schemas/DepartmentUpdated' }
    departmentArchived:
      name: department.archived
      summary: "A department was archived (final)."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: department.archived }
              payload: { $ref: '#/components/schemas/DepartmentArchived' }
    projectDepartmentChanged:
      name: project.department-changed
      summary: "A project moved into, out of or between departments."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: project.department-changed }
              payload: { $ref: '#/components/schemas/ProjectDepartmentChanged' }

    personCreated:
      name: person.created
      summary: "A person was recorded in an organization."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: person.created }
              payload: { $ref: '#/components/schemas/PersonCreated' }
    personUpdated:
      name: person.updated
      summary: "A person's fields, departments or linked user changed (also when a user with their email address was created)."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: person.updated }
              payload: { $ref: '#/components/schemas/PersonUpdated' }
    personDeleted:
      name: person.deleted
      summary: "A person was deleted."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: person.deleted }
              payload: { $ref: '#/components/schemas/PersonDeleted' }

    teamCreated:
      name: team.created
      summary: "A team was created."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: team.created }
              payload: { $ref: '#/components/schemas/TeamCreated' }
    teamUpdated:
      name: team.updated
      summary: "A team's name, description or departments changed."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: team.updated }
              payload: { $ref: '#/components/schemas/TeamUpdated' }
    teamArchived:
      name: team.archived
      summary: "A team was archived (final)."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: team.archived }
              payload: { $ref: '#/components/schemas/TeamArchived' }
    teamMemberAdded:
      name: team-member.added
      summary: "A person joined a team."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: team-member.added }
              payload: { $ref: '#/components/schemas/TeamMemberAdded' }
    teamMemberRemoved:
      name: team-member.removed
      summary: "A person left a team (also when the person was deleted)."
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: team-member.removed }
              payload: { $ref: '#/components/schemas/TeamMemberRemoved' }

  schemas:
    Uuid: { type: string, format: uuid }
    Envelope:
      type: object
      description: Krepis's `DomainEvent`.
      required: [eventId, eventType, schemaVersion, aggregateId, aggregateVersion, occurredAt, organizationId, projectId, actor, payload]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid', description: 'UUIDv7; the deduplication key.' }
        eventType: { type: string }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        aggregateVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        projectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor:
          description: The caller whose request caused the event (from its Pistis token); null for system work.
          oneOf:
            - type: 'null'
            - type: object
              required: [sub, sub_type]
              properties:
                sub: { type: string }
                sub_type: { enum: [user, service_account, service] }
                act:
                  type: object
                  properties:
                    sub: { type: string }
        payload: { type: object }
    # ---------- event payloads (the envelope's `payload`) ----------
    OrganizationCreated:
      type: object
      additionalProperties: false
      required: [organizationId, slug]
      properties:
        organizationId: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
    OrganizationSuspended: { $ref: '#/components/schemas/OrganizationStatusChanged' }
    OrganizationReactivated: { $ref: '#/components/schemas/OrganizationStatusChanged' }
    OrganizationStatusChanged:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: [string, 'null'] }
    ProjectCreated:
      type: object
      additionalProperties: false
      required: [projectId, departmentId]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
        departmentId:
          description: The department it was created in, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ProjectDepartmentChanged:
      type: object
      additionalProperties: false
      required: [projectId, from, to]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
        from:
          description: The department it was in, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        to:
          description: The department it's in now, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    DepartmentCreated:
      type: object
      additionalProperties: false
      required: [departmentId, slug]
      properties:
        departmentId: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
    DepartmentUpdated: { $ref: '#/components/schemas/DepartmentChanged' }
    DepartmentArchived: { $ref: '#/components/schemas/DepartmentChanged' }
    DepartmentChanged:
      type: object
      additionalProperties: false
      required: [departmentId]
      properties:
        departmentId: { $ref: '#/components/schemas/Uuid' }
    ProjectArchived: { $ref: '#/components/schemas/ProjectChanged' }
    ProjectChanged:
      type: object
      additionalProperties: false
      required: [projectId]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
    PersonCreated: { $ref: '#/components/schemas/PersonChanged' }
    PersonUpdated: { $ref: '#/components/schemas/PersonChanged' }
    PersonChanged:
      type: object
      additionalProperties: false
      description: IDs only; a person's name, email address and other fields are read from Polis's API.
      required: [personId, userId, departmentIds]
      properties:
        personId: { $ref: '#/components/schemas/Uuid' }
        userId:
          description: The linked Pistis user, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        departmentIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    PersonDeleted:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId: { $ref: '#/components/schemas/Uuid' }
    TeamCreated: { $ref: '#/components/schemas/TeamChanged' }
    TeamUpdated: { $ref: '#/components/schemas/TeamChanged' }
    TeamArchived: { $ref: '#/components/schemas/TeamChanged' }
    TeamChanged:
      type: object
      additionalProperties: false
      required: [teamId, departmentIds]
      properties:
        teamId: { $ref: '#/components/schemas/Uuid' }
        departmentIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    TeamMemberAdded: { $ref: '#/components/schemas/TeamMemberChanged' }
    TeamMemberRemoved: { $ref: '#/components/schemas/TeamMemberChanged' }
    TeamMemberChanged:
      type: object
      additionalProperties: false
      required: [teamId, personId]
      properties:
        teamId: { $ref: '#/components/schemas/Uuid' }
        personId: { $ref: '#/components/schemas/Uuid' }
    MembershipGranted:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope, roles]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/OrganizationScope' }
        roles: { $ref: '#/components/schemas/Roles' }
    MembershipRoleChanged:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope, from, to]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/OrganizationScope' }
        from: { $ref: '#/components/schemas/Roles' }
        to: { $ref: '#/components/schemas/Roles' }
    MembershipRevoked:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/OrganizationScope' }
    ProjectMembershipGranted:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope, role]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/ProjectScope' }
        role: { $ref: '#/components/schemas/ProjectRole' }
    ProjectMembershipRoleChanged:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope, from, to]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/ProjectScope' }
        from: { $ref: '#/components/schemas/ProjectRole' }
        to: { $ref: '#/components/schemas/ProjectRole' }
    ProjectMembershipRevoked:
      type: object
      additionalProperties: false
      required: [membershipId, principal, scope]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/Principal' }
        scope: { $ref: '#/components/schemas/ProjectScope' }
    ProjectScope:
      type: object
      additionalProperties: false
      required: [type, organizationId, projectId]
      properties:
        type: { const: project }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
    ProjectRole:
      enum: [approver, editor, viewer]
    Principal:
      type: object
      additionalProperties: false
      required: [sub, sub_type]
      properties:
        sub: { type: string, description: The principal's Pistis `sub`. }
        sub_type: { enum: [user, service_account] }
    OrganizationScope:
      type: object
      additionalProperties: false
      required: [type, organizationId]
      properties:
        type: { const: organization }
        organizationId: { $ref: '#/components/schemas/Uuid' }
    Roles:
      type: array
      minItems: 1
      items: { enum: [owner, admin, member, viewer] }
      description: Each role once, highest first.
