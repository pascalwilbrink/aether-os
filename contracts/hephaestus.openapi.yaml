openapi: 3.1.0
info:
  title: Hephaestus API
  version: 0.3.0
  description: |
    AI Agent Factory for Aether-os. Source of truth for the Hephaestus HTTP
    contract; Hephaestus and Iris generate their API types from this file.

    Organizations and projects belong to Polis: Hephaestus keeps a copy of
    their status from Polis's events, so a write in a suspended organization
    or for an archived project is rejected (409) here too. An organization or
    project Hephaestus hasn't seen yet is looked up in Polis; if Polis can't be
    reached then, the request fails with `503 UNAVAILABLE`.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Actions are idempotent where that's natural (archiving an archived
    agent, publishing the published version); workspace transitions stay
    strict (`409`).

tags:
  - name: agents
  - name: agent-versions
  - name: workspaces

paths:
  /v1/organizations/{organizationId}/agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [agents]
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agents]
      operationId: listAgents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: archiveAgent
      responses:
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agent-versions]
      operationId: createAgentVersion
      description: Creates a draft version; the version number is assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentVersionRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agent-versions]
      operationId: listAgentVersions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Highest version first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [agent-versions]
      operationId: getAgentVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [agent-versions]
      operationId: publishAgentVersion
      description: |
        Publishes a draft and deprecates the previously published version.
        Publishing the version that's already published returns it unchanged;
        a deprecated version can't be published again (409).
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/acquire:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: acquireWorkspace
      responses:
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/release:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: releaseWorkspace
      responses:
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/suspend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: suspendWorkspace
      responses:
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/resume:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: resumeWorkspace
      responses:
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/destroy:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: destroyWorkspace
      description: Starts teardown (status `stopping`); the provisioner completes it.
      responses:
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  responses:
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }
    WorkspaceTransition:
      description: Transition applied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceResponse' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_VERSION_CONFLICT
        - AGENT_VERSION_INVALID_TRANSITION
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - WORKSPACE_INVALID_EXPIRY
        - WORKSPACE_INVALID_TRANSITION
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time

    # ---------- agents ----------
    AgentStatus:
      type: string
      enum: [active, archived]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, description, createdBy]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        createdBy: { type: string, minLength: 1 }
    AgentResponse:
      type: object
      required: [id, organizationId, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentResponse' }

    # ---------- agent versions ----------
    AgentVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        configuration:
          type: object
          additionalProperties: true
    AgentSkillConfiguration:
      type: object
      additionalProperties: false
      required: [name, version, enabled]
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        enabled: { type: boolean }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
    CreateAgentVersionRequest:
      type: object
      additionalProperties: false
      required: [instructions, model, capabilities, tools, skills, runtime, createdBy]
      properties:
        instructions: { type: string, minLength: 1 }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string, minLength: 1 }
    AgentVersionResponse:
      type: object
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AgentVersionStatus' }
        instructions: { type: string }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    AgentVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentVersionResponse' }

    # ---------- workspaces ----------
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, in_use, suspended, stopping, destroyed, failed, expired]
    RepositoryProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    RepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [provider, repositoryUrl, branch]
      properties:
        provider: { $ref: '#/components/schemas/RepositoryProvider' }
        repositoryUrl:
          type: string
          format: uri
          pattern: '^https://'
        branch: { type: string, minLength: 1 }
        commitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    NetworkAccess:
      type: string
      enum: [none, restricted, full]
    SandboxConfiguration:
      type: object
      additionalProperties: false
      required: [provider, image, cpuLimit, memoryLimitMb, networkAccess]
      properties:
        provider: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        cpuLimit: { type: number, exclusiveMinimum: 0 }
        memoryLimitMb: { type: integer, minimum: 1 }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
    SandboxReference:
      type: object
      required: [provider, resourceId]
      properties:
        provider: { type: string }
        resourceId: { type: string }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [projectId, executionId, repository, sandbox, workingDirectory, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        repository: { $ref: '#/components/schemas/RepositoryConfiguration' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        workingDirectory:
          type: string
          pattern: '^/'
          description: Absolute path inside the sandbox.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future.
    WorkspaceResponse:
      type: object
      required: [id, organizationId, projectId, executionId, status, repository, sandbox, sandboxReference, workingDirectory, failureReason, expiresAt, createdAt, updatedAt, startedAt, destroyedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        repository: { $ref: '#/components/schemas/RepositoryConfiguration' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        sandboxReference:
          oneOf:
            - $ref: '#/components/schemas/SandboxReference'
            - type: 'null'
        workingDirectory: { type: string }
        failureReason: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          type: [string, 'null']
          format: date-time
        destroyedAt:
          type: [string, 'null']
          format: date-time
    WorkspacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }
