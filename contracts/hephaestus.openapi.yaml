        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [budgets]
      operationId: setAgentBudget
      x-permission: '`org:manage`'
      description: |
        Sets (or, with `limitUsd: null`, removes) the agent's monthly limit.
