        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveCouncilPlanRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
