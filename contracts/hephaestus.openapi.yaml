openapi: 3.1.0
info:
  title: Hephaestus API
  version: 0.30.0
  description: |
    AI Agent Factory for Aether-os. Source of truth for the Hephaestus HTTP
    contract; Hephaestus and Iris generate their API types from this file.

    Organizations and projects belong to Polis: Hephaestus keeps a copy of
    their status from Polis's events, so a write in a suspended organization
    or for an archived project is rejected (409) here too. An organization or
    project Hephaestus hasn't seen yet is looked up in Polis; if Polis can't be
    reached then, the request fails with `503 UNAVAILABLE`.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Actions are idempotent where that's natural; workspace
    transitions stay strict (`409`).

    Agents and their versions belong to Agora (`agora.openapi.yaml`):
    Hephaestus keeps a copy of them from Agora's events, to create and run
    tasks with, and of the skills their versions pin. Here it answers
    Agora's check of a new version's tools.

    Every operation needs a Pistis access token for the organization
    (`Authorization: Bearer`); `x-permission` names what it requires
    (`../docs/identity.md`). Another organization's `{organizationId}`, and a
    project the caller can't read, are 404. `createdBy` is the caller's `sub`.
    The model catalogue (`/v1/models`) is the platform's: any valid token
    reads it, and only platform services with `platform:manage` change it.

security:
  - pistis: []

tags:
  - name: agent-versions
  - name: workspaces
  - name: tasks
  - name: task-templates
  - name: budgets
  - name: tool-servers

paths:
  /v1/organizations/{organizationId}/agent-version-checks:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [agent-versions]
      operationId: checkAgentVersion
      x-permission: '`platform:read` (platform services only: Agora)'
      description: |
        Whether an agent version's tools are choosable in the organization,
        for Agora to check before it creates the version (its model Agora
        checks with Pylon's catalogue, its skills itself): each enabled entry
        of `tools` names one of the organization's tool servers, each at
        most once (`TOOL_SERVER_INVALID`). Changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentVersionCheckRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Choosable
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/workspaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      x-permission: '`workspace:manage` in the body''s project'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      x-permission: '`workspace:read`; lists only workspaces in projects the caller can read'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      x-permission: '`workspace:read` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/acquire:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: acquireWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/release:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: releaseWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/suspend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: suspendWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/resume:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: resumeWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/destroy:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: destroyWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      description: Starts teardown (status `stopping`); the provisioner completes it.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/task-templates:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [task-templates]
      operationId: createTaskTemplate
      x-permission: '`org:task-template:manage` (organization-wide), or `task-template:manage` in the body''s project'
      description: |
        A template and its first version (docs/tasks.md, Task templates).
        Without `projectId` it's organization-wide, visible to every
        project; with one, only to that project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskTemplateRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created, with version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [task-templates]
      operationId: listTaskTemplates
      x-permission: '`org:read`; with `projectId`, `task:read` in it'
      parameters:
        - name: projectId
          in: query
          required: false
          description: The templates a project sees (its own and the organization's); without it, the organization-wide ones.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplatePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/task-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [task-templates]
      operationId: getTaskTemplate
      x-permission: '`org:read` (organization-wide), or `task:read` in its project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/task-templates/{templateId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [task-templates]
      operationId: archiveTaskTemplate
      x-permission: Managing it at its scope
      description: No new tasks from it (`TASK_TEMPLATE_ARCHIVED`); existing tasks and templates extending it keep their pinned version. Idempotent.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/task-templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [task-templates]
      operationId: createTaskTemplateVersion
      x-permission: Managing it at its scope
      description: Editing a template is a new version; earlier ones never change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTemplateContent' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [task-templates]
      operationId: listTaskTemplateVersions
      x-permission: Reading it
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/task-templates/{templateId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TemplateId'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [task-templates]
      operationId: getTaskTemplateVersion
      x-permission: Reading it
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/task-templates/{templateId}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [task-templates]
      operationId: createTaskFromTemplate
      x-permission: '`task:create` in the project (the template must be visible to it)'
      description: |
        A task from a template version (its latest unless given), pinned
        on the task: its title and instructions with the inputs filled in,
        its agent, and its acceptance criteria, plus any added here. Like
        creating a task: `Idempotency-Key` required, 201 or 200.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskFromTemplateRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '200':
          description: Already created with this `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [tasks]
      operationId: createTask
      x-permission: '`task:create` in the project'
      description: |
        Creates a task (or, with `parentTaskId`, a subtask) that runs as a
        service account (`docs/identity.md`: tasks never run as a user; the
        caller is recorded as `requestedBy`). The agent's published version
        is pinned now (`AGENT_NOT_PUBLISHED` without one). A task starts
        `blocked` until every task in `dependsOn` has succeeded, otherwise
        `queued`. `dependsOn` may only name tasks under the same top-level
        task (`TASK_DEPENDENCY_INVALID`).

        Idempotent per `Idempotency-Key`: a repeated key returns the task it
        created (`200`) instead of creating another.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '200':
          description: Already created with this `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [tasks]
      operationId: listTasks
      x-permission: '`task:read` in the project'
      parameters:
        - name: parentTaskId
          in: query
          required: false
          description: Only the subtasks of this task.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      x-permission: '`task:read` in the project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: cancelTask
      x-permission: '`task:cancel` in the project'
      description: |
        Cancels the task and every unfinished task under it. Idempotent for
        a cancelled task; a task that already succeeded or failed can't be
        cancelled (`TASK_INVALID_TRANSITION`).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cancelled (or already cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: retryTask
      x-permission: '`task:create` in the project'
      description: |
        Retries a failed task with the same pinned inputs (a new attempt of
        the same task, so dependents keep pointing at it). Only failed tasks
        (`TASK_INVALID_TRANSITION`).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Queued again (or blocked on its dependencies)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [artifacts]
      operationId: listTaskArtifacts
      x-permission: '`task:read` in the project'
      description: |
        What the task produced (docs/tasks.md, Artifacts), across its
        executions: the primary artifact and others once it succeeded,
        `partial` ones from failed executions, `pending` ones while it runs.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ArtifactStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getTaskArtifact
      x-permission: '`task:read` in the project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/approve:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: approveArtifact
      x-permission: '`task:approve` in the project'
      description: |
        Approves a draft: it becomes `final`. The task succeeds once none of
        its drafts is waiting any more and none needs changes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: rejectArtifact
      x-permission: '`task:approve` in the project'
      description: |
        Rejects a draft: it becomes `rejected`, and the task fails with
        `rejected` (its other drafts become `partial`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: requestArtifactChanges
      x-permission: '`task:approve` in the project'
      description: |
        Sends a draft back with comments: it becomes `changes_requested`.
        Once none of the task's drafts is waiting, the agent runs again with
        the comments and produces revised drafts (`revisionOf`). Refused
        after the last review round (`TASK_REVIEW_ROUNDS_EXHAUSTED`):
        approve or reject then.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestChangesRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/executions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskExecutions
      x-permission: '`task:read` in the project'
      description: |
        The task's executions (docs/tasks.md, Executions): one per try in a
        sandbox, including the automatic retries after infrastructure
        failures and those of later attempts.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/executions/{executionId}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      operationId: listExecutionEvents
      x-permission: '`task:read` in the project'
      description: |
        What the execution did, as it happens (docs/tasks.md, Activity): the
        runner's steps, each model call and each tool call, oldest first,
        numbered within the execution. Follow a running one by asking again
        with `after` set to the last `sequence` seen (`nextAfter`), until
        `executionStatus` is no longer `provisioning` or `running`. Text is
        shortened and what looks like a secret is redacted before it's kept.
      parameters:
        - name: after
          in: query
          required: false
          description: Only events after this sequence number (0, the default, for all).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionEventPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/budget:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [budgets]
      operationId: getTaskTreeBudget
      x-permission: '`task:read` in the project'
      description: |
        The budget of the task's tree (its top-level task's), for the tree's
        whole life. Budgets are Pylon's (`../docs/pylon.md`): Hephaestus
        checks the task and reads it there with its own token.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [budgets]
      operationId: setTaskTreeBudget
      x-permission: '`task:create` in the project'
      description: |
        Sets (or removes) the limit of the task's tree, in Pylon, with the
        caller's own token; its paused tasks resume once it has room. `503`
        when Pylon doesn't answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBudgetRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [tool-servers]
      operationId: listToolServers
      x-permission: '`agent:read`'
      description: The organization's tool servers, by name (at most 50).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [tool-servers]
      operationId: createToolServer
      x-permission: '`org:manage`'
      description: |
        Registers an MCP server (Streamable HTTP) that the organization's agent
        versions can take tools from (`tools[].name` is its `name`).
        Hephaestus connects to it, never the sandbox. A `header` credential is
        set separately (`PUT …/credential`) and kept in OpenBao.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: getToolServer
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tool-servers]
      operationId: updateToolServer
      x-permission: '`org:manage`'
      description: |
        Replaces its description, URL and authentication (the name stays: agent
        versions refer to it). Changing the URL or the authentication removes
        the credential, so it isn't sent somewhere new without being set again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServer
      x-permission: '`org:manage`'
      description: |
        Removes it and its credential. Tasks of agent versions that use it
        then fail without retrying until a server with its name exists again.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/credential:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    put:
      tags: [tool-servers]
      operationId: setToolServerCredential
      x-permission: '`org:secret:write`'
      description: |
        Sets the value sent in the server's `auth.headerName` header (for
        `Authorization`, include the scheme: `Bearer …`). Kept in OpenBao and
        never returned; only its last four characters are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetToolServerCredentialRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServerCredential
      x-permission: '`org:secret:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/tools:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: listToolServerTools
      x-permission: '`agent:read`'
      description: |
        Connects to the server and lists the tools it offers now, to choose
        from for an agent version. A `task-token` server is sent the caller's
        own token.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503':
          description: The tool server couldn't be reached or refused the request (`UNAVAILABLE`); `detail` says what it answered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }


components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolServerId:
      name: toolServerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }
    WorkspaceTransition:
      description: Transition applied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceResponse' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_NOT_PUBLISHED
        - ARTIFACT_NOT_DRAFT
        - TASK_BUDGET_INVALID
        - TASK_CONCURRENCY_INVALID
        - TASK_CONCURRENCY_SKIPPED
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - TASK_CRITERIA_INVALID
        - TASK_DEPENDENCY_INVALID
        - TASK_INVALID_TRANSITION
        - TASK_PARENT_FINISHED
        - TASK_REVIEW_ROUNDS_EXHAUSTED
        - TASK_TEMPLATE_ARCHIVED
        - TASK_TEMPLATE_INPUTS_INVALID
        - TASK_TEMPLATE_INVALID
        - TOOL_SERVER_ALREADY_EXISTS
        - TOOL_SERVER_INVALID
        - WORKSPACE_INVALID_EXPIRY
        - WORKSPACE_INVALID_TRANSITION
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time

    # ---------- agent versions (Agora's; checked here) ----------
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      description: |
        Tools from one of the organization's tool servers (MCP): the agent
        gets them as `<name>_<tool>`. An enabled entry must name an existing
        tool server when the version is created.
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        enabled: { type: boolean }
        tools:
          description: Which of the server's tools, by name; all of them when left out.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ToolName' }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
        networkAccess:
          description: |
            The sandbox's network (../CLAUDE.md, sandboxes): `none` (the
            default) or `restricted`, where it reaches only allowed hosts
            through an allowlisting proxy: the platform's (package
            registries, `SANDBOX_ALLOWED_HOSTS`) and `allowedHosts`.
          type: string
          enum: [none, restricted]
        allowedHosts:
          description: Hosts a `restricted` sandbox may reach on ports 80 and 443, besides the platform's; `*.example.com` for its subdomains.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/HostPattern' }
    HostPattern:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    AgentVersionCheckRequest:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }

    # ---------- workspaces ----------
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, in_use, suspended, stopping, destroyed, failed, expired]
    RepositoryProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    RepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [provider, repositoryUrl, branch]
      properties:
        provider: { $ref: '#/components/schemas/RepositoryProvider' }
        repositoryUrl:
          type: string
          format: uri
          pattern: '^https://'
        branch: { type: string, minLength: 1 }
        commitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    NetworkAccess:
      type: string
      enum: [none, restricted, full]
    SandboxConfiguration:
      type: object
      additionalProperties: false
      required: [provider, image, cpuLimit, memoryLimitMb, networkAccess]
      properties:
        provider: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        cpuLimit: { type: number, exclusiveMinimum: 0 }
        memoryLimitMb: { type: integer, minimum: 1 }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it may reach.
          type: array
          items: { $ref: '#/components/schemas/HostPattern' }
    SandboxReference:
      type: object
      required: [provider, resourceId]
      properties:
        provider: { type: string }
        resourceId: { type: string }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [projectId, executionId, sandbox, workingDirectory, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        repository:
          description: The repository to check out; none for a sandbox without one.
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        workingDirectory:
          type: string
          pattern: '^/'
          description: Absolute path inside the sandbox.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future.
    WorkspaceResponse:
      type: object
      required: [id, organizationId, projectId, executionId, status, repository, sandbox, sandboxReference, workingDirectory, blockedHosts, failureReason, expiresAt, createdAt, updatedAt, startedAt, destroyedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        repository:
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        sandboxReference:
          oneOf:
            - $ref: '#/components/schemas/SandboxReference'
            - type: 'null'
        workingDirectory: { type: string }
        blockedHosts:
          description: Hosts the sandbox tried to reach and its proxy refused (`restricted` access), recorded when it's destroyed.
          type: array
          items: { type: string }
        failureReason: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          type: [string, 'null']
          format: date-time
        destroyedAt:
          type: [string, 'null']
          format: date-time
    WorkspacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceResponse' }

    # ---------- tasks ----------
    TaskStatus:
      type: string
      enum: [blocked, queued, provisioning, running, verifying, awaiting_review, waiting, paused, delivering, succeeded, failed, cancelled]
      description: The lifecycle in `docs/tasks.md` (Task lifecycle).
    TaskFailureReason:
      type: string
      enum: [agent_failed, verification_failed, rejected, timeout, budget_exceeded, infrastructure, subtask_failed, access_denied]
      description: |
        Why a task failed. `access_denied`: Pistis refused a task token for
        its service account (no role in the project, disabled, or not a
        member of the organization).
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, instructions, agentId, serviceAccountId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, minLength: 1, maxLength: 100000 }
        agentId:
          type: string
          format: uuid
          description: Its published version is pinned when the task is created.
        serviceAccountId:
          type: string
          format: uuid
          description: The Pistis service account the task runs as.
        parentTaskId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: Makes this a subtask (in the same project).
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Tasks under the same top-level task that must succeed first.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: The definition of done (docs/tasks.md); checked after every run. Keys are unique.
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: |
            The repository the task works in: one of its project's links in
            Proxenos (`docs/git.md`). A subtask without one works in its
            parent's (the tree shares a branch).
        budgetUsd:
          description: |
            A limit for the whole task tree's model calls (docs/models.md,
            Budgets), set in Pylon with the caller's token; only on a
            top-level task (`TASK_BUDGET_INVALID`), and only through this
            API (a `task.create` command can't carry it). Raise it later
            with `PUT …/tasks/{taskId}/budget`.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        inputFiles:
          type: array
          maxItems: 20
          description: |
            Files the task starts from: files of its project in Loculus
            (docs/files.md), uploaded first. The agent finds them in its
            sandbox, in `/workspace/inputs`, so its version needs one
            (else the execution fails without retrying).
          items: { $ref: '#/components/schemas/TaskInputFile' }
    TaskInputFile:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId: { type: string, format: uuid, description: A file of the task's project in Loculus. }
    TaskRepository:
      type: object
      additionalProperties: false
      required: [linkId]
      properties:
        linkId:
          type: string
          format: uuid
          description: A repository link of the task's project (Proxenos). Checked when the task runs.
    AcceptanceCriterionRequest:
      type: object
      additionalProperties: false
      required: [key, description, check]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        check: { $ref: '#/components/schemas/CriterionCheck' }
    AcceptanceCriterion:
      allOf:
        - $ref: '#/components/schemas/AcceptanceCriterionRequest'
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [template, task]
              description: Where it came from (spec requirements later).
    CriterionCheck:
      description: How a criterion is checked; by Hephaestus, never by the agent's word.
      oneOf:
        - $ref: '#/components/schemas/CommandCheck'
        - $ref: '#/components/schemas/ArtifactCheck'
        - $ref: '#/components/schemas/ManualCheck'
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandCheck'
          artifact: '#/components/schemas/ArtifactCheck'
          manual: '#/components/schemas/ManualCheck'
    CommandCheck:
      type: object
      additionalProperties: false
      required: [type, command]
      description: Run in the task's sandbox (the agent version must need one); exit code 0 passes.
      properties:
        type: { type: string, const: command }
        command: { type: string, minLength: 1, maxLength: 4000 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900, description: '300 if left out.' }
    ArtifactCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: A structural check on the run's artifacts; every given condition must hold.
      properties:
        type: { type: string, const: artifact }
        primaryKind: { type: string, minLength: 1, description: The primary artifact's kind. }
        titles:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
          description: Artifacts with these titles exist.
    ManualCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: Left to the reviewer; approving the draft confirms it.
      properties:
        type: { type: string, const: manual }
    TemplateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,49}$'
          description: Referred to as `{{name}}` in the title and instructions.
        description: { type: string, maxLength: 1000 }
        required: { type: boolean, description: 'true if left out.' }
    TemplateExtends:
      type: object
      additionalProperties: false
      required: [templateId, version]
      description: An organization-wide template version this project template builds on.
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    TaskTemplateContent:
      type: object
      additionalProperties: false
      description: |
        One version of a template. A project template that `extends` an
        organization template inherits its agent, title, inputs, criteria
        and review settings, appends its own instructions to the
        organization's, and can only add inputs and criteria.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, minLength: 1, maxLength: 100000 }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        extends: { $ref: '#/components/schemas/TemplateExtends' }
    CreateTaskTemplateRequest:
      allOf:
        - $ref: '#/components/schemas/TaskTemplateContent'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            description: { type: string, maxLength: 2000 }
            projectId:
              type: string
              format: uuid
              description: A project template; organization-wide without it.
    TaskTemplateResponse:
      type: object
      required: [id, organizationId, projectId, name, description, status, latestVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        latestVersion: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskTemplatePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateResponse' }
    EffectiveTaskTemplate:
      type: object
      required: [title, instructions, agentId, inputs, acceptanceCriteria, review]
      description: What a task from this version gets, with what it extends merged in.
      properties:
        title: { type: string }
        instructions: { type: string }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
    TaskTemplateVersionResponse:
      type: object
      required: [templateId, version, content, effective, createdBy, createdAt]
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/TaskTemplateContent' }
        effective: { $ref: '#/components/schemas/EffectiveTaskTemplate' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    TaskTemplateVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateVersionResponse' }
    CreateTaskFromTemplateRequest:
      type: object
      additionalProperties: false
      required: [serviceAccountId]
      properties:
        version: { type: integer, minimum: 1, description: 'The latest if left out.' }
        inputs:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 10000 }
          description: Values for the template's inputs, by name.
        serviceAccountId: { type: string, format: uuid }
        parentTaskId: { type: string, format: uuid }
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: Added to the template's (never replacing them).
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review:
          $ref: '#/components/schemas/TaskReviewSettings'
          description: Added to the template's.
        repository:
          $ref: '#/components/schemas/TaskRepository'
          description: The repository the task works in, as for a task written by hand.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
    TaskConcurrency:
      type: object
      additionalProperties: false
      required: [key, policy]
      description: |
        A concurrency key (docs/tasks.md, Concurrency): what to do with a new
        top-level task while an unfinished one with the same key exists in
        the project. `queue`: it waits until those have finished (the
        runner doesn't start it before); `cancel-previous`: they're
        cancelled; `skip`: it isn't created (`TASK_CONCURRENCY_SKIPPED`).
        Only on top-level tasks (`TASK_CONCURRENCY_INVALID`).
      properties:
        key: { type: string, minLength: 1, maxLength: 200 }
        policy: { type: string, enum: [queue, cancel-previous, skip] }
    TaskReviewSettings:
      type: object
      additionalProperties: false
      required: [artifactKinds]
      description: |
        Which of the task's artifacts need approval before they're final
        (docs/tasks.md, What needs approval). Pinned when the task is
        created; automations and Themis policy will add to it later.
      properties:
        artifactKinds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Artifact kinds that need approval; `*` for every kind. Empty for none.
          items: { type: string, minLength: 1, maxLength: 50 }
    TaskResponse:
      type: object
      required: [id, organizationId, projectId, parentTaskId, topLevelTaskId, title, instructions, agentId, agentVersionId, serviceAccountId, requestedBy, status, failureReason, pausedFor, dependsOn, attempt, primaryArtifactId, review, reviewRound, acceptanceCriteria, repository, concurrency, inputFiles, taskTemplateId, taskTemplateVersion, createdAt, updatedAt, finishedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        topLevelTaskId:
          type: string
          format: uuid
          description: The tree's root (its own ID for a top-level task).
        title: { type: string }
        instructions: { type: string }
        agentId: { type: string, format: uuid }
        agentVersionId:
          type: string
          format: uuid
          description: The agent version pinned when the task was created.
        serviceAccountId: { type: string, format: uuid }
        requestedBy: { type: string, description: The `sub` of whoever created the task. }
        status: { $ref: '#/components/schemas/TaskStatus' }
        pausedFor:
          description: While `paused`, the budget that ran out; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/BudgetScope'
            - type: 'null'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/TaskFailureReason'
            - { type: 'null' }
        dependsOn:
          type: array
          items: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: '1, plus one per retry.' }
        primaryArtifactId:
          type: [string, 'null']
          format: uuid
          description: The outcome of a succeeded task (docs/tasks.md, Primary artifact); null otherwise.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        reviewRound:
          type: integer
          minimum: 0
          description: How many times the task has waited for review (0 before the first).
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterion' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: The repository it works in (its own, or its parent's), if any.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        inputFiles:
          type: array
          description: Files the task starts from (Loculus), in `/workspace/inputs` of its sandbox.
          items: { $ref: '#/components/schemas/TaskInputFile' }
        taskTemplateId:
          type: [string, 'null']
          format: uuid
          description: The template it was created from, if any.
        taskTemplateVersion:
          type: [integer, 'null']
          minimum: 1
          description: Pinned when it was created, like the agent version.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1, description: The `aggregateVersion` of its latest event. }
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskResponse' }
    ArtifactStatus:
      type: string
      enum: [pending, draft, final, rejected, changes_requested, partial]
      description: |
        `pending`: recorded while its execution runs; becomes `final` when
        the task succeeds, `partial` when the execution fails. `draft`,
        `rejected` and `changes_requested` come with reviews.
    ArtifactBase:
      type: object
      required: [id, organizationId, projectId, taskId, executionId, agentVersionId, kind, status, primary, revisionOf, title, metadata, review, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        agentVersionId: { type: string, format: uuid }
        kind: { type: string }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        primary: { type: boolean }
        revisionOf: { type: [string, 'null'], format: uuid }
        title: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        review:
          description: The decision on a draft; null until someone made one.
          oneOf:
            - { $ref: '#/components/schemas/ArtifactReview' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TextArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, format, content]
          properties:
            kind: { type: string, const: text }
            format: { type: string, enum: [markdown, plain] }
            content: { type: string }
    JsonArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, schema, content]
          properties:
            kind: { type: string, const: json }
            schema:
              type: [string, 'null']
              description: An optional identifier of the content's schema.
            content: {}
    VerificationArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, round, results]
          properties:
            kind: { type: string, const: verification }
            round: { type: integer, minimum: 1, description: 'Within its execution: 1, plus one per run after failed checks.' }
            results:
              type: array
              items: { $ref: '#/components/schemas/CriterionResult' }
    PullRequestArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, linkId, repository, branch, baseBranch, headSha, description, pullRequest]
          description: |
            The task's commits, pushed to its tree's branch, as a pull
            request to be (docs/git.md, Branches and pull requests): the
            branch at `headSha` with its title (the artifact's) and
            description. Delivery opens the pull request (or updates the
            tree's open one); a revision is a new artifact at a newer head.
          properties:
            kind: { type: string, const: pull_request }
            linkId: { type: string, format: uuid, description: The repository link (Proxenos). }
            repository: { type: string, description: '`owner/name`.' }
            branch: { type: string, description: '`aether/<top-level task ID>`.' }
            baseBranch: { type: string, description: What the pull request goes into (the default branch). }
            headSha: { type: string, description: The branch's head when it was pushed. }
            description: { type: string, description: The pull request's body (Markdown). }
            pullRequest:
              description: The pull request on GitHub, once delivered; null before.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [number, url, state]
                  properties:
                    number: { type: integer, minimum: 1 }
                    url: { type: string, format: uri }
                    state: { type: string, enum: [open, merged, closed] }
                - { type: 'null' }
    FileArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, fileId, fileName, contentType, sizeBytes, sha256]
          description: |
            A file the agent produced in its sandbox, kept in Loculus
            (docs/files.md): the file's ID there (in the artifact's
            project), never a URL. Download it with Loculus's
            `GET …/projects/{projectId}/files/{fileId}/download`.
          properties:
            kind: { type: string, const: file }
            fileId: { type: string, format: uuid, description: The file in Loculus. }
            fileName: { type: string }
            contentType: { type: string }
            sizeBytes: { type: integer, minimum: 0 }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CriterionResult:
      type: object
      additionalProperties: false
      required: [key, outcome, output]
      properties:
        key: { type: string }
        outcome: { type: string, enum: [passed, failed, manual] }
        output: { type: string, description: 'What the check said: a command''s output (its last 16 KiB), or why it failed.' }
    ArtifactResponse:
      description: One artifact; `kind` says which (an open set).
      oneOf:
        - $ref: '#/components/schemas/TextArtifact'
        - $ref: '#/components/schemas/JsonArtifact'
        - $ref: '#/components/schemas/VerificationArtifact'
        - $ref: '#/components/schemas/PullRequestArtifact'
        - $ref: '#/components/schemas/FileArtifact'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextArtifact'
          json: '#/components/schemas/JsonArtifact'
          verification: '#/components/schemas/VerificationArtifact'
          pull_request: '#/components/schemas/PullRequestArtifact'
          file: '#/components/schemas/FileArtifact'
    ArtifactReview:
      type: object
      additionalProperties: false
      required: [decision, comments, decidedBy, decidedAt]
      properties:
        decision: { type: string, enum: [approved, rejected, changes_requested] }
        comments:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }
        decidedBy: { type: string, description: The reviewer's `sub`. }
        decidedAt: { type: string, format: date-time }
    ReviewComment:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        anchor:
          type: string
          maxLength: 500
          description: Where in the artifact it points (a line, a JSON pointer, a heading); free-form.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }
    RequestChangesRequest:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReviewComment' }
    ArtifactPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtifactResponse' }
    ExecutionEventType:
      type: string
      description: |
        `log`: a step of the runner (the sandbox, the repository, input
        files, verification, pushing commits, how it ended);
        `model_call`: one call to the model (its tokens, what it said);
        `tool_call`: one tool the agent called (its input and output).
      enum: [log, model_call, tool_call]
    ExecutionEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, level, message, toolName, input, output, text, inputTokens, outputTokens, createdAt]
      properties:
        sequence: { type: integer, minimum: 1, description: Its place within the execution. }
        type: { $ref: '#/components/schemas/ExecutionEventType' }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string, description: One line about it. }
        toolName: { type: [string, 'null'], description: For a tool call. }
        input:
          type: [string, 'null']
          description: For a tool call, its input as JSON (shortened, redacted).
        output:
          type: [string, 'null']
          description: For a tool call, what it returned (shortened, redacted).
        text:
          type: [string, 'null']
          description: For a model call, the text it produced (shortened, redacted).
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        createdAt: { type: string, format: date-time }
    ExecutionEventPage:
      type: object
      additionalProperties: false
      required: [items, nextAfter, executionStatus]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExecutionEvent' }
        nextAfter:
          type: integer
          minimum: 0
          description: Pass as `after` for what comes next (the last sequence returned, or `after` itself).
        executionStatus: { $ref: '#/components/schemas/ExecutionStatus' }
    ExecutionStatus:
      type: string
      description: '`paused`: a budget ran out (docs/models.md); the task resumes in a new execution.'
      enum: [provisioning, running, completed, failed, cancelled, paused]
    ExecutionFailureReason:
      type: string
      enum: [agent_failed, timeout, infrastructure, access_denied, interrupted, verification_failed]
      description: |
        `infrastructure` (a crash, a missed heartbeat, a provisioning timeout,
        an unreachable dependency) is retried automatically, up to a limit;
        `interrupted` (Hephaestus shut down) is retried without counting
        against it. The others fail the task.
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, taskId, attempt, number, status, failureReason, error, summary, usage, repository, sandbox, traceId, startedAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: The task's attempt it belongs to. }
        number: { type: integer, minimum: 1, description: '1, 2, … within the task.' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        failureReason:
          oneOf:
            - { $ref: '#/components/schemas/ExecutionFailureReason' }
            - { type: 'null' }
        error:
          type: [string, 'null']
          description: What went wrong, for people; never contains secrets.
        summary:
          type: [string, 'null']
          description: What the agent reported when it finished (until artifacts exist).
        usage: { $ref: '#/components/schemas/ExecutionUsage' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/ExecutionRepository'
            - { type: 'null' }
        sandbox:
          oneOf:
            - $ref: '#/components/schemas/ExecutionSandbox'
            - { type: 'null' }
        traceId:
          description: |
            The execution's trace (OpenTelemetry, 32 hex characters): its
            agent run, model and tool calls, in Jaeger and Langfuse. Null
            when Hephaestus wasn't tracing (no `OTEL_EXPORTER_OTLP_ENDPOINT`).
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionSandbox:
      type: object
      additionalProperties: false
      description: |
        The sandbox the execution ran in (its workspace), and what it could
        reach: none for a version without `runtime.sandboxRequired`. Seen
        with `task:read`, unlike the workspace itself.
      required: [workspaceId, networkAccess, allowedHosts, blockedHosts]
      properties:
        workspaceId: { type: string, format: uuid }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it could reach (the platform's and the agent version's); empty otherwise.
          type: array
          items: { type: string }
        blockedHosts:
          description: |
            Hosts it tried to reach and its proxy refused, recorded when the
            sandbox is destroyed (so empty while it runs). Candidates for
            the agent version's `allowedHosts`.
          type: array
          items: { type: string }
    ExecutionRepository:
      type: object
      additionalProperties: false
      description: |
        The repository the execution worked in (`docs/git.md`, Inside the
        sandbox): checked out at `branch` from `baseSha`, and, once the run
        succeeded, what the agent committed on top (taken out of the sandbox
        as a bundle) and the branch's head once they were pushed (rebased
        onto whatever the branch had by then). Null until then.
      required: [linkId, fullName, branch, baseSha, headSha, commits, uncommittedChanges, pushedSha]
      properties:
        linkId: { type: string, format: uuid }
        fullName: { type: string, description: '`owner/name`.' }
        branch: { type: string, description: 'The task tree''s branch, `aether/<top-level task ID>`.' }
        baseSha: { type: string, description: The commit the execution started from. }
        headSha: { type: [string, 'null'], description: The last commit at the end (the base if nothing was committed). }
        commits: { type: [integer, 'null'], minimum: 0, description: Commits on top of the base. }
        uncommittedChanges:
          type: [boolean, 'null']
          description: Changes left uncommitted in the sandbox; they're not kept.
        pushedSha:
          type: [string, 'null']
          description: The branch's head after the push (differs from `headSha` when the commits were rebased); null when nothing was pushed.
    ExecutionUsage:
      type: object
      additionalProperties: false
      description: |
        The model calls the execution made through the model gateway, and
        their tokens (docs/models.md, Metering). Tokens a provider didn't
        report count as 0.
      required: [modelCalls, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd]
      properties:
        modelCalls: { type: integer, minimum: 0 }
        inputTokens:
          type: integer
          minimum: 0
          description: Every input token, cache reads and writes included.
        outputTokens: { type: integer, minimum: 0 }
        cacheReadTokens: { type: integer, minimum: 0 }
        cacheWriteTokens: { type: integer, minimum: 0 }
        costUsd:
          description: |
            The calls' cost at the prices in force when they were made;
            null when none of them had a price (a model outside the
            catalogue).
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExecutionResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- usage and budgets (Pylon's; docs/pylon.md) ----------
    Usd:
      type: string
      description: US dollars as a decimal string, at most 6 decimals (`../docs/api.md`).
      pattern: '^\d{1,9}(\.\d{1,6})?$'
    # ---------- budgets ----------
    BudgetScope:
      type: string
      description: |
        What a budget limits (docs/models.md, Budgets): an organization's,
        a project's or an agent's model calls per calendar month (UTC), or a
        task tree's over its whole life.
      enum: [organization, project, agent, task_tree]
    SetBudgetRequest:
      type: object
      additionalProperties: false
      required: [limitUsd]
      properties:
        limitUsd:
          description: The limit; null for none.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    BudgetResponse:
      type: object
      required: [scope, scopeId, limitUsd, spentUsd, windowStart, thresholdPercent, updatedAt]
      properties:
        scope: { $ref: '#/components/schemas/BudgetScope' }
        scopeId:
          type: string
          format: uuid
          description: The organization, project, agent or top-level task.
        limitUsd:
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        spentUsd:
          description: What the scope's model calls cost in the window (this month; a task tree's whole life).
          $ref: '#/components/schemas/Usd'
        windowStart:
          type: [string, 'null']
          format: date-time
          description: The start of this month (UTC); null for a task tree.
        thresholdPercent:
          type: integer
          description: At this share of the limit, `budget.threshold-reached` is published (once per window).
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: When the limit was last set; null if it never was.

    # ---------- tool servers ----------
    ToolServerName:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,29}$'
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.-]+$'
    ToolServerAuthType:
      type: string
      description: |
        How Hephaestus authenticates to the server: `none`; `header`, sending
        the credential in `headerName`; or `task-token`, sending the running
        task's own Pistis token as a bearer token (only to servers whose
        origin the platform trusts, `TOOL_SERVER_TRUSTED_ORIGINS`: Aether-os's
        own, such as Seshat).
      enum: [none, header, task-token]
    ToolServerAuth:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/ToolServerAuthType' }
        headerName:
          description: For `header`; `Authorization` when left out.
          type: string
          pattern: '^[A-Za-z0-9-]{1,64}$'
    ToolServerUrl:
      type: string
      format: uri
      maxLength: 2000
      description: The MCP endpoint (Streamable HTTP); `https://`, or `http://` only where Hephaestus may reach private addresses (local development).
      pattern: '^https?://'
    CreateToolServerRequest:
      type: object
      additionalProperties: false
      required: [name, url, auth]
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    UpdateToolServerRequest:
      type: object
      additionalProperties: false
      required: [description, url, auth]
      properties:
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    SetToolServerCredentialRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 8, maxLength: 4096 }
    ToolServerCredential:
      type: object
      additionalProperties: false
      required: [hint, updatedBy, updatedAt]
      properties:
        hint: { type: string, description: 'The last four characters, e.g. `…ab12`.' }
        updatedBy: { type: string }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerResponse:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, description, url, auth, credential, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string }
        url: { type: string }
        auth:
          type: object
          additionalProperties: false
          required: [type, headerName]
          properties:
            type: { $ref: '#/components/schemas/ToolServerAuthType' }
            headerName:
              type: [string, 'null']
        credential:
          description: That a `header` credential is set; null when none is.
          oneOf:
            - { $ref: '#/components/schemas/ToolServerCredential' }
            - { type: 'null' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolServerResponse' }
    ToolDescription:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    ToolList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolDescription' }
