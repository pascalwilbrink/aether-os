      operationId: rejectCouncilPlan
      x-permission: '`session:use` and `task:approve` in the project; only the person who started the session'
      description: >-
        Rejects a proposed plan, with an optional comment for the facilitator. Refused for a plan that isn't `proposed` (`PLAN_NOT_PROPOSED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectCouncilPlanRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The plan, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
