openapi: 3.1.0
info:
  title: Hephaestus API
  version: 0.11.0
  description: |
    AI Agent Factory for Aether-os. Source of truth for the Hephaestus HTTP
    contract; Hephaestus and Iris generate their API types from this file.

    Organizations and projects belong to Polis: Hephaestus keeps a copy of
    their status from Polis's events, so a write in a suspended organization
    or for an archived project is rejected (409) here too. An organization or
    project Hephaestus hasn't seen yet is looked up in Polis; if Polis can't be
    reached then, the request fails with `503 UNAVAILABLE`.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Actions are idempotent where that's natural (archiving an archived
    agent, publishing the published version); workspace transitions stay
    strict (`409`).

    Every operation needs a Pistis access token for the organization
    (`Authorization: Bearer`); `x-permission` names what it requires
    (`../docs/identity.md`). Another organization's `{organizationId}`, and a
    project the caller can't read, are 404. `createdBy` is the caller's `sub`.

security:
  - pistis: []

tags:
  - name: agents
  - name: agent-versions
  - name: workspaces
  - name: tasks

paths:
  /v1/organizations/{organizationId}/agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [agents]
      operationId: createAgent
      x-permission: '`agent:write`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agents]
      operationId: listAgents
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: archiveAgent
      x-permission: '`agent:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agent-versions]
      operationId: createAgentVersion
      x-permission: '`agent:write`'
      description: Creates a draft version; the version number is assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agent-versions]
      operationId: listAgentVersions
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Highest version first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [agent-versions]
      operationId: getAgentVersion
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [agent-versions]
      operationId: publishAgentVersion
      x-permission: '`agent:publish`'
      description: |
        Publishes a draft and deprecates the previously published version.
        Publishing the version that's already published returns it unchanged;
        a deprecated version can't be published again (409).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      x-permission: '`workspace:manage` in the body''s project'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      x-permission: '`workspace:read`; lists only workspaces in projects the caller can read'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      x-permission: '`workspace:read` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/acquire:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: acquireWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/release:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: releaseWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/suspend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: suspendWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/resume:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: resumeWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/workspaces/{workspaceId}/destroy:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: destroyWorkspace
      x-permission: '`workspace:manage` in the workspace''s project'
      description: Starts teardown (status `stopping`); the provisioner completes it.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/WorkspaceTransition' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [tasks]
      operationId: createTask
      x-permission: '`task:create` in the project'
      description: |
        Creates a task (or, with `parentTaskId`, a subtask) that runs as a
        service account (`docs/identity.md`: tasks never run as a user; the
        caller is recorded as `requestedBy`). The agent's published version
        is pinned now (`AGENT_NOT_PUBLISHED` without one). A task starts
        `blocked` until every task in `dependsOn` has succeeded, otherwise
        `queued`. `dependsOn` may only name tasks under the same top-level
        task (`TASK_DEPENDENCY_INVALID`).

        Idempotent per `Idempotency-Key`: a repeated key returns the task it
        created (`200`) instead of creating another.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '200':
          description: Already created with this `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [tasks]
      operationId: listTasks
      x-permission: '`task:read` in the project'
      parameters:
        - name: parentTaskId
          in: query
          required: false
          description: Only the subtasks of this task.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      x-permission: '`task:read` in the project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: cancelTask
      x-permission: '`task:cancel` in the project'
      description: |
        Cancels the task and every unfinished task under it. Idempotent for
        a cancelled task; a task that already succeeded or failed can't be
        cancelled (`TASK_INVALID_TRANSITION`).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cancelled (or already cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: retryTask
      x-permission: '`task:create` in the project'
      description: |
        Retries a failed task with the same pinned inputs (a new attempt of
        the same task, so dependents keep pointing at it). Only failed tasks
        (`TASK_INVALID_TRANSITION`).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Queued again (or blocked on its dependencies)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [artifacts]
      operationId: listTaskArtifacts
      x-permission: '`task:read` in the project'
      description: |
        What the task produced (docs/tasks.md, Artifacts), across its
        executions: the primary artifact and others once it succeeded,
        `partial` ones from failed executions, `pending` ones while it runs.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ArtifactStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getTaskArtifact
      x-permission: '`task:read` in the project'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/approve:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: approveArtifact
      x-permission: '`task:approve` in the project'
      description: |
        Approves a draft: it becomes `final`. The task succeeds once none of
        its drafts is waiting any more and none needs changes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: rejectArtifact
      x-permission: '`task:approve` in the project'
      description: |
        Rejects a draft: it becomes `rejected`, and the task fails with
        `rejected` (its other drafts become `partial`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: requestArtifactChanges
      x-permission: '`task:approve` in the project'
      description: |
        Sends a draft back with comments: it becomes `changes_requested`.
        Once none of the task's drafts is waiting, the agent runs again with
        the comments and produces revised drafts (`revisionOf`). Refused
        after the last review round (`TASK_REVIEW_ROUNDS_EXHAUSTED`):
        approve or reject then.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestChangesRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/executions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskExecutions
      x-permission: '`task:read` in the project'
      description: |
        The task's executions (docs/tasks.md, Executions): one per try in a
        sandbox, including the automatic retries after infrastructure
        failures and those of later attempts.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }
    WorkspaceTransition:
      description: Transition applied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceResponse' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_NOT_PUBLISHED
        - AGENT_VERSION_CONFLICT
        - AGENT_VERSION_INVALID_TRANSITION
        - ARTIFACT_NOT_DRAFT
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - TASK_CRITERIA_INVALID
        - TASK_DEPENDENCY_INVALID
        - TASK_INVALID_TRANSITION
        - TASK_PARENT_FINISHED
        - TASK_REVIEW_ROUNDS_EXHAUSTED
        - WORKSPACE_INVALID_EXPIRY
        - WORKSPACE_INVALID_TRANSITION
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time

    # ---------- agents ----------
    AgentStatus:
      type: string
      enum: [active, archived]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AgentResponse:
      type: object
      required: [id, organizationId, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentResponse' }

    # ---------- agent versions ----------
    AgentVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        configuration:
          type: object
          additionalProperties: true
    AgentSkillConfiguration:
      type: object
      additionalProperties: false
      required: [name, version, enabled]
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        enabled: { type: boolean }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
    CreateAgentVersionRequest:
      type: object
      additionalProperties: false
      required: [instructions, model, capabilities, tools, skills, runtime]
      properties:
        instructions: { type: string, minLength: 1 }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
    AgentVersionResponse:
      type: object
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AgentVersionStatus' }
        instructions: { type: string }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    AgentVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentVersionResponse' }

    # ---------- workspaces ----------
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, in_use, suspended, stopping, destroyed, failed, expired]
    RepositoryProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    RepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [provider, repositoryUrl, branch]
      properties:
        provider: { $ref: '#/components/schemas/RepositoryProvider' }
        repositoryUrl:
          type: string
          format: uri
          pattern: '^https://'
        branch: { type: string, minLength: 1 }
        commitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    NetworkAccess:
      type: string
      enum: [none, restricted, full]
    SandboxConfiguration:
      type: object
      additionalProperties: false
      required: [provider, image, cpuLimit, memoryLimitMb, networkAccess]
      properties:
        provider: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        cpuLimit: { type: number, exclusiveMinimum: 0 }
        memoryLimitMb: { type: integer, minimum: 1 }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
    SandboxReference:
      type: object
      required: [provider, resourceId]
      properties:
        provider: { type: string }
        resourceId: { type: string }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [projectId, executionId, sandbox, workingDirectory, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        repository:
          description: The repository to check out; none for a sandbox without one.
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        workingDirectory:
          type: string
          pattern: '^/'
          description: Absolute path inside the sandbox.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future.
    WorkspaceResponse:
      type: object
      required: [id, organizationId, projectId, executionId, status, repository, sandbox, sandboxReference, workingDirectory, failureReason, expiresAt, createdAt, updatedAt, startedAt, destroyedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        repository:
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        sandboxReference:
          oneOf:
            - $ref: '#/components/schemas/SandboxReference'
            - type: 'null'
        workingDirectory: { type: string }
        failureReason: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          type: [string, 'null']
          format: date-time
        destroyedAt:
          type: [string, 'null']
          format: date-time
    WorkspacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceResponse' }

    # ---------- tasks ----------
    TaskStatus:
      type: string
      enum: [blocked, queued, provisioning, running, verifying, awaiting_review, waiting, paused, delivering, succeeded, failed, cancelled]
      description: The lifecycle in `docs/tasks.md` (Task lifecycle).
    TaskFailureReason:
      type: string
      enum: [agent_failed, verification_failed, rejected, timeout, budget_exceeded, infrastructure, subtask_failed, access_denied]
      description: |
        Why a task failed. `access_denied`: Pistis refused a task token for
        its service account (no role in the project, disabled, or not a
        member of the organization).
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, instructions, agentId, serviceAccountId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, minLength: 1, maxLength: 100000 }
        agentId:
          type: string
          format: uuid
          description: Its published version is pinned when the task is created.
        serviceAccountId:
          type: string
          format: uuid
          description: The Pistis service account the task runs as.
        parentTaskId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: Makes this a subtask (in the same project).
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Tasks under the same top-level task that must succeed first.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: The definition of done (docs/tasks.md); checked after every run. Keys are unique.
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
    AcceptanceCriterionRequest:
      type: object
      additionalProperties: false
      required: [key, description, check]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        check: { $ref: '#/components/schemas/CriterionCheck' }
    AcceptanceCriterion:
      allOf:
        - $ref: '#/components/schemas/AcceptanceCriterionRequest'
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [task]
              description: Where it came from (templates and spec requirements later).
    CriterionCheck:
      description: How a criterion is checked; by Hephaestus, never by the agent's word.
      oneOf:
        - $ref: '#/components/schemas/CommandCheck'
        - $ref: '#/components/schemas/ArtifactCheck'
        - $ref: '#/components/schemas/ManualCheck'
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandCheck'
          artifact: '#/components/schemas/ArtifactCheck'
          manual: '#/components/schemas/ManualCheck'
    CommandCheck:
      type: object
      additionalProperties: false
      required: [type, command]
      description: Run in the task's sandbox (the agent version must need one); exit code 0 passes.
      properties:
        type: { type: string, const: command }
        command: { type: string, minLength: 1, maxLength: 4000 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900, description: '300 if left out.' }
    ArtifactCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: A structural check on the run's artifacts; every given condition must hold.
      properties:
        type: { type: string, const: artifact }
        primaryKind: { type: string, minLength: 1, description: The primary artifact's kind. }
        titles:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
          description: Artifacts with these titles exist.
    ManualCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: Left to the reviewer; approving the draft confirms it.
      properties:
        type: { type: string, const: manual }
    TaskReviewSettings:
      type: object
      additionalProperties: false
      required: [artifactKinds]
      description: |
        Which of the task's artifacts need approval before they're final
        (docs/tasks.md, What needs approval). Pinned when the task is
        created; automations and Themis policy will add to it later.
      properties:
        artifactKinds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Artifact kinds that need approval; `*` for every kind. Empty for none.
          items: { type: string, minLength: 1, maxLength: 50 }
    TaskResponse:
      type: object
      required: [id, organizationId, projectId, parentTaskId, topLevelTaskId, title, instructions, agentId, agentVersionId, serviceAccountId, requestedBy, status, failureReason, dependsOn, attempt, primaryArtifactId, review, reviewRound, acceptanceCriteria, createdAt, updatedAt, finishedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        topLevelTaskId:
          type: string
          format: uuid
          description: The tree's root (its own ID for a top-level task).
        title: { type: string }
        instructions: { type: string }
        agentId: { type: string, format: uuid }
        agentVersionId:
          type: string
          format: uuid
          description: The agent version pinned when the task was created.
        serviceAccountId: { type: string, format: uuid }
        requestedBy: { type: string, description: The `sub` of whoever created the task. }
        status: { $ref: '#/components/schemas/TaskStatus' }
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/TaskFailureReason'
            - { type: 'null' }
        dependsOn:
          type: array
          items: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: '1, plus one per retry.' }
        primaryArtifactId:
          type: [string, 'null']
          format: uuid
          description: The outcome of a succeeded task (docs/tasks.md, Primary artifact); null otherwise.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        reviewRound:
          type: integer
          minimum: 0
          description: How many times the task has waited for review (0 before the first).
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterion' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1, description: The `aggregateVersion` of its latest event. }
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskResponse' }
    ArtifactStatus:
      type: string
      enum: [pending, draft, final, rejected, changes_requested, partial]
      description: |
        `pending`: recorded while its execution runs; becomes `final` when
        the task succeeds, `partial` when the execution fails. `draft`,
        `rejected` and `changes_requested` come with reviews.
    ArtifactBase:
      type: object
      required: [id, organizationId, projectId, taskId, executionId, agentVersionId, kind, status, primary, revisionOf, title, metadata, review, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        agentVersionId: { type: string, format: uuid }
        kind: { type: string }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        primary: { type: boolean }
        revisionOf: { type: [string, 'null'], format: uuid }
        title: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        review:
          description: The decision on a draft; null until someone made one.
          oneOf:
            - { $ref: '#/components/schemas/ArtifactReview' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TextArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, format, content]
          properties:
            kind: { type: string, const: text }
            format: { type: string, enum: [markdown, plain] }
            content: { type: string }
    JsonArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, schema, content]
          properties:
            kind: { type: string, const: json }
            schema:
              type: [string, 'null']
              description: An optional identifier of the content's schema.
            content: {}
    VerificationArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, round, results]
          properties:
            kind: { type: string, const: verification }
            round: { type: integer, minimum: 1, description: 'Within its execution: 1, plus one per run after failed checks.' }
            results:
              type: array
              items: { $ref: '#/components/schemas/CriterionResult' }
    CriterionResult:
      type: object
      additionalProperties: false
      required: [key, outcome, output]
      properties:
        key: { type: string }
        outcome: { type: string, enum: [passed, failed, manual] }
        output: { type: string, description: 'What the check said: a command''s output (its last 16 KiB), or why it failed.' }
    ArtifactResponse:
      description: One artifact; `kind` says which (an open set).
      oneOf:
        - $ref: '#/components/schemas/TextArtifact'
        - $ref: '#/components/schemas/JsonArtifact'
        - $ref: '#/components/schemas/VerificationArtifact'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextArtifact'
          json: '#/components/schemas/JsonArtifact'
          verification: '#/components/schemas/VerificationArtifact'
    ArtifactReview:
      type: object
      additionalProperties: false
      required: [decision, comments, decidedBy, decidedAt]
      properties:
        decision: { type: string, enum: [approved, rejected, changes_requested] }
        comments:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }
        decidedBy: { type: string, description: The reviewer's `sub`. }
        decidedAt: { type: string, format: date-time }
    ReviewComment:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        anchor:
          type: string
          maxLength: 500
          description: Where in the artifact it points (a line, a JSON pointer, a heading); free-form.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }
    RequestChangesRequest:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReviewComment' }
    ArtifactPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtifactResponse' }
    ExecutionStatus:
      type: string
      enum: [provisioning, running, completed, failed, cancelled]
    ExecutionFailureReason:
      type: string
      enum: [agent_failed, timeout, infrastructure, access_denied, interrupted, verification_failed]
      description: |
        `infrastructure` (a crash, a missed heartbeat, a provisioning timeout,
        an unreachable dependency) is retried automatically, up to a limit;
        `interrupted` (Hephaestus shut down) is retried without counting
        against it. The others fail the task.
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, taskId, attempt, number, status, failureReason, error, summary, usage, startedAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: The task's attempt it belongs to. }
        number: { type: integer, minimum: 1, description: '1, 2, … within the task.' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        failureReason:
          oneOf:
            - { $ref: '#/components/schemas/ExecutionFailureReason' }
            - { type: 'null' }
        error:
          type: [string, 'null']
          description: What went wrong, for people; never contains secrets.
        summary:
          type: [string, 'null']
          description: What the agent reported when it finished (until artifacts exist).
        usage: { $ref: '#/components/schemas/ExecutionUsage' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionUsage:
      type: object
      additionalProperties: false
      description: |
        The model calls the execution made through the model gateway, and
        their tokens (docs/models.md, Metering). Tokens a provider didn't
        report count as 0.
      required: [modelCalls, inputTokens, outputTokens]
      properties:
        modelCalls: { type: integer, minimum: 0 }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExecutionResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }
