              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: rejectArtifact
      x-permission: '`task:approve` in the project'
      description: |
        Rejects a draft: it becomes `rejected`, and the task fails with
        `rejected` (its other drafts become `partial`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/artifacts/{artifactId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: requestArtifactChanges
      x-permission: '`task:approve` in the project'
      description: |
        Sends a draft back with comments: it becomes `changes_requested`.
        Once none of the task's drafts is waiting, the agent runs again with
        the comments and produces revised drafts (`revisionOf`). Refused
        after the last review round (`TASK_REVIEW_ROUNDS_EXHAUSTED`):
        approve or reject then.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestChangesRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The artifact, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/executions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskExecutions
      x-permission: '`task:read` in the project'
      description: |
        The task's executions (docs/tasks.md, Executions): one per try in a
        sandbox, including the automatic retries after infrastructure
        failures and those of later attempts.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/executions/{executionId}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      operationId: listExecutionEvents
      x-permission: '`task:read` in the project'
      description: |
        What the execution did, as it happens (docs/tasks.md, Activity): the
        runner's steps, each model call and each tool call, oldest first,
        numbered within the execution. Follow a running one by asking again
        with `after` set to the last `sequence` seen (`nextAfter`), until
        `executionStatus` is no longer `provisioning` or `running`. Text is
        shortened and what looks like a secret is redacted before it's kept.
      parameters:
        - name: after
          in: query
          required: false
          description: Only events after this sequence number (0, the default, for all).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionEventPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/tasks/{taskId}/budget:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [budgets]
      operationId: getTaskTreeBudget
      x-permission: '`task:read` in the project'
      description: |
        The budget of the task's tree (its top-level task's), for the tree's
        whole life. Budgets are Pylon's (`../docs/pylon.md`): Hephaestus
        checks the task and reads it there with its own token.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [budgets]
      operationId: setTaskTreeBudget
      x-permission: '`task:create` in the project'
      description: |
        Sets (or removes) the limit of the task's tree, in Pylon, with the
        caller's own token; its paused tasks resume once it has room. `503`
        when Pylon doesn't answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBudgetRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [tool-servers]
      operationId: listToolServers
      x-permission: '`agent:read`'
      description: The organization's tool servers, by name (at most 50).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [tool-servers]
      operationId: createToolServer
      x-permission: '`org:manage`'
      description: |
        Registers an MCP server (Streamable HTTP) that the organization's agent
        versions can take tools from (`tools[].name` is its `name`).
        Hephaestus connects to it, never the sandbox. A `header` credential is
        set separately (`PUT …/credential`) and kept in OpenBao.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: getToolServer
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tool-servers]
      operationId: updateToolServer
      x-permission: '`org:manage`'
      description: |
        Replaces its description, URL and authentication (the name stays: agent
        versions refer to it). Changing the URL or the authentication removes
        the credential, so it isn't sent somewhere new without being set again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServer
      x-permission: '`org:manage`'
      description: |
        Removes it and its credential. Tasks of agent versions that use it
        then fail without retrying until a server with its name exists again.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/credential:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    put:
      tags: [tool-servers]
      operationId: setToolServerCredential
      x-permission: '`org:secret:write`'
      description: |
        Sets the value sent in the server's `auth.headerName` header (for
        `Authorization`, include the scheme: `Bearer …`). Kept in OpenBao and
        never returned; only its last four characters are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetToolServerCredentialRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServerCredential
      x-permission: '`org:secret:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/tools:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: listToolServerTools
      x-permission: '`agent:read`'
      description: |
        Connects to the server and lists the tools it offers now, to choose
        from for an agent version. A `task-token` server is sent the caller's
        own token.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503':
          description: The tool server couldn't be reached or refused the request (`UNAVAILABLE`); `detail` says what it answered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }


  /v1/organizations/{organizationId}/projects/{projectId}/sessions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [sessions]
      operationId: createSession
      x-permission: '`session:use` in the project'
      description: |
        Starts a session (`../docs/interaction.md`): a conversation between
        the caller and an agent in the project, or with a council
        (`../docs/councils.md`): its facilitator and members. Exactly one of
        `agentId` and `councilId`. The published versions are pinned now,
        like a task's: the agent's (`AGENT_NOT_PUBLISHED`, `AGENT_ARCHIVED`),
        or the council's (`COUNCIL_UNAVAILABLE`) with its facilitator's and
        each member's published agent version. The session acts for the
        caller, read-only. Only the person who started it can see and use it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [sessions]
      operationId: listSessions
      x-permission: '`session:use` in the project'
      description: The caller's own sessions in the project, newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SessionStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      x-permission: '`session:use` in the project; only the person who started it'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
