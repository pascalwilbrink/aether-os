        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliberationRoundPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/sessions/{sessionId}/mode:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: setSessionMode
      x-permission: '`session:use` in the project; only the person who started it'
      description: >-
        Switches a council session's mode, among those its council allows (`direct` with
        `allowDirectInteraction`, `facilitated` always, `discussion` with `allowDiscussion`;
        `planning` and `delegation` come with plans). Refused for an agent session, a mode the
        council doesn't allow (`SESSION_MODE_INVALID`), an ended session (`SESSION_ENDED`) or one
        answering (`SESSION_BUSY`). Setting the mode it's in returns it unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSessionModeRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The session, in its mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/projects/{projectId}/sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: endSession
      x-permission: '`session:use` in the project; only the person who started it'
      description: Ends the session (its messages stay); ending an ended session returns it unchanged.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/projects/{projectId}/sessions/{sessionId}/runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: runSession
      x-permission: '`session:use` in the project; only the person who started it'
      description: |
        The session's AG-UI endpoint (`../docs/interaction.md`; the AG-UI
        protocol, docs.ag-ui.com): takes a `RunAgentInput` and streams AG-UI
        events back as server-sent events (`data: <event JSON>`), the run
        being one turn of the agent. `threadId` is the session's ID.

        The session's own history is what the agent sees: of the input's
        `messages`, those it doesn't have yet (by `id`) are added: `user`
        messages, and `tool` messages answering the frontend's tools; the
        others are ignored. A run needs at least one new message. `tools` are
        the frontend's tools: when the agent calls one, the run ends with
        that call (`TOOL_CALL_START`, `TOOL_CALL_ARGS`, `TOOL_CALL_END`) and
        the frontend answers it with a `tool` message in the next run.
        `context` entries are given to the agent for this run.

        In a council session the facilitator answers, with the council's
        tools: `ask_member` (one member answers in the session; required
        members, and the ones it invited) and `invite_members`. A member's
        message starts with a `CUSTOM` event named `message-author`
        (`{ messageId, author }`), as every message of the run does. With
        `forwardedProps.memberAgentId`, the person addresses that member
        directly instead (`allowDirectInteraction`; else, or for an agent
        that isn't a member, `SESSION_MEMBER_INVALID`).

        The agent runs with a session token Hephaestus obtains from Pistis
        for the caller (read-only: the agent sees what the caller can see,
        and changes nothing itself), its version's tool servers and skills,
        the project's knowledge (read-only), and its model through Pylon
        (metered and budgeted for the session; a budget that ran out ends the
        run with `RUN_ERROR`, code `BUDGET_EXHAUSTED`).

        Events: `RUN_STARTED`, `TEXT_MESSAGE_START` / `_CONTENT` / `_END`,
        `TOOL_CALL_START` / `_ARGS` / `_END`, `TOOL_CALL_RESULT` (the agent's
        own tools), and `RUN_FINISHED` or `RUN_ERROR` (`message`, `code`).
        One run at a time per session (`SESSION_BUSY`); an ended session
        runs no more (`SESSION_ENDED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunAgentInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The run's AG-UI events, as server-sent events.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolServerId:
      name: toolServerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }
    WorkspaceTransition:
      description: Transition applied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceResponse' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_NOT_PUBLISHED
        - ARTIFACT_NOT_DRAFT
        - TASK_BUDGET_INVALID
        - TASK_CONCURRENCY_INVALID
        - TASK_CONCURRENCY_SKIPPED
        - TASK_CONTEXT_INVALID
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - TASK_CRITERIA_INVALID
        - TASK_FIELDS_INVALID
        - TASK_DEPENDENCY_INVALID
        - TASK_INVALID_TRANSITION
        - TASK_PARENT_FINISHED
        - TASK_REVIEW_ROUNDS_EXHAUSTED
        - TASK_TEMPLATE_ARCHIVED
        - TASK_TEMPLATE_INPUTS_INVALID
        - TASK_TEMPLATE_INVALID
        - TOOL_SERVER_ALREADY_EXISTS
        - TOOL_SERVER_INVALID
        - SESSION_BUSY
        - SESSION_ENDED
        - SESSION_MEMBER_INVALID
        - SESSION_MODE_INVALID
        - PLAN_NOT_PROPOSED
        - PLAN_ASSIGNMENT_INVALID
        - COUNCIL_UNAVAILABLE
        - WORKSPACE_INVALID_EXPIRY
        - WORKSPACE_INVALID_TRANSITION
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time

    # ---------- agent versions (Agora's; checked here) ----------
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      description: |
        Tools from one of the organization's tool servers (MCP): the agent
        gets them as `<name>_<tool>`. An enabled entry must name an existing
        tool server when the version is created.
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        enabled: { type: boolean }
        tools:
          description: Which of the server's tools, by name; all of them when left out.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ToolName' }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
        networkAccess:
          description: |
            The sandbox's network (../CLAUDE.md, sandboxes): `none` (the
            default) or `restricted`, where it reaches only allowed hosts
            through an allowlisting proxy: the platform's (package
            registries, `SANDBOX_ALLOWED_HOSTS`) and `allowedHosts`.
          type: string
          enum: [none, restricted]
        allowedHosts:
          description: Hosts a `restricted` sandbox may reach on ports 80 and 443, besides the platform's; `*.example.com` for its subdomains.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/HostPattern' }
    HostPattern:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    AgentVersionCheckRequest:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }

    # ---------- workspaces ----------
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, in_use, suspended, stopping, destroyed, failed, expired]
    RepositoryProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    RepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [provider, repositoryUrl, branch]
      properties:
        provider: { $ref: '#/components/schemas/RepositoryProvider' }
        repositoryUrl:
          type: string
          format: uri
          pattern: '^https://'
        branch: { type: string, minLength: 1 }
        commitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    NetworkAccess:
      type: string
      enum: [none, restricted, full]
    SandboxConfiguration:
      type: object
      additionalProperties: false
      required: [provider, image, cpuLimit, memoryLimitMb, networkAccess]
      properties:
        provider: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        cpuLimit: { type: number, exclusiveMinimum: 0 }
        memoryLimitMb: { type: integer, minimum: 1 }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it may reach.
          type: array
          items: { $ref: '#/components/schemas/HostPattern' }
    SandboxReference:
      type: object
      required: [provider, resourceId]
      properties:
        provider: { type: string }
        resourceId: { type: string }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [projectId, executionId, sandbox, workingDirectory, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        repository:
          description: The repository to check out; none for a sandbox without one.
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        workingDirectory:
          type: string
          pattern: '^/'
          description: Absolute path inside the sandbox.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future.
    WorkspaceResponse:
      type: object
      required: [id, organizationId, projectId, executionId, status, repository, sandbox, sandboxReference, workingDirectory, blockedHosts, failureReason, expiresAt, createdAt, updatedAt, startedAt, destroyedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        repository:
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        sandboxReference:
          oneOf:
            - $ref: '#/components/schemas/SandboxReference'
            - type: 'null'
        workingDirectory: { type: string }
        blockedHosts:
          description: Hosts the sandbox tried to reach and its proxy refused (`restricted` access), recorded when it's destroyed.
          type: array
          items: { type: string }
        failureReason: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          type: [string, 'null']
          format: date-time
        destroyedAt:
          type: [string, 'null']
          format: date-time
    WorkspacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceResponse' }

    # ---------- tasks ----------
    TaskStatus:
      type: string
      enum: [blocked, queued, provisioning, running, verifying, awaiting_review, waiting, paused, delivering, succeeded, failed, cancelled]
      description: The lifecycle in `docs/tasks.md` (Task lifecycle).
    TaskFailureReason:
      type: string
      enum: [agent_failed, verification_failed, rejected, timeout, budget_exceeded, infrastructure, subtask_failed, access_denied]
      description: |
        Why a task failed. `access_denied`: Pistis refused a task token for
        its service account (no role in the project, disabled, or not a
        member of the organization).
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, agentId, serviceAccountId]
      description: |
        A task's brief (docs/tasks.md, Task fields): what and why
        (`description`), what must be implemented (`requirements`), the end
        state (`expectedOutcome`), limits on how (`constraints`), what it
        hands over (`deliverables`) and how it's checked
        (`acceptanceCriteria`). `description` or, until the next contract
        version, its old name `instructions` is required
        (`TASK_FIELDS_INVALID`).
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description:
          type: string
          minLength: 1
          maxLength: 100000
          description: What needs to be done and why (Markdown).
        instructions:
          type: string
          minLength: 1
          maxLength: 100000
          deprecated: true
          description: The old name of `description`; ignored when `description` is given.
        requirements:
          type: array
          maxItems: 50
          description: 'What must be implemented, e.g. `REQ-1`, "Expose GET /v1/invoices". Keys are unique among requirements and constraints.'
          items: { $ref: '#/components/schemas/TaskItem' }
        expectedOutcome:
          type: string
          maxLength: 65536
          description: The end state the completed task should leave, in words (Markdown).
        constraints:
          type: array
          maxItems: 50
          description: Limits on how it's done, e.g. "No new dependencies".
          items: { $ref: '#/components/schemas/TaskItem' }
        deliverables:
          type: array
          maxItems: 20
          description: |
            What the task hands over. Each is checked: it implies an
            `artifact` criterion (`source: deliverable`, key
            `deliverable.<key>`) that the run submitted an artifact for it
            (the agent names the deliverable's key), or for a
            `pull_request` deliverable that it committed in the task's
            repository (which the task then needs). Keys are unique; at
            most one is `primary`.
          items: { $ref: '#/components/schemas/TaskDeliverable' }
        agentId:
          type: string
          format: uuid
          description: Its published version is pinned when the task is created.
        serviceAccountId:
          type: string
          format: uuid
          description: The Pistis service account the task runs as.
        parentTaskId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: Makes this a subtask (in the same project).
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Tasks under the same top-level task that must succeed first.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: The definition of done (docs/tasks.md); checked after every run. Keys are unique.
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: |
            The repository the task works in: one of its project's links in
            Proxenos (`docs/git.md`). A subtask without one works in its
            parent's (the tree shares a branch).
        budgetUsd:
          description: |
            A limit for the whole task tree's model calls (docs/models.md,
            Budgets), set in Pylon with the caller's token; only on a
            top-level task (`TASK_BUDGET_INVALID`), and only through this
            API (a `task.create` command can't carry it). Raise it later
            with `PUT …/tasks/{taskId}/budget`.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        inputFiles:
          type: array
          maxItems: 20
          description: |
            Files the task starts from: files of its project in Loculus
            (docs/files.md), uploaded first. The agent finds them in its
            sandbox, in `/workspace/inputs`, so its version needs one
            (else the execution fails without retrying).
          items: { $ref: '#/components/schemas/TaskInputFile' }
        context:
          type: array
          maxItems: 50
          description: |
            Project knowledge the task should know (docs/tasks.md, `context`):
            accepted items of its project in Seshat, each pinned at its
            current version when the task is created, so every execution
            and retry gets the same. Their text goes into the agent's
            prompt as reference material (a document's is listed, to read
            with the knowledge tools). An item that isn't an accepted item
            of the project is `TASK_CONTEXT_INVALID`; Seshat not answering
            is `503`.
          items: { $ref: '#/components/schemas/TaskContextReference' }
        untrustedInputs:
          type: array
          maxItems: 20
          description: |
            Text from outside the organization (an issue's title through an
            automation, docs/git.md Untrusted input): the task's text fields
            name each as `{{name}}`. Where people read the task, the value is
            filled in; in the agent's prompt it is filled in marked as data,
            never as instructions. Names are unique (`TASK_FIELDS_INVALID`).
          items: { $ref: '#/components/schemas/UntrustedInput' }
    UntrustedInput:
      type: object
      additionalProperties: false
      required: [name, source, value]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$', description: 'Named as `{{name}}` in the text fields, e.g. `issue.title`.' }
        source: { type: string, minLength: 1, maxLength: 300, description: 'Where it came from, e.g. "GitHub issue #12 in acme/api, opened by @octocat".' }
        value: { type: string, maxLength: 65536 }
    TaskContextReference:
      type: object
      additionalProperties: false
      required: [kind, itemId]
      properties:
        kind:
          type: string
          enum: [knowledge]
          description: Only project knowledge (Seshat) so far.
        itemId: { type: string, format: uuid, description: A knowledge item of the task's project. }
    PinnedTaskContext:
      type: object
      additionalProperties: false
      required: [kind, itemId, version, type, title]
      properties:
        kind:
          type: string
          enum: [knowledge]
        itemId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: The item's version the task got. }
        type: { type: string, description: 'The item''s kind in Seshat: decision, convention, fact, architecture, lesson or document.' }
        title: { type: string }
    TaskItem:
      type: object
      additionalProperties: false
      required: [key, description]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
        description: { type: string, minLength: 1, maxLength: 4000 }
    TaskDeliverable:
      type: object
      additionalProperties: false
      required: [key, kind, description]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        kind:
          type: string
          enum: [text, json, file, pull_request]
          description: The artifact kind it is (task plans and documents later).
        description: { type: string, minLength: 1, maxLength: 4000 }
        primary:
          type: boolean
          description: The task's main outcome; the artifact submitted for it becomes the primary one.
        path:
          type: string
          minLength: 1
          maxLength: 200
          description: For a `file` deliverable, its file name, or a pattern with `*` (e.g. `report-*.md`).
    TaskInputFile:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId: { type: string, format: uuid, description: A file of the task's project in Loculus. }
    TaskRepository:
      type: object
      additionalProperties: false
      required: [linkId]
      properties:
        linkId:
          type: string
          format: uuid
          description: A repository link of the task's project (Proxenos). Checked when the task runs.
    AcceptanceCriterionRequest:
      type: object
      additionalProperties: false
      required: [key, description, check]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        requirementKey:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
          description: The requirement or constraint it checks (one of the task's keys, else `TASK_CRITERIA_INVALID`).
        check: { $ref: '#/components/schemas/CriterionCheck' }
    AcceptanceCriterion:
      allOf:
        - $ref: '#/components/schemas/AcceptanceCriterionRequest'
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [template, task, deliverable]
              description: Where it came from; `deliverable` for those a deliverable implies (spec requirements later).
    CriterionCheck:
      description: How a criterion is checked; by Hephaestus, never by the agent's word.
      oneOf:
        - $ref: '#/components/schemas/CommandCheck'
        - $ref: '#/components/schemas/ArtifactCheck'
        - $ref: '#/components/schemas/ManualCheck'
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandCheck'
          artifact: '#/components/schemas/ArtifactCheck'
          manual: '#/components/schemas/ManualCheck'
    CommandCheck:
      type: object
      additionalProperties: false
      required: [type, command]
      description: Run in the task's sandbox (the agent version must need one); exit code 0 passes.
      properties:
        type: { type: string, const: command }
        command: { type: string, minLength: 1, maxLength: 4000 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900, description: '300 if left out.' }
    ArtifactCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: A structural check on the run's artifacts; every given condition must hold.
      properties:
        type: { type: string, const: artifact }
        primaryKind: { type: string, minLength: 1, description: The primary artifact's kind. }
        titles:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
          description: Artifacts with these titles exist.
        deliverable:
          type: string
          minLength: 1
          description: An artifact was submitted for this deliverable of the task (for a `pull_request` one, the run committed in the repository).
    ManualCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: Left to the reviewer; approving the draft confirms it.
      properties:
        type: { type: string, const: manual }
    TemplateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,49}$'
          description: Referred to as `{{name}}` in the title and the text fields (description, expected outcome, and the descriptions of requirements, constraints and deliverables).
        description: { type: string, maxLength: 1000 }
        required: { type: boolean, description: 'true if left out.' }
    TemplateExtends:
      type: object
      additionalProperties: false
      required: [templateId, version]
      description: An organization-wide template version this project template builds on.
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    TaskTemplateContent:
      type: object
      additionalProperties: false
      description: |
        One version of a template, with a task's fields (`{{input}}`
        placeholders in the text ones); `instructions` becomes the task's
        `description`. A project template that `extends`
        an organization template inherits its agent, title, inputs,
        criteria and review settings, appends its own description and
        expected outcome to the organization's, and can only add inputs,
        requirements, constraints, deliverables and criteria.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions:
          type: string
          minLength: 1
          maxLength: 100000
          description: The task's description (what and why); `description` is the template's own.
        requirements:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskItem' }
        expectedOutcome: { type: string, maxLength: 65536 }
        constraints:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskItem' }
        deliverables:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TaskDeliverable' }
        context:
          type: array
          maxItems: 50
          description: Knowledge pinned on every task from it (e.g. the project's conventions); a project template adds to what it extends. Only a project's template pins knowledge, which belongs to one project (`TASK_TEMPLATE_INVALID` on an organization-wide one).
          items: { $ref: '#/components/schemas/TaskContextReference' }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        extends: { $ref: '#/components/schemas/TemplateExtends' }
    CreateTaskTemplateRequest:
      allOf:
        - $ref: '#/components/schemas/TaskTemplateContent'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            description: { type: string, maxLength: 2000 }
            projectId:
              type: string
              format: uuid
              description: A project template; organization-wide without it.
    TaskTemplateResponse:
      type: object
      required: [id, organizationId, projectId, name, description, status, latestVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        latestVersion: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskTemplatePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateResponse' }
    EffectiveTaskTemplate:
      type: object
      required: [title, description, instructions, requirements, expectedOutcome, constraints, deliverables, context, agentId, inputs, acceptanceCriteria, review]
      description: What a task from this version gets, with what it extends merged in.
      properties:
        title: { type: string }
        description: { type: string }
        instructions: { type: string, deprecated: true, description: The same as `description`, its old name. }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/TaskItem' }
        expectedOutcome: { type: [string, 'null'] }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/TaskItem' }
        deliverables:
          type: array
          items: { $ref: '#/components/schemas/TaskDeliverable' }
        context:
          type: array
          items: { $ref: '#/components/schemas/TaskContextReference' }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
    TaskTemplateVersionResponse:
      type: object
      required: [templateId, version, content, effective, createdBy, createdAt]
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/TaskTemplateContent' }
        effective: { $ref: '#/components/schemas/EffectiveTaskTemplate' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    TaskTemplateVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateVersionResponse' }
    CreateTaskFromTemplateRequest:
      type: object
      additionalProperties: false
      required: [serviceAccountId]
      properties:
        version: { type: integer, minimum: 1, description: 'The latest if left out.' }
        inputs:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 10000 }
          description: Values for the template's inputs, by name.
        serviceAccountId: { type: string, format: uuid }
        parentTaskId: { type: string, format: uuid }
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: Added to the template's (never replacing them).
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review:
          $ref: '#/components/schemas/TaskReviewSettings'
          description: Added to the template's.
        repository:
          $ref: '#/components/schemas/TaskRepository'
          description: The repository the task works in, as for a task written by hand.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        requirements:
          type: array
          maxItems: 50
          description: Added to the template's.
          items: { $ref: '#/components/schemas/TaskItem' }
        constraints:
          type: array
          maxItems: 50
          description: Added to the template's.
          items: { $ref: '#/components/schemas/TaskItem' }
        deliverables:
          type: array
          maxItems: 20
          description: Added to the template's.
          items: { $ref: '#/components/schemas/TaskDeliverable' }
        context:
          type: array
          maxItems: 50
          description: Knowledge pinned on the task, added to the template's (as on a task written by hand).
          items: { $ref: '#/components/schemas/TaskContextReference' }
        untrustedInputs:
          type: array
          maxItems: 20
          description: As on a task written by hand; `inputs` values can name them as `{{name}}`.
          items: { $ref: '#/components/schemas/UntrustedInput' }
    TaskConcurrency:
      type: object
      additionalProperties: false
      required: [key, policy]
      description: |
        A concurrency key (docs/tasks.md, Concurrency): what to do with a new
        top-level task while an unfinished one with the same key exists in
        the project. `queue`: it waits until those have finished (the
        runner doesn't start it before); `cancel-previous`: they're
        cancelled; `skip`: it isn't created (`TASK_CONCURRENCY_SKIPPED`).
        Only on top-level tasks (`TASK_CONCURRENCY_INVALID`).
      properties:
        key: { type: string, minLength: 1, maxLength: 200 }
        policy: { type: string, enum: [queue, cancel-previous, skip] }
    TaskReviewSettings:
      type: object
      additionalProperties: false
      required: [artifactKinds]
      description: |
        Which of the task's artifacts need approval before they're final
        (docs/tasks.md, What needs approval). Pinned when the task is
        created; automations and Themis policy will add to it later.
      properties:
        artifactKinds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Artifact kinds that need approval; `*` for every kind. Empty for none.
          items: { type: string, minLength: 1, maxLength: 50 }
    TaskResponse:
      type: object
      required: [id, organizationId, projectId, parentTaskId, topLevelTaskId, title, description, instructions, requirements, expectedOutcome, constraints, deliverables, agentId, agentVersionId, serviceAccountId, requestedBy, status, failureReason, pausedFor, dependsOn, attempt, primaryArtifactId, review, reviewRound, acceptanceCriteria, repository, concurrency, inputFiles, context, untrustedInputs, taskTemplateId, taskTemplateVersion, origin, createdAt, updatedAt, finishedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        topLevelTaskId:
          type: string
          format: uuid
          description: The tree's root (its own ID for a top-level task).
        title: { type: string }
        description: { type: string, description: What needs to be done and why. }
        instructions: { type: string, deprecated: true, description: The same as `description`, its old name. }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/TaskItem' }
        expectedOutcome: { type: [string, 'null'] }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/TaskItem' }
        deliverables:
          type: array
          items: { $ref: '#/components/schemas/TaskDeliverable' }
        agentId: { type: string, format: uuid }
        agentVersionId:
          type: string
          format: uuid
          description: The agent version pinned when the task was created.
        serviceAccountId: { type: string, format: uuid }
        requestedBy: { type: string, description: The `sub` of whoever created the task. }
        status: { $ref: '#/components/schemas/TaskStatus' }
        pausedFor:
          description: While `paused`, the budget that ran out; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/BudgetScope'
            - type: 'null'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/TaskFailureReason'
            - { type: 'null' }
        dependsOn:
          type: array
          items: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: '1, plus one per retry.' }
        primaryArtifactId:
          type: [string, 'null']
          format: uuid
          description: The outcome of a succeeded task (docs/tasks.md, Primary artifact); null otherwise.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        reviewRound:
          type: integer
          minimum: 0
          description: How many times the task has waited for review (0 before the first).
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterion' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: The repository it works in (its own, or its parent's), if any.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        inputFiles:
          type: array
          description: Files the task starts from (Loculus), in `/workspace/inputs` of its sandbox.
          items: { $ref: '#/components/schemas/TaskInputFile' }
        context:
          type: array
          description: The project knowledge pinned on it, at the versions it got.
          items: { $ref: '#/components/schemas/PinnedTaskContext' }
        untrustedInputs:
          type: array
          description: The text from outside it carries; its text fields here have the values filled in.
          items: { $ref: '#/components/schemas/UntrustedInput' }
        taskTemplateId:
          type: [string, 'null']
          format: uuid
          description: The template it was created from, if any.
        taskTemplateVersion:
          type: [integer, 'null']
          minimum: 1
          description: Pinned when it was created, like the agent version.
        origin:
          oneOf:
            - $ref: '#/components/schemas/TaskOrigin'
            - type: 'null'
          description: Where it came from, when not from a request (a council's plan).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1, description: The `aggregateVersion` of its latest event. }
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskResponse' }
    ArtifactStatus:
      type: string
      enum: [pending, draft, final, rejected, changes_requested, partial]
      description: |
        `pending`: recorded while its execution runs; becomes `final` when
        the task succeeds, `partial` when the execution fails. `draft`,
        `rejected` and `changes_requested` come with reviews.
    ArtifactBase:
      type: object
      required: [id, organizationId, projectId, taskId, executionId, agentVersionId, kind, status, primary, revisionOf, deliverableKey, title, metadata, review, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        agentVersionId: { type: string, format: uuid }
        kind: { type: string }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        primary: { type: boolean }
        revisionOf: { type: [string, 'null'], format: uuid }
        deliverableKey:
          type: [string, 'null']
          description: The task's deliverable it was submitted for, if any.
        title: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        review:
          description: The decision on a draft; null until someone made one.
          oneOf:
            - { $ref: '#/components/schemas/ArtifactReview' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TextArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, format, content]
          properties:
            kind: { type: string, const: text }
            format: { type: string, enum: [markdown, plain] }
            content: { type: string }
    JsonArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, schema, content]
          properties:
            kind: { type: string, const: json }
            schema:
              type: [string, 'null']
              description: An optional identifier of the content's schema.
            content: {}
    VerificationArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, round, results]
          properties:
            kind: { type: string, const: verification }
            round: { type: integer, minimum: 1, description: 'Within its execution: 1, plus one per run after failed checks.' }
            results:
              type: array
              items: { $ref: '#/components/schemas/CriterionResult' }
    PullRequestArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, linkId, repository, branch, baseBranch, headSha, description, pullRequest]
          description: |
            The task's commits, pushed to its tree's branch, as a pull
            request to be (docs/git.md, Branches and pull requests): the
            branch at `headSha` with its title (the artifact's) and
            description. Delivery opens the pull request (or updates the
            tree's open one); a revision is a new artifact at a newer head.
          properties:
            kind: { type: string, const: pull_request }
            linkId: { type: string, format: uuid, description: The repository link (Proxenos). }
            repository: { type: string, description: '`owner/name`.' }
            branch: { type: string, description: '`aether/<top-level task ID>`.' }
            baseBranch: { type: string, description: What the pull request goes into (the default branch). }
            headSha: { type: string, description: The branch's head when it was pushed. }
            description: { type: string, description: The pull request's body (Markdown). }
            pullRequest:
              description: The pull request on GitHub, once delivered; null before.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [number, url, state]
                  properties:
                    number: { type: integer, minimum: 1 }
                    url: { type: string, format: uri }
                    state: { type: string, enum: [open, merged, closed] }
                - { type: 'null' }
    FileArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, fileId, fileName, contentType, sizeBytes, sha256]
          description: |
            A file the agent produced in its sandbox, kept in Loculus
            (docs/files.md): the file's ID there (in the artifact's
            project), never a URL. Download it with Loculus's
            `GET …/projects/{projectId}/files/{fileId}/download`.
          properties:
            kind: { type: string, const: file }
            fileId: { type: string, format: uuid, description: The file in Loculus. }
            fileName: { type: string }
            contentType: { type: string }
            sizeBytes: { type: integer, minimum: 0 }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CriterionResult:
      type: object
      additionalProperties: false
      required: [key, outcome, output]
      properties:
        key: { type: string }
        outcome: { type: string, enum: [passed, failed, manual] }
        output: { type: string, description: 'What the check said: a command''s output (its last 16 KiB), or why it failed.' }
    ArtifactResponse:
      description: One artifact; `kind` says which (an open set).
      oneOf:
        - $ref: '#/components/schemas/TextArtifact'
        - $ref: '#/components/schemas/JsonArtifact'
        - $ref: '#/components/schemas/VerificationArtifact'
        - $ref: '#/components/schemas/PullRequestArtifact'
        - $ref: '#/components/schemas/FileArtifact'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextArtifact'
          json: '#/components/schemas/JsonArtifact'
          verification: '#/components/schemas/VerificationArtifact'
          pull_request: '#/components/schemas/PullRequestArtifact'
          file: '#/components/schemas/FileArtifact'
    ArtifactReview:
      type: object
      additionalProperties: false
      required: [decision, comments, decidedBy, decidedAt]
      properties:
        decision: { type: string, enum: [approved, rejected, changes_requested] }
        comments:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }
        decidedBy: { type: string, description: The reviewer's `sub`. }
        decidedAt: { type: string, format: date-time }
    ReviewComment:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        anchor:
          type: string
          maxLength: 500
          description: Where in the artifact it points (a line, a JSON pointer, a heading); free-form.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }
    RequestChangesRequest:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReviewComment' }
    ArtifactPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtifactResponse' }
    ExecutionEventType:
      type: string
      description: |
        `log`: a step of the runner (the sandbox, the repository, input
        files, verification, pushing commits, how it ended);
        `model_call`: one call to the model (its tokens, what it said);
        `tool_call`: one tool the agent called (its input and output).
      enum: [log, model_call, tool_call]
    ExecutionEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, level, message, toolName, input, output, text, inputTokens, outputTokens, createdAt]
      properties:
        sequence: { type: integer, minimum: 1, description: Its place within the execution. }
        type: { $ref: '#/components/schemas/ExecutionEventType' }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string, description: One line about it. }
        toolName: { type: [string, 'null'], description: For a tool call. }
        input:
          type: [string, 'null']
          description: For a tool call, its input as JSON (shortened, redacted).
        output:
          type: [string, 'null']
          description: For a tool call, what it returned (shortened, redacted).
        text:
          type: [string, 'null']
          description: For a model call, the text it produced (shortened, redacted).
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        createdAt: { type: string, format: date-time }
    ExecutionEventPage:
      type: object
      additionalProperties: false
      required: [items, nextAfter, executionStatus]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExecutionEvent' }
        nextAfter:
          type: integer
          minimum: 0
          description: Pass as `after` for what comes next (the last sequence returned, or `after` itself).
        executionStatus: { $ref: '#/components/schemas/ExecutionStatus' }
    ExecutionStatus:
      type: string
      description: '`paused`: a budget ran out (docs/models.md); the task resumes in a new execution.'
      enum: [provisioning, running, completed, failed, cancelled, paused]
    ExecutionFailureReason:
      type: string
      enum: [agent_failed, timeout, infrastructure, access_denied, interrupted, verification_failed]
      description: |
        `infrastructure` (a crash, a missed heartbeat, a provisioning timeout,
        an unreachable dependency) is retried automatically, up to a limit;
        `interrupted` (Hephaestus shut down) is retried without counting
        against it. The others fail the task.
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, taskId, attempt, number, status, failureReason, error, summary, usage, repository, sandbox, traceId, startedAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: The task's attempt it belongs to. }
        number: { type: integer, minimum: 1, description: '1, 2, … within the task.' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        failureReason:
          oneOf:
            - { $ref: '#/components/schemas/ExecutionFailureReason' }
            - { type: 'null' }
        error:
          type: [string, 'null']
          description: What went wrong, for people; never contains secrets.
        summary:
          type: [string, 'null']
          description: What the agent reported when it finished (until artifacts exist).
        usage: { $ref: '#/components/schemas/ExecutionUsage' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/ExecutionRepository'
            - { type: 'null' }
        sandbox:
          oneOf:
            - $ref: '#/components/schemas/ExecutionSandbox'
            - { type: 'null' }
        traceId:
          description: |
            The execution's trace (OpenTelemetry, 32 hex characters): its
            agent run, model and tool calls, in Jaeger and Langfuse. Null
            when Hephaestus wasn't tracing (no `OTEL_EXPORTER_OTLP_ENDPOINT`).
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionSandbox:
      type: object
      additionalProperties: false
      description: |
        The sandbox the execution ran in (its workspace), and what it could
        reach: none for a version without `runtime.sandboxRequired`. Seen
        with `task:read`, unlike the workspace itself.
      required: [workspaceId, networkAccess, allowedHosts, blockedHosts]
      properties:
        workspaceId: { type: string, format: uuid }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it could reach (the platform's and the agent version's); empty otherwise.
          type: array
          items: { type: string }
        blockedHosts:
          description: |
            Hosts it tried to reach and its proxy refused, recorded when the
            sandbox is destroyed (so empty while it runs). Candidates for
            the agent version's `allowedHosts`.
          type: array
          items: { type: string }
    ExecutionRepository:
      type: object
      additionalProperties: false
      description: |
        The repository the execution worked in (`docs/git.md`, Inside the
        sandbox): checked out at `branch` from `baseSha`, and, once the run
        succeeded, what the agent committed on top (taken out of the sandbox
        as a bundle) and the branch's head once they were pushed (rebased
        onto whatever the branch had by then). Null until then.
      required: [linkId, fullName, branch, baseSha, headSha, commits, uncommittedChanges, pushedSha]
      properties:
        linkId: { type: string, format: uuid }
        fullName: { type: string, description: '`owner/name`.' }
        branch: { type: string, description: 'The task tree''s branch, `aether/<top-level task ID>`.' }
        baseSha: { type: string, description: The commit the execution started from. }
        headSha: { type: [string, 'null'], description: The last commit at the end (the base if nothing was committed). }
        commits: { type: [integer, 'null'], minimum: 0, description: Commits on top of the base. }
        uncommittedChanges:
          type: [boolean, 'null']
          description: Changes left uncommitted in the sandbox; they're not kept.
        pushedSha:
          type: [string, 'null']
          description: The branch's head after the push (differs from `headSha` when the commits were rebased); null when nothing was pushed.
    ExecutionUsage:
      type: object
      additionalProperties: false
      description: |
        The model calls the execution made through the model gateway, and
        their tokens (docs/models.md, Metering). Tokens a provider didn't
        report count as 0.
      required: [modelCalls, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd]
      properties:
        modelCalls: { type: integer, minimum: 0 }
        inputTokens:
          type: integer
          minimum: 0
          description: Every input token, cache reads and writes included.
        outputTokens: { type: integer, minimum: 0 }
        cacheReadTokens: { type: integer, minimum: 0 }
        cacheWriteTokens: { type: integer, minimum: 0 }
        costUsd:
          description: |
            The calls' cost at the prices in force when they were made;
            null when none of them had a price (a model outside the
            catalogue).
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExecutionResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- usage and budgets (Pylon's; docs/pylon.md) ----------
    Usd:
      type: string
      description: US dollars as a decimal string, at most 6 decimals (`../docs/api.md`).
      pattern: '^\d{1,9}(\.\d{1,6})?$'
    # ---------- budgets ----------
    BudgetScope:
      type: string
      description: |
        What a budget limits (docs/models.md, Budgets): an organization's,
        a project's or an agent's model calls per calendar month (UTC), or a
        task tree's over its whole life.
      enum: [organization, project, agent, task_tree]
    SetBudgetRequest:
      type: object
      additionalProperties: false
      required: [limitUsd]
      properties:
        limitUsd:
          description: The limit; null for none.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    BudgetResponse:
      type: object
      required: [scope, scopeId, limitUsd, spentUsd, windowStart, thresholdPercent, updatedAt]
      properties:
        scope: { $ref: '#/components/schemas/BudgetScope' }
        scopeId:
          type: string
          format: uuid
          description: The organization, project, agent or top-level task.
        limitUsd:
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        spentUsd:
          description: What the scope's model calls cost in the window (this month; a task tree's whole life).
          $ref: '#/components/schemas/Usd'
        windowStart:
          type: [string, 'null']
          format: date-time
          description: The start of this month (UTC); null for a task tree.
        thresholdPercent:
          type: integer
          description: At this share of the limit, `budget.threshold-reached` is published (once per window).
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: When the limit was last set; null if it never was.

    # ---------- tool servers ----------
    ToolServerName:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,29}$'
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.-]+$'
    ToolServerAuthType:
      type: string
      description: |
        How Hephaestus authenticates to the server: `none`; `header`, sending
        the credential in `headerName`; or `task-token`, sending the running
        task's own Pistis token as a bearer token (only to servers whose
        origin the platform trusts, `TOOL_SERVER_TRUSTED_ORIGINS`: Aether-os's
        own, such as Seshat).
      enum: [none, header, task-token]
    ToolServerAuth:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/ToolServerAuthType' }
        headerName:
          description: For `header`; `Authorization` when left out.
          type: string
          pattern: '^[A-Za-z0-9-]{1,64}$'
    ToolServerUrl:
      type: string
      format: uri
      maxLength: 2000
      description: The MCP endpoint (Streamable HTTP); `https://`, or `http://` only where Hephaestus may reach private addresses (local development).
      pattern: '^https?://'
    CreateToolServerRequest:
      type: object
      additionalProperties: false
      required: [name, url, auth]
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    UpdateToolServerRequest:
      type: object
      additionalProperties: false
      required: [description, url, auth]
      properties:
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    SetToolServerCredentialRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 8, maxLength: 4096 }
    ToolServerCredential:
      type: object
      additionalProperties: false
      required: [hint, updatedBy, updatedAt]
      properties:
        hint: { type: string, description: 'The last four characters, e.g. `…ab12`.' }
        updatedBy: { type: string }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerResponse:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, description, url, auth, credential, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string }
        url: { type: string }
        auth:
          type: object
          additionalProperties: false
          required: [type, headerName]
          properties:
            type: { $ref: '#/components/schemas/ToolServerAuthType' }
            headerName:
              type: [string, 'null']
        credential:
          description: That a `header` credential is set; null when none is.
          oneOf:
            - { $ref: '#/components/schemas/ToolServerCredential' }
            - { type: 'null' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolServerResponse' }
    ToolDescription:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    ToolList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolDescription' }

    # ---------- sessions (../docs/interaction.md) ----------
    SessionStatus:
      type: string
      enum: [active, ended]
    SessionMode:
      type: string
      enum: [direct, facilitated, discussion, planning, delegation]
      description: 'How a council works in a session: `direct` (the person addresses members), `facilitated` (the facilitator answers, asks members, holds rounds), `discussion` (deliberation rounds on the person''s questions), `planning` and `delegation` (plans and the tasks they become).'
    SetSessionModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/SessionMode' }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `agentId` and `councilId`.
      properties:
        agentId: { type: string, format: uuid }
        councilId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
    SessionMember:
      type: object
      required: [agentId, agentVersionId, name, participation, role, when, invited]
      properties:
        agentId: { type: string, format: uuid }
        agentVersionId: { type: string, format: uuid, description: Pinned when the session started. }
        name: { type: string }
        participation: { type: string, enum: [required, conditional, optional] }
        role: { type: [string, 'null'] }
        when: { type: [string, 'null'], description: A conditional member's condition. }
        invited:
          type: boolean
          description: Taking part in the conversation (required members always are; others once invited or addressed).
    SessionMessageAuthor:
      type: object
      required: [kind, agentId, agentVersionId]
      properties:
        kind:
          type: string
          enum: [user, agent, facilitator, member]
          description: '`user`: the person; `agent`: an agent session''s agent; `facilitator` and `member`: a council''s.'
        agentId: { type: [string, 'null'], format: uuid }
        agentVersionId: { type: [string, 'null'], format: uuid }
    SessionResponse:
      type: object
      required: [id, organizationId, projectId, agentId, agentVersionId, councilId, councilVersionId, members, mode, startedBy, title, status, endedReason, running, lastActivityAt, createdAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        agentId: { type: string, format: uuid, description: The agent; in a council session the facilitator. }
        agentVersionId: { type: string, format: uuid, description: Pinned when it started. }
        councilId: { type: [string, 'null'], format: uuid }
        councilVersionId: { type: [string, 'null'], format: uuid, description: Pinned when it started. }
        members:
          type: array
          description: A council session's members; empty otherwise.
          items: { $ref: '#/components/schemas/SessionMember' }
        mode:
          oneOf:
            - $ref: '#/components/schemas/SessionMode'
            - type: 'null'
          description: A council session's current way of working (docs/councils.md, Collaboration modes); null in an agent session.
        startedBy: { type: string, description: 'The person''s `sub`.' }
        title: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SessionStatus' }
        endedReason:
          type: [string, 'null']
          enum: [closed, idle, null]
          description: '`closed`: the person ended it; `idle`: no run for `SESSION_IDLE_TIMEOUT_MS`.'
        running: { type: boolean, description: A run is under way. }
        lastActivityAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt:
          type: [string, 'null']
          format: date-time
    SessionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SessionResponse' }
    SessionToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: string, description: The arguments as JSON text. }
    SessionMessage:
      type: object
      required: [id, role, author, content, toolCalls, toolCallId, roundId, createdAt]
      properties:
        id: { type: string, description: The message's AG-UI ID. }
        role: { type: string, enum: [user, assistant, tool] }
        author: { $ref: '#/components/schemas/SessionMessageAuthor' }
        content: { type: string }
        toolCalls:
          type: array
          items: { $ref: '#/components/schemas/SessionToolCall' }
        toolCallId:
          type: [string, 'null']
          description: A tool message's call; a member's answer, the facilitator's `ask_member` call it answers.
        roundId:
          type: [string, 'null']
          format: uuid
          description: The deliberation round a member's answer belongs to.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    TaskOrigin:
      type: object
      description: A task made from a council's plan (docs/councils.md, Planning and delegation).
      required: [kind, sessionId, planId, entryKey, outcomeEntryKey, assignedBy, reason]
      properties:
        kind: { type: string, enum: [council-plan] }
        sessionId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        entryKey:
          type: [string, 'null']
          description: The plan's entry; null for the plan task itself.
        outcomeEntryKey:
          type: [string, 'null']
          description: The plan task's outcome entry, whose primary artifact becomes the plan task's when all succeed; null for an entry.
        assignedBy:
          type: [string, 'null']
          description: 'Who chose its agent: `facilitator`, or the `sub` of the person who changed it; null for the plan task.'
        reason: { type: [string, 'null'], description: Why that agent. }
    CouncilPlanMilestone:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        dependsOn:
          type: array
          maxItems: 10
          items: { type: string }
    CouncilPlanEntry:
      type: object
      additionalProperties: false
      required: [key, title, description, agentId]
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000, description: What to do and why. }
        expectedOutcome: { type: string, maxLength: 5000 }
        agentId: { type: string, format: uuid, description: The member to do it. }
        dependsOn:
          type: array
          maxItems: 20
          items: { type: string }
        milestoneKey: { type: string }
        reason: { type: string, maxLength: 1000, description: Why this member. }
    CouncilPlan:
      type: object
      required: [id, sessionId, number, status, title, summary, milestones, entries, outcomeEntryKey, review, taskId, proposedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        status: { type: string, enum: [proposed, approved, rejected, changes_requested, superseded] }
        title: { type: string }
        summary: { type: string }
        milestones:
          type: array
          items: { $ref: '#/components/schemas/CouncilPlanMilestone' }
        entries:
          type: array
          description: With their agents as approved (assignments applied).
          items: { $ref: '#/components/schemas/CouncilPlanEntry' }
        outcomeEntryKey: { type: string }
        review:
          oneOf:
            - type: object
              required: [decision, comment, decidedBy, decidedAt]
              properties:
                decision: { type: string, enum: [approved, rejected, changes_requested] }
                comment: { type: [string, 'null'] }
                decidedBy: { type: string }
                decidedAt: { type: string, format: date-time }
            - type: 'null'
        taskId:
          type: [string, 'null']
          format: uuid
          description: The plan task an approved plan became (with `allowDelegation`).
        proposedAt: { type: string, format: date-time }
    CouncilPlanPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CouncilPlan' }
    ApproveCouncilPlanRequest:
      type: object
      additionalProperties: false
      required: [serviceAccountId]
      properties:
        serviceAccountId: { type: string, format: uuid, description: 'The service account its tasks run as (a role in the project).' }
        assignments:
          type: array
          maxItems: 20
          description: Entries given to another member.
          items:
            type: object
            additionalProperties: false
            required: [entryKey, agentId]
            properties:
              entryKey: { type: string }
              agentId: { type: string, format: uuid }
    RejectCouncilPlanRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 4000 }
    RequestCouncilPlanChangesRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 4000 }
    DeliberationRound:
      type: object
      description: One round of a council's discussion (docs/councils.md, Deliberation rounds), opened and concluded by the facilitator.
      required: [id, sessionId, number, question, participants, status, conclusion, openedAt, concludedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        number: { type: integer, minimum: 1, description: 'Within the session: 1, 2, …' }
        question: { type: string }
        participants:
          type: array
          description: The members who answered, in the order they answered (agent IDs).
          items: { type: string, format: uuid }
        status: { type: string, enum: [open, concluded] }
        conclusion:
          type: [string, 'null']
          description: The facilitator's conclusion; null while open, and for a round closed by the next one without a conclusion.
        openedAt: { $ref: '#/components/schemas/Timestamp' }
        concludedAt: { type: [string, 'null'], format: date-time }
    DeliberationRoundPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DeliberationRound' }
    SessionMessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SessionMessage' }
    RunAgentInput:
      type: object
      description: AG-UI's `RunAgentInput`.
      required: [threadId, runId, messages]
      properties:
        threadId: { type: string, description: The session's ID. }
        runId: { type: string, minLength: 1, maxLength: 200 }
        messages:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/AguiMessage' }
        tools:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AguiTool' }
        context:
          type: array
          maxItems: 50
          items:
            type: object
            required: [description, value]
            properties:
              description: { type: string, maxLength: 1000 }
              value: { type: string, maxLength: 20000 }
        state: { description: "The frontend's shared state (AG-UI): given to the agent as context for this run." }
        forwardedProps:
          type: object
          description: 'In a council session, `memberAgentId` addresses that member directly; anything else is ignored.'
          properties:
            memberAgentId: { type: string, format: uuid }
    AguiMessage:
      type: object
      required: [id, role]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [user, assistant, system, developer, tool] }
        content: { type: string, maxLength: 100000 }
        name: { type: string }
        toolCallId: { type: string, maxLength: 200 }
        toolCalls:
          type: array
          items:
            type: object
            required: [id, type, function]
            properties:
              id: { type: string }
              type: { type: string, enum: [function] }
              function:
                type: object
                required: [name, arguments]
                properties:
                  name: { type: string }
                  arguments: { type: string }
    AguiTool:
      type: object
      required: [name, description, parameters]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        description: { type: string, maxLength: 2000 }
        parameters: { type: object, description: The tool's input as JSON Schema. }
