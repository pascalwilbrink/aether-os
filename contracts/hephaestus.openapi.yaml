          description: By provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelKeyList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/agents/{agentId}/model-keys/{provider}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Provider'
    put:
      tags: [model-keys]
      operationId: setAgentModelKey
      x-permission: '`org:secret:write`'
      description: Stores (or replaces) the agent's own key for the provider, in OpenBao.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetModelKeyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Stored in OpenBao; never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelKeyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [model-keys]
      operationId: deleteAgentModelKey
      x-permission: '`org:secret:write`'
      description: Removes the agent's own key; it uses the organization's again.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [tool-servers]
      operationId: listToolServers
      x-permission: '`agent:read`'
      description: The organization's tool servers, by name (at most 50).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [tool-servers]
      operationId: createToolServer
      x-permission: '`org:manage`'
      description: |
        Registers an MCP server (Streamable HTTP) that the organization's agent
        versions can take tools from (`tools[].name` is its `name`).
        Hephaestus connects to it, never the sandbox. A `header` credential is
        set separately (`PUT …/credential`) and kept in OpenBao.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: getToolServer
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tool-servers]
      operationId: updateToolServer
      x-permission: '`org:manage`'
      description: |
        Replaces its description, URL and authentication (the name stays: agent
        versions refer to it). Changing the URL or the authentication removes
        the credential, so it isn't sent somewhere new without being set again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateToolServerRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServer
      x-permission: '`org:manage`'
      description: |
        Removes it and its credential. Tasks of agent versions that use it
        then fail without retrying until a server with its name exists again.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/credential:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    put:
      tags: [tool-servers]
      operationId: setToolServerCredential
      x-permission: '`org:secret:write`'
      description: |
        Sets the value sent in the server's `auth.headerName` header (for
        `Authorization`, include the scheme: `Bearer …`). Kept in OpenBao and
        never returned; only its last four characters are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetToolServerCredentialRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [tool-servers]
      operationId: deleteToolServerCredential
      x-permission: '`org:secret:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Removed (also when there was none) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/tool-servers/{toolServerId}/tools:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ToolServerId'
    get:
      tags: [tool-servers]
      operationId: listToolServerTools
      x-permission: '`agent:read`'
      description: |
        Connects to the server and lists the tools it offers now, to choose
        from for an agent version. A `task-token` server is sent the caller's
        own token.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503':
          description: The tool server couldn't be reached or refused the request (`UNAVAILABLE`); `detail` says what it answered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/organizations/{organizationId}/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [skills]
      operationId: listSkills
      x-permission: '`agent:read`'
      description: The organization's skills, by name, without their files.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SkillStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [skills]
      operationId: createSkill
      x-permission: '`agent:write`'
      description: |
        Creates a skill with its first version: a folder of text files in the
        Agent Skills format, with `SKILL.md` at its root (YAML front matter
        with `name`, the skill's name, and `description`, then the
        instructions). Agent versions pin a version of it (`skills[]`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSkillRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [skills]
      operationId: getSkill
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/skills/{skillId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    post:
      tags: [skills]
      operationId: archiveSkill
      x-permission: '`agent:write`'
      description: |
        Archives it (idempotent): new agent versions can't choose it, and it
        gets no new versions. Agent versions that already pin one of its
        versions keep running with it.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [skills]
      operationId: listSkillVersions
      x-permission: '`agent:read`'
      description: Newest first, without their files.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [skills]
      operationId: createSkillVersion
      x-permission: '`agent:write`'
      description: |
        A new version (versions never change): the whole folder again, its
        `SKILL.md` naming the same skill. Numbered by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSkillVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [skills]
      operationId: getSkillVersion
      x-permission: '`agent:read`'
      description: The version with its files.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/ollama/models:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [model-keys]
      operationId: listOllamaModels
      x-permission: '`agent:read`'
      description: |
        The models the organization's Ollama server has now (its `/api/tags`),
        to choose from for an agent version: asked of the server with the
        organization's settings. `409 MODEL_KEY_INVALID` when the
        organization has no Ollama server set; `503` when it doesn't answer.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OllamaModelList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModelProvider' }
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolServerId:
      name: toolServerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }
    WorkspaceTransition:
      description: Transition applied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceResponse' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_NOT_PUBLISHED
        - AGENT_VERSION_CONFLICT
        - AGENT_VERSION_INVALID_TRANSITION
        - ARTIFACT_NOT_DRAFT
        - TASK_BUDGET_INVALID
        - TASK_CONCURRENCY_INVALID
        - TASK_CONCURRENCY_SKIPPED
        - MODEL_ALREADY_EXISTS
        - MODEL_NOT_AVAILABLE
        - MODEL_PRICE_INVALID
        - ORGANIZATION_SUSPENDED
        - PROJECT_ARCHIVED
        - TASK_CRITERIA_INVALID
        - TASK_DEPENDENCY_INVALID
        - TASK_INVALID_TRANSITION
        - TASK_PARENT_FINISHED
        - TASK_REVIEW_ROUNDS_EXHAUSTED
        - TASK_TEMPLATE_ARCHIVED
        - TASK_TEMPLATE_INPUTS_INVALID
        - TASK_TEMPLATE_INVALID
        - TOOL_SERVER_ALREADY_EXISTS
        - TOOL_SERVER_INVALID
        - MODEL_KEY_INVALID
        - SKILL_ALREADY_EXISTS
        - SKILL_ARCHIVED
        - SKILL_INVALID
        - WORKSPACE_INVALID_EXPIRY
        - WORKSPACE_INVALID_TRANSITION
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time

    # ---------- agents ----------
    AgentStatus:
      type: string
      enum: [active, archived]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AgentResponse:
      type: object
      required: [id, organizationId, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentResponse' }

    # ---------- agent versions ----------
    AgentVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      description: |
        Tools from one of the organization's tool servers (MCP): the agent
        gets them as `<name>_<tool>`. An enabled entry must name an existing
        tool server when the version is created.
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        enabled: { type: boolean }
        tools:
          description: Which of the server's tools, by name; all of them when left out.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ToolName' }
    AgentSkillConfiguration:
      type: object
      additionalProperties: false
      required: [name, version, enabled]
      description: |
        A version of one of the organization's skills (`/skills`), pinned:
        `version` is its number (`"3"`). An enabled entry must name an
        active skill and one of its versions when the agent version is
        created (`SKILL_INVALID` otherwise).
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        enabled: { type: boolean }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
        networkAccess:
          description: |
            The sandbox's network (../CLAUDE.md, sandboxes): `none` (the
            default) or `restricted`, where it reaches only allowed hosts
            through an allowlisting proxy: the platform's (package
            registries, `SANDBOX_ALLOWED_HOSTS`) and `allowedHosts`.
          type: string
          enum: [none, restricted]
        allowedHosts:
          description: Hosts a `restricted` sandbox may reach on ports 80 and 443, besides the platform's; `*.example.com` for its subdomains.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/HostPattern' }
    HostPattern:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    CreateAgentVersionRequest:
      type: object
      additionalProperties: false
      required: [instructions, model, capabilities, tools, skills, runtime]
      properties:
        instructions: { type: string, minLength: 1 }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
    AgentVersionResponse:
      type: object
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AgentVersionStatus' }
        instructions: { type: string }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    AgentVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentVersionResponse' }

    # ---------- workspaces ----------
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, in_use, suspended, stopping, destroyed, failed, expired]
    RepositoryProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    RepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [provider, repositoryUrl, branch]
      properties:
        provider: { $ref: '#/components/schemas/RepositoryProvider' }
        repositoryUrl:
          type: string
          format: uri
          pattern: '^https://'
        branch: { type: string, minLength: 1 }
        commitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    NetworkAccess:
      type: string
      enum: [none, restricted, full]
    SandboxConfiguration:
      type: object
      additionalProperties: false
      required: [provider, image, cpuLimit, memoryLimitMb, networkAccess]
      properties:
        provider: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        cpuLimit: { type: number, exclusiveMinimum: 0 }
        memoryLimitMb: { type: integer, minimum: 1 }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it may reach.
          type: array
          items: { $ref: '#/components/schemas/HostPattern' }
    SandboxReference:
      type: object
      required: [provider, resourceId]
      properties:
        provider: { type: string }
        resourceId: { type: string }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [projectId, executionId, sandbox, workingDirectory, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        repository:
          description: The repository to check out; none for a sandbox without one.
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        workingDirectory:
          type: string
          pattern: '^/'
          description: Absolute path inside the sandbox.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future.
    WorkspaceResponse:
      type: object
      required: [id, organizationId, projectId, executionId, status, repository, sandbox, sandboxReference, workingDirectory, blockedHosts, failureReason, expiresAt, createdAt, updatedAt, startedAt, destroyedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        repository:
          oneOf:
            - { $ref: '#/components/schemas/RepositoryConfiguration' }
            - { type: 'null' }
        sandbox: { $ref: '#/components/schemas/SandboxConfiguration' }
        sandboxReference:
          oneOf:
            - $ref: '#/components/schemas/SandboxReference'
            - type: 'null'
        workingDirectory: { type: string }
        blockedHosts:
          description: Hosts the sandbox tried to reach and its proxy refused (`restricted` access), recorded when it's destroyed.
          type: array
          items: { type: string }
        failureReason: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          type: [string, 'null']
          format: date-time
        destroyedAt:
          type: [string, 'null']
          format: date-time
    WorkspacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceResponse' }

    # ---------- tasks ----------
    TaskStatus:
      type: string
      enum: [blocked, queued, provisioning, running, verifying, awaiting_review, waiting, paused, delivering, succeeded, failed, cancelled]
      description: The lifecycle in `docs/tasks.md` (Task lifecycle).
    TaskFailureReason:
      type: string
      enum: [agent_failed, verification_failed, rejected, timeout, budget_exceeded, infrastructure, subtask_failed, access_denied]
      description: |
        Why a task failed. `access_denied`: Pistis refused a task token for
        its service account (no role in the project, disabled, or not a
        member of the organization).
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, instructions, agentId, serviceAccountId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, minLength: 1, maxLength: 100000 }
        agentId:
          type: string
          format: uuid
          description: Its published version is pinned when the task is created.
        serviceAccountId:
          type: string
          format: uuid
          description: The Pistis service account the task runs as.
        parentTaskId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: Makes this a subtask (in the same project).
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Tasks under the same top-level task that must succeed first.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: The definition of done (docs/tasks.md); checked after every run. Keys are unique.
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: |
            The repository the task works in: one of its project's links in
            Proxenos (`docs/git.md`). A subtask without one works in its
            parent's (the tree shares a branch).
        budgetUsd:
          description: |
            A limit for the whole task tree's model calls (docs/models.md,
            Budgets); only on a top-level task (`TASK_BUDGET_INVALID`).
            Raise it later with `PUT …/tasks/{taskId}/budget`.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
    TaskRepository:
      type: object
      additionalProperties: false
      required: [linkId]
      properties:
        linkId:
          type: string
          format: uuid
          description: A repository link of the task's project (Proxenos). Checked when the task runs.
    AcceptanceCriterionRequest:
      type: object
      additionalProperties: false
      required: [key, description, check]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        check: { $ref: '#/components/schemas/CriterionCheck' }
    AcceptanceCriterion:
      allOf:
        - $ref: '#/components/schemas/AcceptanceCriterionRequest'
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [template, task]
              description: Where it came from (spec requirements later).
    CriterionCheck:
      description: How a criterion is checked; by Hephaestus, never by the agent's word.
      oneOf:
        - $ref: '#/components/schemas/CommandCheck'
        - $ref: '#/components/schemas/ArtifactCheck'
        - $ref: '#/components/schemas/ManualCheck'
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandCheck'
          artifact: '#/components/schemas/ArtifactCheck'
          manual: '#/components/schemas/ManualCheck'
    CommandCheck:
      type: object
      additionalProperties: false
      required: [type, command]
      description: Run in the task's sandbox (the agent version must need one); exit code 0 passes.
      properties:
        type: { type: string, const: command }
        command: { type: string, minLength: 1, maxLength: 4000 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900, description: '300 if left out.' }
    ArtifactCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: A structural check on the run's artifacts; every given condition must hold.
      properties:
        type: { type: string, const: artifact }
        primaryKind: { type: string, minLength: 1, description: The primary artifact's kind. }
        titles:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
          description: Artifacts with these titles exist.
    ManualCheck:
      type: object
      additionalProperties: false
      required: [type]
      description: Left to the reviewer; approving the draft confirms it.
      properties:
        type: { type: string, const: manual }
    TemplateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,49}$'
          description: Referred to as `{{name}}` in the title and instructions.
        description: { type: string, maxLength: 1000 }
        required: { type: boolean, description: 'true if left out.' }
    TemplateExtends:
      type: object
      additionalProperties: false
      required: [templateId, version]
      description: An organization-wide template version this project template builds on.
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    TaskTemplateContent:
      type: object
      additionalProperties: false
      description: |
        One version of a template. A project template that `extends` an
        organization template inherits its agent, title, inputs, criteria
        and review settings, appends its own instructions to the
        organization's, and can only add inputs and criteria.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, minLength: 1, maxLength: 100000 }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        extends: { $ref: '#/components/schemas/TemplateExtends' }
    CreateTaskTemplateRequest:
      allOf:
        - $ref: '#/components/schemas/TaskTemplateContent'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            description: { type: string, maxLength: 2000 }
            projectId:
              type: string
              format: uuid
              description: A project template; organization-wide without it.
    TaskTemplateResponse:
      type: object
      required: [id, organizationId, projectId, name, description, status, latestVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        latestVersion: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskTemplatePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateResponse' }
    EffectiveTaskTemplate:
      type: object
      required: [title, instructions, agentId, inputs, acceptanceCriteria, review]
      description: What a task from this version gets, with what it extends merged in.
      properties:
        title: { type: string }
        instructions: { type: string }
        agentId: { type: string, format: uuid }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/TemplateInput' }
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
    TaskTemplateVersionResponse:
      type: object
      required: [templateId, version, content, effective, createdBy, createdAt]
      properties:
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/TaskTemplateContent' }
        effective: { $ref: '#/components/schemas/EffectiveTaskTemplate' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    TaskTemplateVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskTemplateVersionResponse' }
    CreateTaskFromTemplateRequest:
      type: object
      additionalProperties: false
      required: [serviceAccountId]
      properties:
        version: { type: integer, minimum: 1, description: 'The latest if left out.' }
        inputs:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 10000 }
          description: Values for the template's inputs, by name.
        serviceAccountId: { type: string, format: uuid }
        parentTaskId: { type: string, format: uuid }
        dependsOn:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        acceptanceCriteria:
          type: array
          maxItems: 50
          description: Added to the template's (never replacing them).
          items: { $ref: '#/components/schemas/AcceptanceCriterionRequest' }
        review:
          $ref: '#/components/schemas/TaskReviewSettings'
          description: Added to the template's.
        repository:
          $ref: '#/components/schemas/TaskRepository'
          description: The repository the task works in, as for a task written by hand.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
    TaskConcurrency:
      type: object
      additionalProperties: false
      required: [key, policy]
      description: |
        A concurrency key (docs/tasks.md, Concurrency): what to do with a new
        top-level task while an unfinished one with the same key exists in
        the project. `queue`: it waits until those have finished (the
        runner doesn't start it before); `cancel-previous`: they're
        cancelled; `skip`: it isn't created (`TASK_CONCURRENCY_SKIPPED`).
        Only on top-level tasks (`TASK_CONCURRENCY_INVALID`).
      properties:
        key: { type: string, minLength: 1, maxLength: 200 }
        policy: { type: string, enum: [queue, cancel-previous, skip] }
    TaskReviewSettings:
      type: object
      additionalProperties: false
      required: [artifactKinds]
      description: |
        Which of the task's artifacts need approval before they're final
        (docs/tasks.md, What needs approval). Pinned when the task is
        created; automations and Themis policy will add to it later.
      properties:
        artifactKinds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Artifact kinds that need approval; `*` for every kind. Empty for none.
          items: { type: string, minLength: 1, maxLength: 50 }
    TaskResponse:
      type: object
      required: [id, organizationId, projectId, parentTaskId, topLevelTaskId, title, instructions, agentId, agentVersionId, serviceAccountId, requestedBy, status, failureReason, pausedFor, dependsOn, attempt, primaryArtifactId, review, reviewRound, acceptanceCriteria, repository, concurrency, taskTemplateId, taskTemplateVersion, createdAt, updatedAt, finishedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        topLevelTaskId:
          type: string
          format: uuid
          description: The tree's root (its own ID for a top-level task).
        title: { type: string }
        instructions: { type: string }
        agentId: { type: string, format: uuid }
        agentVersionId:
          type: string
          format: uuid
          description: The agent version pinned when the task was created.
        serviceAccountId: { type: string, format: uuid }
        requestedBy: { type: string, description: The `sub` of whoever created the task. }
        status: { $ref: '#/components/schemas/TaskStatus' }
        pausedFor:
          description: While `paused`, the budget that ran out; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/BudgetScope'
            - type: 'null'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/TaskFailureReason'
            - { type: 'null' }
        dependsOn:
          type: array
          items: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: '1, plus one per retry.' }
        primaryArtifactId:
          type: [string, 'null']
          format: uuid
          description: The outcome of a succeeded task (docs/tasks.md, Primary artifact); null otherwise.
        review: { $ref: '#/components/schemas/TaskReviewSettings' }
        reviewRound:
          type: integer
          minimum: 0
          description: How many times the task has waited for review (0 before the first).
        acceptanceCriteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterion' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/TaskRepository'
            - { type: 'null' }
          description: The repository it works in (its own, or its parent's), if any.
        concurrency:
          oneOf:
            - $ref: '#/components/schemas/TaskConcurrency'
            - type: 'null'
        taskTemplateId:
          type: [string, 'null']
          format: uuid
          description: The template it was created from, if any.
        taskTemplateVersion:
          type: [integer, 'null']
          minimum: 1
          description: Pinned when it was created, like the agent version.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1, description: The `aggregateVersion` of its latest event. }
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskResponse' }
    ArtifactStatus:
      type: string
      enum: [pending, draft, final, rejected, changes_requested, partial]
      description: |
        `pending`: recorded while its execution runs; becomes `final` when
        the task succeeds, `partial` when the execution fails. `draft`,
        `rejected` and `changes_requested` come with reviews.
    ArtifactBase:
      type: object
      required: [id, organizationId, projectId, taskId, executionId, agentVersionId, kind, status, primary, revisionOf, title, metadata, review, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        agentVersionId: { type: string, format: uuid }
        kind: { type: string }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        primary: { type: boolean }
        revisionOf: { type: [string, 'null'], format: uuid }
        title: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        review:
          description: The decision on a draft; null until someone made one.
          oneOf:
            - { $ref: '#/components/schemas/ArtifactReview' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TextArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, format, content]
          properties:
            kind: { type: string, const: text }
            format: { type: string, enum: [markdown, plain] }
            content: { type: string }
    JsonArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, schema, content]
          properties:
            kind: { type: string, const: json }
            schema:
              type: [string, 'null']
              description: An optional identifier of the content's schema.
            content: {}
    VerificationArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, round, results]
          properties:
            kind: { type: string, const: verification }
            round: { type: integer, minimum: 1, description: 'Within its execution: 1, plus one per run after failed checks.' }
            results:
              type: array
              items: { $ref: '#/components/schemas/CriterionResult' }
    PullRequestArtifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactBase'
        - type: object
          required: [kind, linkId, repository, branch, baseBranch, headSha, description, pullRequest]
          description: |
            The task's commits, pushed to its tree's branch, as a pull
            request to be (docs/git.md, Branches and pull requests): the
            branch at `headSha` with its title (the artifact's) and
            description. Delivery opens the pull request (or updates the
            tree's open one); a revision is a new artifact at a newer head.
          properties:
            kind: { type: string, const: pull_request }
            linkId: { type: string, format: uuid, description: The repository link (Proxenos). }
            repository: { type: string, description: '`owner/name`.' }
            branch: { type: string, description: '`aether/<top-level task ID>`.' }
            baseBranch: { type: string, description: What the pull request goes into (the default branch). }
            headSha: { type: string, description: The branch's head when it was pushed. }
            description: { type: string, description: The pull request's body (Markdown). }
            pullRequest:
              description: The pull request on GitHub, once delivered; null before.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [number, url, state]
                  properties:
                    number: { type: integer, minimum: 1 }
                    url: { type: string, format: uri }
                    state: { type: string, enum: [open, merged, closed] }
                - { type: 'null' }
    CriterionResult:
      type: object
      additionalProperties: false
      required: [key, outcome, output]
      properties:
        key: { type: string }
        outcome: { type: string, enum: [passed, failed, manual] }
        output: { type: string, description: 'What the check said: a command''s output (its last 16 KiB), or why it failed.' }
    ArtifactResponse:
      description: One artifact; `kind` says which (an open set).
      oneOf:
        - $ref: '#/components/schemas/TextArtifact'
        - $ref: '#/components/schemas/JsonArtifact'
        - $ref: '#/components/schemas/VerificationArtifact'
        - $ref: '#/components/schemas/PullRequestArtifact'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextArtifact'
          json: '#/components/schemas/JsonArtifact'
          verification: '#/components/schemas/VerificationArtifact'
          pull_request: '#/components/schemas/PullRequestArtifact'
    ArtifactReview:
      type: object
      additionalProperties: false
      required: [decision, comments, decidedBy, decidedAt]
      properties:
        decision: { type: string, enum: [approved, rejected, changes_requested] }
        comments:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }
        decidedBy: { type: string, description: The reviewer's `sub`. }
        decidedAt: { type: string, format: date-time }
    ReviewComment:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        anchor:
          type: string
          maxLength: 500
          description: Where in the artifact it points (a line, a JSON pointer, a heading); free-form.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }
    RequestChangesRequest:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReviewComment' }
    ArtifactPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtifactResponse' }
    ExecutionStatus:
      type: string
      description: '`paused`: a budget ran out (docs/models.md); the task resumes in a new execution.'
      enum: [provisioning, running, completed, failed, cancelled, paused]
    ExecutionFailureReason:
      type: string
      enum: [agent_failed, timeout, infrastructure, access_denied, interrupted, verification_failed]
      description: |
        `infrastructure` (a crash, a missed heartbeat, a provisioning timeout,
        an unreachable dependency) is retried automatically, up to a limit;
        `interrupted` (Hephaestus shut down) is retried without counting
        against it. The others fail the task.
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, taskId, attempt, number, status, failureReason, error, summary, usage, repository, sandbox, startedAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: The task's attempt it belongs to. }
        number: { type: integer, minimum: 1, description: '1, 2, … within the task.' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        failureReason:
          oneOf:
            - { $ref: '#/components/schemas/ExecutionFailureReason' }
            - { type: 'null' }
        error:
          type: [string, 'null']
          description: What went wrong, for people; never contains secrets.
        summary:
          type: [string, 'null']
          description: What the agent reported when it finished (until artifacts exist).
        usage: { $ref: '#/components/schemas/ExecutionUsage' }
        repository:
          oneOf:
            - $ref: '#/components/schemas/ExecutionRepository'
            - { type: 'null' }
        sandbox:
          oneOf:
            - $ref: '#/components/schemas/ExecutionSandbox'
            - { type: 'null' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionSandbox:
      type: object
      additionalProperties: false
      description: |
        The sandbox the execution ran in (its workspace), and what it could
        reach: none for a version without `runtime.sandboxRequired`. Seen
        with `task:read`, unlike the workspace itself.
      required: [workspaceId, networkAccess, allowedHosts, blockedHosts]
      properties:
        workspaceId: { type: string, format: uuid }
        networkAccess: { $ref: '#/components/schemas/NetworkAccess' }
        allowedHosts:
          description: For `restricted` access, every host it could reach (the platform's and the agent version's); empty otherwise.
          type: array
          items: { type: string }
        blockedHosts:
          description: |
            Hosts it tried to reach and its proxy refused, recorded when the
            sandbox is destroyed (so empty while it runs). Candidates for
            the agent version's `allowedHosts`.
          type: array
          items: { type: string }
    ExecutionRepository:
      type: object
      additionalProperties: false
      description: |
        The repository the execution worked in (`docs/git.md`, Inside the
        sandbox): checked out at `branch` from `baseSha`, and, once the run
        succeeded, what the agent committed on top (taken out of the sandbox
        as a bundle) and the branch's head once they were pushed (rebased
        onto whatever the branch had by then). Null until then.
      required: [linkId, fullName, branch, baseSha, headSha, commits, uncommittedChanges, pushedSha]
      properties:
        linkId: { type: string, format: uuid }
        fullName: { type: string, description: '`owner/name`.' }
        branch: { type: string, description: 'The task tree''s branch, `aether/<top-level task ID>`.' }
        baseSha: { type: string, description: The commit the execution started from. }
        headSha: { type: [string, 'null'], description: The last commit at the end (the base if nothing was committed). }
        commits: { type: [integer, 'null'], minimum: 0, description: Commits on top of the base. }
        uncommittedChanges:
          type: [boolean, 'null']
          description: Changes left uncommitted in the sandbox; they're not kept.
        pushedSha:
          type: [string, 'null']
          description: The branch's head after the push (differs from `headSha` when the commits were rebased); null when nothing was pushed.
    ExecutionUsage:
      type: object
      additionalProperties: false
      description: |
        The model calls the execution made through the model gateway, and
        their tokens (docs/models.md, Metering). Tokens a provider didn't
        report count as 0.
      required: [modelCalls, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd]
      properties:
        modelCalls: { type: integer, minimum: 0 }
        inputTokens:
          type: integer
          minimum: 0
          description: Every input token, cache reads and writes included.
        outputTokens: { type: integer, minimum: 0 }
        cacheReadTokens: { type: integer, minimum: 0 }
        cacheWriteTokens: { type: integer, minimum: 0 }
        costUsd:
          description: |
            The calls' cost at the prices in force when they were made;
            null when none of them had a price (a model outside the
            catalogue).
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExecutionResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- models ----------
    ModelProvider:
      type: string
      description: |
        Providers the model gateway can call: each needs code (Mastra's
        model router) and a key in OpenBao (`orgs/{organizationId}/llm/{provider}`
        or `platform/llm/{provider}`), so this list only changes with a release.
        `ollama` is a server the organization runs: its settings are a
        `baseUrl` and an optional key, its models aren't in the catalogue
        (any model the server has can be chosen) and its calls are unpriced.
      enum: [anthropic, openai, google, mistral, ollama]
    ModelStatus:
      type: string
      description: |
        `active`: new agent versions can choose it. `deprecated`: versions
        that already have it keep running, new ones can't choose it.
        `retired`: the gateway refuses to call it.
      enum: [active, deprecated, retired]
    Usd:
      type: string
      description: US dollars as a decimal string, at most 6 decimals (`../docs/api.md`).
      pattern: '^\d{1,9}(\.\d{1,6})?$'
    PricePerMTok:
      type: string
      description: US dollars per million tokens, a decimal string with at most 6 decimals.
      pattern: '^\d{1,6}(\.\d{1,6})?$'
    ModelRates:
      type: object
      description: |
        Prices per million tokens. Cache reads and writes without a price
        cost what other input does (e.g. OpenAI doesn't charge for writing
        its cache).
      required: [inputPerMTok, outputPerMTok]
      properties:
        inputPerMTok: { $ref: '#/components/schemas/PricePerMTok' }
        outputPerMTok: { $ref: '#/components/schemas/PricePerMTok' }
        cacheReadPerMTok:
          oneOf:
            - $ref: '#/components/schemas/PricePerMTok'
            - type: 'null'
        cacheWritePerMTok:
          description: Writing to the provider's shortest-lived cache (Anthropic's 5 minutes).
          oneOf:
            - $ref: '#/components/schemas/PricePerMTok'
            - type: 'null'
    LongContextRates:
      description: |
        Higher prices for a call whose input (cache reads and writes
        included) is over `aboveInputTokens`: the whole call is priced at
        these rates (e.g. Claude Haiku 5.5 above 100,000 tokens).
      allOf:
        - $ref: '#/components/schemas/ModelRates'
        - type: object
          required: [aboveInputTokens]
          properties:
            aboveInputTokens: { type: integer, minimum: 1 }
    ModelPriceInput:
      allOf:
        - $ref: '#/components/schemas/ModelRates'
        - type: object
          properties:
            longContext:
              oneOf:
                - $ref: '#/components/schemas/LongContextRates'
                - type: 'null'
    AddModelPriceRequest:
      allOf:
        - $ref: '#/components/schemas/ModelPriceInput'
        - type: object
          properties:
            effectiveFrom:
              type: string
              format: date-time
              description: When the price starts; now if absent. After the model's latest price.
    ModelPriceResponse:
      type: object
      required: [id, modelId, effectiveFrom, inputPerMTok, outputPerMTok, cacheReadPerMTok, cacheWritePerMTok, longContext, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        modelId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date-time }
        inputPerMTok: { $ref: '#/components/schemas/PricePerMTok' }
        outputPerMTok: { $ref: '#/components/schemas/PricePerMTok' }
        cacheReadPerMTok:
          oneOf:
            - $ref: '#/components/schemas/PricePerMTok'
            - type: 'null'
        cacheWritePerMTok:
          oneOf:
            - $ref: '#/components/schemas/PricePerMTok'
            - type: 'null'
        longContext:
          oneOf:
            - $ref: '#/components/schemas/LongContextRates'
            - type: 'null'
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ModelPricePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ModelPriceResponse' }
    CreateModelRequest:
      type: object
      additionalProperties: false
      required: [provider, model, name, price]
      properties:
        provider: { $ref: '#/components/schemas/ModelProvider' }
        model:
          type: string
          description: The provider's API model ID (`claude-sonnet-5-5`), as agent versions name it.
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: For people (`Claude Sonnet 5.5`).
        contextWindow: { type: [integer, 'null'], minimum: 1 }
        maxOutputTokens: { type: [integer, 'null'], minimum: 1 }
        price: { $ref: '#/components/schemas/ModelPriceInput' }
    UpdateModelRequest:
      type: object
      additionalProperties: false
      required: [name, status, contextWindow, maxOutputTokens]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ModelStatus' }
        contextWindow: { type: [integer, 'null'], minimum: 1 }
        maxOutputTokens: { type: [integer, 'null'], minimum: 1 }
    ModelResponse:
      type: object
      required: [id, provider, model, name, status, contextWindow, maxOutputTokens, price, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        provider:
          type: string
          description: A `ModelProvider` (a string here, so a provider removed from the list still reads).
        model: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/ModelStatus' }
        contextWindow: { type: [integer, 'null'] }
        maxOutputTokens: { type: [integer, 'null'] }
        price:
          description: The price in force now; null before its first one starts.
          oneOf:
            - $ref: '#/components/schemas/ModelPriceResponse'
            - type: 'null'
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ModelResponse' }

    # ---------- budgets ----------
    BudgetScope:
      type: string
      description: |
        What a budget limits (docs/models.md, Budgets): an organization's,
        a project's or an agent's model calls per calendar month (UTC), or a
        task tree's over its whole life.
      enum: [organization, project, agent, task_tree]
    SetBudgetRequest:
      type: object
      additionalProperties: false
      required: [limitUsd]
      properties:
        limitUsd:
          description: The limit; null for none.
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
    BudgetResponse:
      type: object
      required: [scope, scopeId, limitUsd, spentUsd, windowStart, thresholdPercent, updatedAt]
      properties:
        scope: { $ref: '#/components/schemas/BudgetScope' }
        scopeId:
          type: string
          format: uuid
          description: The organization, project, agent or top-level task.
        limitUsd:
          oneOf:
            - $ref: '#/components/schemas/Usd'
            - type: 'null'
        spentUsd:
          description: What the scope's model calls cost in the window (this month; a task tree's whole life).
          $ref: '#/components/schemas/Usd'
        windowStart:
          type: [string, 'null']
          format: date-time
          description: The start of this month (UTC); null for a task tree.
        thresholdPercent:
          type: integer
          description: At this share of the limit, `budget.threshold-reached` is published (once per window).
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: When the limit was last set; null if it never was.

    # ---------- model keys ----------
    SetModelKeyRequest:
      type: object
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 8
          maxLength: 1000
          description: The provider's API key; write-only (stored in OpenBao, never returned). Required except for `ollama`, where it's optional.
        baseUrl:
          type: string
          format: uri
          maxLength: 2000
          pattern: '^https?://'
          description: |
            For `ollama` only (and required there): where its server is, e.g.
            `https://ollama.example.com` (Hephaestus calls its OpenAI-compatible
            API at `<baseUrl>/v1`). `https://`; `http://` and private addresses
            only where `MODEL_ENDPOINT_ALLOW_PRIVATE` allows them.
    ModelKeyResponse:
      type: object
      required: [provider, scope, agentId, hint, baseUrl, updatedBy, updatedAt]
      properties:
        provider: { $ref: '#/components/schemas/ModelProvider' }
        scope:
          type: string
          enum: [organization, agent]
        agentId: { type: [string, 'null'], format: uuid }
        hint:
          type: [string, 'null']
          description: The key's last four characters (`…a1b2`), to tell keys apart; null for an `ollama` server without one.
        baseUrl:
          type: [string, 'null']
          description: For `ollama`, its server; null otherwise.
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    OllamaModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, sizeBytes]
            properties:
              name: { type: string, description: 'As an agent version names it, e.g. `qwen3:8b`.' }
              sizeBytes: { type: [integer, 'null'], minimum: 0 }
    ModelKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelKeyResponse' }

    # ---------- tool servers ----------
    ToolServerName:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,29}$'
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.-]+$'
    ToolServerAuthType:
      type: string
      description: |
        How Hephaestus authenticates to the server: `none`; `header`, sending
        the credential in `headerName`; or `task-token`, sending the running
        task's own Pistis token as a bearer token (only to servers whose
        origin the platform trusts, `TOOL_SERVER_TRUSTED_ORIGINS`: Aether-os's
        own, such as Seshat).
      enum: [none, header, task-token]
    ToolServerAuth:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/ToolServerAuthType' }
        headerName:
          description: For `header`; `Authorization` when left out.
          type: string
          pattern: '^[A-Za-z0-9-]{1,64}$'
    ToolServerUrl:
      type: string
      format: uri
      maxLength: 2000
      description: The MCP endpoint (Streamable HTTP); `https://`, or `http://` only where Hephaestus may reach private addresses (local development).
      pattern: '^https?://'
    CreateToolServerRequest:
      type: object
      additionalProperties: false
      required: [name, url, auth]
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    UpdateToolServerRequest:
      type: object
      additionalProperties: false
      required: [description, url, auth]
      properties:
        description: { type: string, maxLength: 500 }
        url: { $ref: '#/components/schemas/ToolServerUrl' }
        auth: { $ref: '#/components/schemas/ToolServerAuth' }
    SetToolServerCredentialRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 8, maxLength: 4096 }
    ToolServerCredential:
      type: object
      additionalProperties: false
      required: [hint, updatedBy, updatedAt]
      properties:
        hint: { type: string, description: 'The last four characters, e.g. `…ab12`.' }
        updatedBy: { type: string }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerResponse:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, description, url, auth, credential, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/ToolServerName' }
        description: { type: string }
        url: { type: string }
        auth:
          type: object
          additionalProperties: false
          required: [type, headerName]
          properties:
            type: { $ref: '#/components/schemas/ToolServerAuthType' }
            headerName:
              type: [string, 'null']
        credential:
          description: That a `header` credential is set; null when none is.
          oneOf:
            - { $ref: '#/components/schemas/ToolServerCredential' }
            - { type: 'null' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ToolServerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolServerResponse' }
    ToolDescription:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    ToolList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ToolDescription' }

    # ---------- skills ----------
    SkillName:
      type: string
      description: Lowercase letters, digits and hyphens (the Agent Skills format), unique in the organization.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
    SkillStatus:
      type: string
      enum: [active, archived]
    SkillFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative to the skill's folder, e.g. `SKILL.md` or `references/checklist.md`; no `..`.
          maxLength: 200
          pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
        content:
          type: string
          description: The file's text (UTF-8).
    SkillFiles:
      type: array
      description: The skill's folder, with `SKILL.md` at its root; at most 100 files and 1 MiB in all.
      minItems: 1
      maxItems: 100
      items: { $ref: '#/components/schemas/SkillFile' }
    CreateSkillRequest:
      type: object
      additionalProperties: false
      required: [name, files]
      properties:
        name: { $ref: '#/components/schemas/SkillName' }
        files: { $ref: '#/components/schemas/SkillFiles' }
    CreateSkillVersionRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files: { $ref: '#/components/schemas/SkillFiles' }
    SkillResponse:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, description, status, latestVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/SkillName' }
        description:
          type: string
          description: The latest version's, from its `SKILL.md`.
        status: { $ref: '#/components/schemas/SkillStatus' }
        latestVersion: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SkillPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SkillResponse' }
    SkillVersionResponse:
      type: object
      additionalProperties: false
      required: [id, skillId, organizationId, name, version, description, sizeBytes, fileCount, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/SkillName' }
        version: { type: integer, minimum: 1 }
        description: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        fileCount: { type: integer, minimum: 1 }
        files:
          description: Only when reading one version.
          type: array
          items: { $ref: '#/components/schemas/SkillFile' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    SkillVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SkillVersionResponse' }
