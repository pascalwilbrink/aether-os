openapi: 3.1.0
info:
  title: Pistis API
  version: 0.4.0
  description: |
    Authentication for Aether-os (see `../docs/identity.md`). Pistis owns
    **users** and the **external identities** linked to them: a user signs in
    through any linked provider (Google, GitHub, an organization's Entra
    tenant, …) and is always the same Pistis user, identified by its `id`
    (the `sub` of the tokens Pistis will issue). Identities are linked by
    `(provider, subject)`, the provider's own stable identifier, and never by
    email address.

    Pistis is also an identity provider itself: the `password` provider
    (a login and a password, kept by Pistis) is a linked identity like any
    other, so a user can have a password and, say, Google at the same time.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details,
    cursor pagination, UUIDs.

    Users are for platform operators for now (a platform service with
    `platform:manage`). Service accounts belong to an organization and are
    managed with a token for it (`x-permission`). The OpenID Connect
    endpoints (`/oidc/*`: sign-in, tokens, token exchange) and sign-in pages
    are not part of this API.

security:
  - pistis: []

tags:
  - name: users
  - name: service-accounts
  - name: user-providers

paths:
  /v1/users:
    post:
      tags: [users]
      operationId: createUser
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Creates a user with a first identity, so the user can sign in from the
        start: either an external one (`provider`) or a password
        (`password`), exactly one of them. Users who sign in through a provider for the first
        time are created by the sign-in itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [users]
      operationId: listUsers
      x-permission: '`platform:manage` (platform operators)'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      x-permission: '`platform:read` (platform services, e.g. Kerykes for a recipient''s email), or `platform:manage`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [users]
      operationId: updateUser
      x-permission: '`platform:manage` (platform operators)'
      description: Replaces the user's profile (display name and contact email); a change publishes `user.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: disableUser
      x-permission: '`platform:manage` (platform operators)'
      description: Blocks sign-in through every linked identity; publishes `user.disabled` when it changes something. Idempotent.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Disabled (or already disabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: enableUser
      x-permission: '`platform:manage` (platform operators)'
      description: Allows sign-in again; publishes `user.enabled` when it changes something. Idempotent.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Active (or already active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/announce:
    post:
      tags: [users]
      operationId: announceUsers
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Publishes every user's current state as `user.updated`, at their
        current version (no new version): the backfill for services that
        keep a copy of Pistis's users (Polis) and missed users created
        before Pistis published events. Consumers keep what they have when
        it's as new, so running it again is harmless.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The events are in the outbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAnnouncementResponse' }

  /v1/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [user-providers]
      operationId: setUpPassword
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Gives the user a password identity: a login (normalized to lowercase)
        and a password. `PASSWORD_ALREADY_SET` if they have one;
        `IDENTITY_ALREADY_LINKED` if another user has the login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordIdentityRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProviderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    put:
      tags: [user-providers]
      operationId: changePassword
      x-permission: '`platform:manage` (platform operators)'
      description: Replaces the password of the user's password identity (404 if they have none).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/{userId}/providers:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [user-providers]
      operationId: linkUserProvider
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Links another external identity to the user, so either signs in as
        the same user. An identity belongs to at most one user
        (`IDENTITY_ALREADY_LINKED`). The `password` provider is set up with
        `POST /v1/users/{userId}/password` instead
        (`PASSWORD_PROVIDER_RESERVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkUserProviderRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProviderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [user-providers]
      operationId: listUserProviders
      x-permission: '`platform:manage` (platform operators)'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProviderPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/{userId}/providers/{userProviderId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserProviderId'
    delete:
      tags: [user-providers]
      operationId: unlinkUserProvider
      x-permission: '`platform:manage` (platform operators)'
      description: |
        Unlinks an identity. The last one can't be unlinked
        (`USER_LAST_PROVIDER`): a user always has a way to sign in.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Unlinked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /v1/organizations/{organizationId}/users:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [users]
      operationId: listOrganizationUsers
      x-permission: '`member:read`'
      description: |
        The organization's people: the users with a membership in Polis,
        newest membership first, with their profile. Pistis pages through
        Polis's memberships (`cursor` is Polis's), so a page can hold fewer
        items than `limit`. Roles stay in Polis.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest membership first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationUserPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [service-accounts]
      operationId: createServiceAccount
      x-permission: '`service-account:manage`'
      description: |
        A service account in the organization: the identity an automation or
        an integration acts as (`sub_type: service_account`). Its roles are
        memberships in Polis, granted like a user's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceAccountRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [service-accounts]
      operationId: listServiceAccounts
      x-permission: '`member:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/service-accounts/{serviceAccountId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    get:
      tags: [service-accounts]
      operationId: getServiceAccount
      x-permission: '`member:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/service-accounts/{serviceAccountId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    post:
      tags: [service-accounts]
      operationId: disableServiceAccount
      x-permission: '`service-account:manage`'
      description: No more tokens for it, through any API key or exchange. Idempotent.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Disabled (or already disabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/service-accounts/{serviceAccountId}/enable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    post:
      tags: [service-accounts]
      operationId: enableServiceAccount
      x-permission: '`service-account:manage`'
      description: Idempotent.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Enabled (or already enabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/service-accounts/{serviceAccountId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    post:
      tags: [service-accounts]
      operationId: createApiKey
      x-permission: '`service-account:manage`'
      description: |
        A new API key for the service account. The key is in this response
        only: Pistis keeps a hash. Exchange it for an access token at
        `/oidc/token` (token exchange, `subject_token_type`
        `urn:aether-os:token-type:api-key`, client `api-key`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created; `key` is shown only here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiKeyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
    get:
      tags: [service-accounts]
      operationId: listApiKeys
      x-permission: '`member:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first, without the keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/service-accounts/{serviceAccountId}/api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags: [service-accounts]
      operationId: revokeApiKey
      x-permission: '`service-account:manage`'
      description: The key stops working at once (tokens it got expire within minutes).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserProviderId:
      name: userProviderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - IDENTITY_ALREADY_LINKED
        - USER_LAST_PROVIDER
        - PASSWORD_ALREADY_SET
        - PASSWORD_PROVIDER_RESERVED
        - SERVICE_ACCOUNT_DISABLED
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time
    Email:
      type: string
      format: email
      maxLength: 320
      description: |
        Contact information only. Never used to find or link a user: anyone
        controlling an upstream account with the same address would take
        over the user (`docs/identity.md`).

    # ---------- users ----------
    UserStatus:
      type: string
      enum: [active, disabled]
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      description: Exactly one of `provider` and `password`.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        provider: { $ref: '#/components/schemas/LinkUserProviderRequest' }
        password: { $ref: '#/components/schemas/PasswordIdentityRequest' }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
    UserResponse:
      type: object
      required: [id, displayName, email, status, createdAt, updatedAt, lastSignInAt]
      properties:
        id:
          type: string
          format: uuid
          description: The user's Pistis `sub`.
        displayName: { type: string }
        email: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        lastSignInAt:
          type: [string, 'null']
          format: date-time
    UserAnnouncementResponse:
      type: object
      required: [announced]
      properties:
        announced:
          type: integer
          minimum: 0
          description: How many users were published.
    OrganizationUserResponse:
      type: object
      description: A member's profile, as other members see it.
      required: [id, displayName, email, status]
      properties:
        id:
          type: string
          format: uuid
          description: The user's Pistis `sub` (a membership's `subject`).
        displayName: { type: string }
        email: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/UserStatus' }
    OrganizationUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrganizationUserResponse' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/UserResponse' }

    # ---------- linked identities ----------
    Provider:
      type: string
      pattern: '^[a-z0-9][a-z0-9:._-]{0,62}$'
      description: |
        The identity provider, as configured in Pistis: `google`, `github`,
        `entra:<tenant id>`, … Lowercase letters, digits and `:._-`.
    ProviderSubject:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        The provider's stable identifier for the account (an OIDC `sub`, a
        GitHub user ID, an Entra object ID), never an email address or a
        username that can change.
    LinkUserProviderRequest:
      type: object
      additionalProperties: false
      required: [provider, subject, email, emailVerified]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        subject: { $ref: '#/components/schemas/ProviderSubject' }
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        emailVerified:
          type: boolean
          description: Whether the provider says it verified the email.
    Login:
      type: string
      minLength: 3
      maxLength: 320
      description: |
        What the user types to sign in with a password, usually their email
        address. Stored lowercase and trimmed; unique across users.
    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: Stored only as a scrypt hash.
    PasswordIdentityRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { $ref: '#/components/schemas/Login' }
        password: { $ref: '#/components/schemas/Password' }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { $ref: '#/components/schemas/Password' }
    UserProviderResponse:
      type: object
      required: [id, userId, provider, subject, email, emailVerified, createdAt, lastSignInAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        provider: { type: string }
        subject: { type: string }
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastSignInAt:
          type: [string, 'null']
          format: date-time
    UserProviderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/UserProviderResponse' }

    # ---------- service accounts ----------
    ServiceAccountStatus:
      type: string
      enum: [active, disabled]
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    ServiceAccountResponse:
      type: object
      required: [id, organizationId, name, description, status, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Its `sub` in tokens, and the `subject` of its Polis memberships.
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ServiceAccountStatus' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ServiceAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ServiceAccountResponse' }
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: What the key is for. }
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Optional; after it, the key stops working.
    ApiKeyResponse:
      type: object
      required: [id, serviceAccountId, name, prefix, expiresAt, lastUsedAt, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        serviceAccountId: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: The key's first characters, to recognise it; never the whole key.
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastUsedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    CreatedApiKeyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKeyResponse'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The API key itself (`aos_…`), shown only in this response.
    ApiKeyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ApiKeyResponse' }

    # ---------- pagination ----------
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }
