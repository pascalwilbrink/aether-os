openapi: 3.1.0
info:
  title: Agora API
  version: 0.1.0
  description: |
    Agent management for Aether-os: agents and their immutable versions
    (instructions, model, tools, skills, capabilities, runtime). A version
    moves draft → published → deprecated, and only one version of an agent
    is published at a time. Source of truth for Agora's HTTP contract; Agora
    and Iris generate their types from this file.

    Organizations belong to Polis: a write in a suspended organization is
    rejected (409 `ORGANIZATION_SUSPENDED`); an unknown one is 404. If Polis
    can't be reached, `503 UNAVAILABLE`. Agora publishes every change to its
    agents and versions (`agora.asyncapi.yaml`): Hephaestus keeps a copy of
    them to run tasks with.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Archiving an archived agent and publishing the published version
    are idempotent.

    Every operation needs a Pistis access token for the organization
    (`Authorization: Bearer`); `x-permission` names what it requires
    (`../docs/identity.md`). Another organization's `{organizationId}` is
    404. `createdBy` is the caller's `sub`.

security:
  - pistis: []

tags:
  - name: agents
  - name: agent-versions

paths:
  /v1/organizations/{organizationId}/agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [agents]
      operationId: createAgent
      x-permission: '`agent:write`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agents]
      operationId: listAgents
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: archiveAgent
      x-permission: '`agent:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agent-versions]
      operationId: createAgentVersion
      x-permission: '`agent:write`'
      description: |
        Creates a draft version; the version number is assigned by the
        server. Its model must be an `active` model of Hephaestus's catalogue
        (`MODEL_NOT_AVAILABLE` otherwise), and each enabled entry of `tools`
        must name one of the organization's tool servers, each at most once
        (`TOOL_SERVER_INVALID` otherwise); each enabled entry of `skills` a
        version of one of its active skills, each skill at most once
        (`SKILL_INVALID`). Agora asks Hephaestus, which owns the catalogue,
        tool servers and skills; if Hephaestus can't be reached, `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agent-versions]
      operationId: listAgentVersions
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Highest version first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [agent-versions]
      operationId: getAgentVersion
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [agent-versions]
      operationId: publishAgentVersion
      x-permission: '`agent:publish`'
      description: |
        Publishes a draft and deprecates the previously published version.
        Publishing the version that's already published returns it unchanged;
        a deprecated version can't be published again (409).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_VERSION_CONFLICT
        - AGENT_VERSION_INVALID_TRANSITION
        - MODEL_NOT_AVAILABLE
        - ORGANIZATION_SUSPENDED
        - SKILL_INVALID
        - TOOL_SERVER_INVALID
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time
    ToolServerName:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,29}$'
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.-]+$'
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- agents ----------
    AgentStatus:
      type: string
      enum: [active, archived]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AgentResponse:
      type: object
      required: [id, organizationId, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentResponse' }

    # ---------- agent versions ----------
    AgentVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      description: |
        Tools from one of the organization's tool servers (MCP): the agent
        gets them as `<name>_<tool>`. An enabled entry must name an existing
        tool server when the version is created.
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        enabled: { type: boolean }
        tools:
          description: Which of the server's tools, by name; all of them when left out.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ToolName' }
    AgentSkillConfiguration:
      type: object
      additionalProperties: false
      required: [name, version, enabled]
      description: |
        A version of one of the organization's skills (`/skills`), pinned:
        `version` is its number (`"3"`). An enabled entry must name an
        active skill and one of its versions when the agent version is
        created (`SKILL_INVALID` otherwise).
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        enabled: { type: boolean }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
        networkAccess:
          description: |
            The sandbox's network (../CLAUDE.md, sandboxes): `none` (the
            default) or `restricted`, where it reaches only allowed hosts
            through an allowlisting proxy: the platform's (package
            registries, `SANDBOX_ALLOWED_HOSTS`) and `allowedHosts`.
          type: string
          enum: [none, restricted]
        allowedHosts:
          description: Hosts a `restricted` sandbox may reach on ports 80 and 443, besides the platform's; `*.example.com` for its subdomains.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/HostPattern' }
    HostPattern:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    CreateAgentVersionRequest:
      type: object
      additionalProperties: false
      required: [instructions, model, capabilities, tools, skills, runtime]
      properties:
        instructions: { type: string, minLength: 1 }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
    AgentVersionResponse:
      type: object
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AgentVersionStatus' }
        instructions: { type: string }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    AgentVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentVersionResponse' }
