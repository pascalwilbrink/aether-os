openapi: 3.1.0
info:
  title: Agora API
  version: 0.3.0
  description: |
    Agent management for Aether-os: agents and their immutable versions
    (instructions, model, tools, skills, capabilities, runtime), the
    organization's skills (Agent Skills folders) that versions pin, and
    councils (`../docs/councils.md`): virtual teams of the organization's
    agents, a facilitator and members, with immutable versions too. A version
    moves draft → published → deprecated, and only one version of an agent
    is published at a time. Source of truth for Agora's HTTP contract; Agora
    and Iris generate their types from this file.

    Organizations belong to Polis: a write in a suspended organization is
    rejected (409 `ORGANIZATION_SUSPENDED`); an unknown one is 404. If Polis
    can't be reached, `503 UNAVAILABLE`. Agora publishes every change to its
    agents and versions (`agora.asyncapi.yaml`): Hephaestus keeps a copy of
    them to run tasks with.

    Follows `../docs/api.md`: paths under `/v1`, errors as problem details
    (`Problem`, `application/problem+json`; business-rule violations are 409
    with a `DomainErrorCode`), and lists paginated with `limit` / `cursor` →
    `items` / `nextCursor`. IDs are UUIDs; a path parameter that isn't one is
    `400`. Archiving an archived agent and publishing the published version
    are idempotent.

    Every operation needs a Pistis access token for the organization
    (`Authorization: Bearer`); `x-permission` names what it requires
    (`../docs/identity.md`). Another organization's `{organizationId}` is
    404. `createdBy` is the caller's `sub`.

security:
  - pistis: []

tags:
  - name: agents
  - name: agent-versions
  - name: skills
  - name: councils

paths:
  /v1/organizations/{organizationId}/agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [agents]
      operationId: createAgent
      x-permission: '`agent:write`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agents]
      operationId: listAgents
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: archiveAgent
      x-permission: '`agent:write`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agent-versions]
      operationId: createAgentVersion
      x-permission: '`agent:write`'
      description: |
        Creates a draft version; the version number is assigned by the
        server. Its model must be an `active` model of Hephaestus's catalogue
        (`MODEL_NOT_AVAILABLE` otherwise), and each enabled entry of `tools`
        must name one of the organization's tool servers, each at most once
        (`TOOL_SERVER_INVALID` otherwise); each enabled entry of `skills` a
        version of one of its active skills, each skill at most once
        (`SKILL_INVALID`). Agora asks Hephaestus, which owns the catalogue,
        tool servers and skills; if Hephaestus can't be reached, `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [agent-versions]
      operationId: listAgentVersions
      x-permission: '`agent:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Highest version first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [agent-versions]
      operationId: getAgentVersion
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/agents/{agentId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [agent-versions]
      operationId: publishAgentVersion
      x-permission: '`agent:publish`'
      description: |
        Publishes a draft and deprecates the previously published version.
        Publishing the version that's already published returns it unchanged;
        a deprecated version can't be published again (409).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [skills]
      operationId: listSkills
      x-permission: '`agent:read`'
      description: The organization's skills, by name, without their files.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SkillStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: By name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [skills]
      operationId: createSkill
      x-permission: '`agent:write`'
      description: |
        Creates a skill with its first version: a folder of text files in the
        Agent Skills format, with `SKILL.md` at its root (YAML front matter
        with `name`, the skill's name, and `description`, then the
        instructions). Agent versions pin a version of it (`skills[]`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSkillRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [skills]
      operationId: getSkill
      x-permission: '`agent:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/skills/{skillId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    post:
      tags: [skills]
      operationId: archiveSkill
      x-permission: '`agent:write`'
      description: |
        Archives it (idempotent): new agent versions can't choose it, and it
        gets no new versions. Agent versions that already pin one of its
        versions keep running with it.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [skills]
      operationId: listSkillVersions
      x-permission: '`agent:read`'
      description: Newest first, without their files.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [skills]
      operationId: createSkillVersion
      x-permission: '`agent:write`'
      description: |
        A new version (versions never change): the whole folder again, its
        `SKILL.md` naming the same skill. Numbered by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSkillVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/skills/{skillId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillId'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [skills]
      operationId: getSkillVersion
      x-permission: '`agent:read`'
      description: The version with its files.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/councils:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [councils]
      operationId: createCouncil
      x-permission: '`council:write`'
      description: |
        Creates a council, without a version yet. Its `key` is unique in the
        organization (`COUNCIL_ALREADY_EXISTS`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCouncilRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [councils]
      operationId: listCouncils
      x-permission: '`council:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/councils/{councilId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CouncilId'
    get:
      tags: [councils]
      operationId: getCouncil
      x-permission: '`council:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/councils/{councilId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CouncilId'
    post:
      tags: [councils]
      operationId: archiveCouncil
      x-permission: '`council:write`'
      description: No new versions or sessions; archiving an archived council returns it unchanged.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Archived (or already archived)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/organizations/{organizationId}/councils/{councilId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CouncilId'
    post:
      tags: [councils]
      operationId: createCouncilVersion
      x-permission: '`council:write`'
      description: |
        Creates a draft version (numbered by the server). Its facilitator and
        members are agents of the organization, referenced by ID: each must
        exist, be active and have a published version; the facilitator isn't
        also a member, and each agent is a member once; a `conditional`
        member says `when` it takes part; `settings.defaultMode` is a mode
        the settings allow (`COUNCIL_VERSION_INVALID` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCouncilVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [councils]
      operationId: listCouncilVersions
      x-permission: '`council:read`'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Highest version first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilVersionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/councils/{councilId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CouncilId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [councils]
      operationId: getCouncilVersion
      x-permission: '`council:read`'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organizations/{organizationId}/councils/{councilId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CouncilId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [councils]
      operationId: publishCouncilVersion
      x-permission: '`council:publish`'
      description: |
        Publishes a draft and deprecates the previously published version.
        Its agents are checked again (one may have been archived since the
        draft was made: `COUNCIL_VERSION_INVALID`). Publishing the published
        version returns it unchanged; a deprecated version can't be published
        again (409).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouncilVersionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CouncilId:
      name: councilId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit: { $ref: './common.openapi.yaml#/components/parameters/Limit' }
    Cursor: { $ref: './common.openapi.yaml#/components/parameters/Cursor' }

  securitySchemes:
    pistis:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Pistis access token (`../docs/identity.md`).
  responses:
    Unauthorized: { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
    ValidationError: { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    NotFound: { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    Unavailable: { $ref: './common.openapi.yaml#/components/responses/Unavailable' }
    DomainError:
      description: A business rule forbids this (409, with a `DomainErrorCode`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DomainProblem' }

  schemas:
    # ---------- errors ----------
    Problem: { $ref: './common.openapi.yaml#/components/schemas/Problem' }
    DomainErrorCode:
      type: string
      enum:
        - AGENT_ARCHIVED
        - AGENT_VERSION_CONFLICT
        - AGENT_VERSION_INVALID_TRANSITION
        - COUNCIL_ALREADY_EXISTS
        - COUNCIL_ARCHIVED
        - COUNCIL_VERSION_CONFLICT
        - COUNCIL_VERSION_INVALID
        - COUNCIL_VERSION_INVALID_TRANSITION
        - MODEL_NOT_AVAILABLE
        - ORGANIZATION_SUSPENDED
        - SKILL_ALREADY_EXISTS
        - SKILL_ARCHIVED
        - SKILL_INVALID
        - TOOL_SERVER_INVALID
    DomainProblem:
      description: Problem details for a business-rule violation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/DomainErrorCode' }

    # ---------- shared ----------
    Timestamp:
      type: string
      format: date-time
    ToolServerName:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,29}$'
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.-]+$'
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { $ref: './common.openapi.yaml#/components/schemas/NextCursor' }

    # ---------- agents ----------
    AgentStatus:
      type: string
      enum: [active, archived]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AgentResponse:
      type: object
      required: [id, organizationId, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentResponse' }

    # ---------- agent versions ----------
    AgentVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    AgentModelConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1 }
    AgentToolConfiguration:
      type: object
      additionalProperties: false
      required: [name, enabled]
      description: |
        Tools from one of the organization's tool servers (MCP): the agent
        gets them as `<name>_<tool>`. An enabled entry must name an existing
        tool server when the version is created.
      properties:
        name: { $ref: '#/components/schemas/ToolServerName' }
        enabled: { type: boolean }
        tools:
          description: Which of the server's tools, by name; all of them when left out.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ToolName' }
    AgentSkillConfiguration:
      type: object
      additionalProperties: false
      required: [name, version, enabled]
      description: |
        A version of one of the organization's skills (`/skills`), pinned:
        `version` is its number (`"3"`). An enabled entry must name an
        active skill and one of its versions when the agent version is
        created (`SKILL_INVALID` otherwise).
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        enabled: { type: boolean }
    AgentExecutionMode:
      type: string
      enum: [standard, coding]
    AgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, executionMode, sandboxRequired]
      properties:
        provider: { type: string, minLength: 1 }
        executionMode: { $ref: '#/components/schemas/AgentExecutionMode' }
        sandboxRequired: { type: boolean }
        networkAccess:
          description: |
            The sandbox's network (../CLAUDE.md, sandboxes): `none` (the
            default) or `restricted`, where it reaches only allowed hosts
            through an allowlisting proxy: the platform's (package
            registries, `SANDBOX_ALLOWED_HOSTS`) and `allowedHosts`.
          type: string
          enum: [none, restricted]
        allowedHosts:
          description: Hosts a `restricted` sandbox may reach on ports 80 and 443, besides the platform's; `*.example.com` for its subdomains.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/HostPattern' }
    HostPattern:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
    CreateAgentVersionRequest:
      type: object
      additionalProperties: false
      required: [instructions, model, capabilities, tools, skills, runtime]
      properties:
        instructions: { type: string, minLength: 1 }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
    AgentVersionResponse:
      type: object
      required: [id, agentId, organizationId, version, status, instructions, model, capabilities, tools, skills, runtime, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AgentVersionStatus' }
        instructions: { type: string }
        model: { $ref: '#/components/schemas/AgentModelConfiguration' }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentToolConfiguration' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillConfiguration' }
        runtime: { $ref: '#/components/schemas/AgentRuntimeConfiguration' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    AgentVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentVersionResponse' }

    # ---------- skills ----------
    SkillName:
      type: string
      description: Lowercase letters, digits and hyphens (the Agent Skills format), unique in the organization.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
    SkillStatus:
      type: string
      enum: [active, archived]
    SkillFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative to the skill's folder, e.g. `SKILL.md` or `references/checklist.md`; no `..`.
          maxLength: 200
          pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
        content:
          type: string
          description: The file's text (UTF-8).
    SkillFiles:
      type: array
      description: The skill's folder, with `SKILL.md` at its root; at most 100 files and 1 MiB in all.
      minItems: 1
      maxItems: 100
      items: { $ref: '#/components/schemas/SkillFile' }
    CreateSkillRequest:
      type: object
      additionalProperties: false
      required: [name, files]
      properties:
        name: { $ref: '#/components/schemas/SkillName' }
        files: { $ref: '#/components/schemas/SkillFiles' }
    CreateSkillVersionRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files: { $ref: '#/components/schemas/SkillFiles' }
    SkillResponse:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, description, status, latestVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/SkillName' }
        description:
          type: string
          description: The latest version's, from its `SKILL.md`.
        status: { $ref: '#/components/schemas/SkillStatus' }
        latestVersion: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SkillPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SkillResponse' }
    SkillVersionResponse:
      type: object
      additionalProperties: false
      required: [id, skillId, organizationId, name, version, description, sizeBytes, fileCount, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/SkillName' }
        version: { type: integer, minimum: 1 }
        description: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        fileCount: { type: integer, minimum: 1 }
        files:
          description: Only when reading one version.
          type: array
          items: { $ref: '#/components/schemas/SkillFile' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    SkillVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SkillVersionResponse' }

    # ---------- councils (../docs/councils.md) ----------
    CouncilStatus:
      type: string
      enum: [active, archived]
    CouncilKey:
      type: string
      description: Lowercase letters, digits and hyphens, starting with a letter; unique in the organization.
      pattern: '^[a-z][a-z0-9-]{0,62}$'
    CreateCouncilRequest:
      type: object
      additionalProperties: false
      required: [key, name, description]
      properties:
        key: { $ref: '#/components/schemas/CouncilKey' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    CouncilResponse:
      type: object
      required: [id, organizationId, key, name, description, status, latestVersionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/CouncilKey' }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/CouncilStatus' }
        latestVersionId:
          type: [string, 'null']
          format: uuid
          description: The currently published version, if any.
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CouncilPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CouncilResponse' }
    CouncilVersionStatus:
      type: string
      enum: [draft, published, deprecated]
    CouncilMode:
      type: string
      enum: [direct, facilitated, discussion, planning, delegation]
      description: |
        How a session works together (`../docs/councils.md`, Collaboration
        modes): `direct` (a person addresses one member), `facilitated`
        (always allowed), `discussion` (deliberation rounds), `planning`,
        `delegation`.
    CouncilParticipation:
      type: string
      enum: [required, conditional, optional]
      description: '`required`: always takes part; `conditional`: when the facilitator judges `when` applies; `optional`: only when invited.'
    CouncilFacilitator:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId: { type: string, format: uuid, description: An agent of the organization. }
    CouncilMember:
      type: object
      additionalProperties: false
      required: [agentId, participation]
      properties:
        agentId: { type: string, format: uuid, description: An agent of the organization. }
        participation: { $ref: '#/components/schemas/CouncilParticipation' }
        when:
          type: string
          minLength: 1
          maxLength: 1000
          description: When a `conditional` member takes part (required for one).
        role:
          type: string
          minLength: 1
          maxLength: 1000
          description: What the member is there for in this council; adds to the agent's own instructions in a session.
    CouncilSettingsRequest:
      type: object
      additionalProperties: false
      description: Every field optional; a missing one takes its default.
      properties:
        defaultMode: { $ref: '#/components/schemas/CouncilMode', description: 'Default `facilitated`.' }
        allowDirectInteraction: { type: boolean, description: Default true. }
        allowDiscussion: { type: boolean, description: Default true. }
        allowPlanning: { type: boolean, description: Default true. }
        allowDelegation: { type: boolean, description: Default false. }
        requireSynthesis: { type: boolean, description: Default true. }
    CouncilSettings:
      type: object
      required: [defaultMode, allowDirectInteraction, allowDiscussion, allowPlanning, allowDelegation, requireSynthesis]
      properties:
        defaultMode: { $ref: '#/components/schemas/CouncilMode' }
        allowDirectInteraction: { type: boolean }
        allowDiscussion: { type: boolean }
        allowPlanning: { type: boolean }
        allowDelegation: { type: boolean }
        requireSynthesis: { type: boolean }
    CouncilDiscussionRequest:
      type: object
      additionalProperties: false
      description: Every field optional; a missing one takes its default.
      properties:
        maxRounds: { type: integer, minimum: 1, maximum: 10, description: Default 3. }
        allowAgentResponses: { type: boolean, description: 'Default true: later participants in a round see earlier answers.' }
        requireFacilitatorConclusion: { type: boolean, description: Default true. }
    CouncilDiscussion:
      type: object
      required: [maxRounds, allowAgentResponses, requireFacilitatorConclusion]
      properties:
        maxRounds: { type: integer, minimum: 1, maximum: 10 }
        allowAgentResponses: { type: boolean }
        requireFacilitatorConclusion: { type: boolean }
    CreateCouncilVersionRequest:
      type: object
      additionalProperties: false
      required: [facilitator, members]
      properties:
        facilitator: { $ref: '#/components/schemas/CouncilFacilitator' }
        members:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/CouncilMember' }
        settings: { $ref: '#/components/schemas/CouncilSettingsRequest' }
        discussion: { $ref: '#/components/schemas/CouncilDiscussionRequest' }
    CouncilVersionResponse:
      type: object
      required: [id, councilId, organizationId, version, status, facilitator, members, settings, discussion, createdBy, createdAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        councilId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/CouncilVersionStatus' }
        facilitator: { $ref: '#/components/schemas/CouncilFacilitator' }
        members:
          type: array
          items: { $ref: '#/components/schemas/CouncilMember' }
        settings: { $ref: '#/components/schemas/CouncilSettings' }
        discussion: { $ref: '#/components/schemas/CouncilDiscussion' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        publishedAt:
          type: [string, 'null']
          format: date-time
    CouncilVersionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CouncilVersionResponse' }
