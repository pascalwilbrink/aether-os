# Aether-os local development infrastructure.
#
#   docker compose up -d        # start everything
#   docker compose down -v      # stop and wipe all data
#
# Every credential below is a fixed, local-only development value. Never
# reuse them anywhere else. OpenBao runs in dev mode: in-memory and unsealed,
# so its secrets are lost on restart.
#
# Host ports
#   Postgres      5432                     RabbitMQ   5672 (AMQP), 15672 (UI)
#   OpenBao       8200                     OPA        8181
#   OTel (OTLP)   4317 (gRPC), 4318 (HTTP) Jaeger UI  16686
#   Langfuse UI   3100                     RustFS     9100 (S3), 9101 (console)
#   Mailpit       1025 (SMTP), 8025 (UI)   Grafana    3300 (Loki logs + Jaeger traces)
# App services run outside compose: Iris 3000, Polis 3001, Hephaestus 3002,
# Pistis 3003, Proxenos 3004, Kairos 3005, Kerykes 3006, Loculus 3007.

name: aether-os

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aether -d aether']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: aether
      RABBITMQ_DEFAULT_PASS: aether
    ports: ['5672:5672', '15672:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  openbao:
    image: openbao/openbao:2.2.0
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ['8200:8200']

  # Policy decisions for APS. Later configured to pull bundles from Themis.
  opa:
    image: openpolicyagent/opa:1.4.2
    command: run --server --addr=0.0.0.0:8181 --log-level=info
    ports: ['8181:8181']

  # ---------- observability ----------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.125.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ['4317:4317', '4318:4318']
    depends_on: [jaeger, loki]

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports: ['16686:16686']

  # Log storage; receives OTLP logs from the Collector. Queried through Grafana.
  loki:
    image: grafana/loki:3.5.0
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ['3300:3000']
    depends_on: [loki, jaeger]

  langfuse-web:
    image: langfuse/langfuse:3
    environment: &langfuse-env
      DATABASE_URL: postgresql://aether:aether@postgres:5432/langfuse
      SALT: local-dev-salt
      ENCRYPTION_KEY: 6f7505bb56480d7d1ca18e5e778819d8aa2d6b8d0023356635bae646fb15c069
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: local-dev-nextauth-secret
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: aether
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: loculus
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: loculus-dev-secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: loculus
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: loculus-dev-secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9100
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # Headless setup: a ready-made org, project, API keys and login.
      LANGFUSE_INIT_ORG_ID: aether-os
      LANGFUSE_INIT_ORG_NAME: Aether-os
      LANGFUSE_INIT_PROJECT_ID: aether-os-local
      LANGFUSE_INIT_PROJECT_NAME: aether-os-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local
      LANGFUSE_INIT_USER_EMAIL: dev@aether-os.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: aether-dev
    ports: ['3100:3000']
    depends_on: &langfuse-deps
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on: *langfuse-deps

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--requirepass', 'aether', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'aether', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage: Loculus's files (its bucket made by Loculus with
  # S3_CREATE_BUCKET) and Langfuse's events and media (`langfuse`, a
  # directory under /data, made here). Console:
  # localhost:9101/rustfs/console/index.html.
  rustfs:
    image: rustfs/rustfs:1.0.5
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && exec /usr/bin/rustfs /data'
    environment:
      RUSTFS_ACCESS_KEY: loculus
      RUSTFS_SECRET_KEY: loculus-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9100:9000', '9101:9001']
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email sent locally (Kerykes); nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports: ['1025:1025', '8025:8025']

volumes:
  loki-data:
  postgres-data:
  rabbitmq-data:
  clickhouse-data:
  rustfs-data:
