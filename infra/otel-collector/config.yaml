# Services send OTLP here (localhost:4317 gRPC / 4318 HTTP).
# All traces go to Jaeger (service view) and Langfuse (LLM view); logs go to Loki.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # base64("pk-lf-local:sk-lf-local"), the local-only keys from docker-compose.yml
      Authorization: Basic cGstbGYtbG9jYWw6c2stbGYtbG9jYWw=

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlphttp/langfuse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
