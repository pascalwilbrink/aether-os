# Services send OTLP here (localhost:4317 gRPC / 4318 HTTP; the services use
# HTTP, OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318).
# Every trace goes to Jaeger (the service view); only agent runs (gen_ai.*
# spans and Hephaestus's execution spans) also go to Langfuse. Logs go to
# Loki. Credentials that slipped into an attribute are redacted before
# anything leaves the Collector.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  # A second line of defence: services never put secrets in spans, but
  # nothing that looks like a bearer token, a provider key or a GitHub token
  # is exported.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [redacted]")
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{16,}", "[redacted key]")
          - replace_all_patterns(attributes, "value", "gh[pousr]_[A-Za-z0-9]{20,}", "[redacted token]")
          - replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+", "[redacted jwt]")
  # Langfuse is for agent runs: Hephaestus's execution span (the trace's
  # name, session and metadata) and the model and tool calls under it;
  # everything else stays out.
  filter/llm-only:
    error_mode: ignore
    traces:
      span:
        - 'attributes["gen_ai.operation.name"] == nil and attributes["gen_ai.request.model"] == nil and attributes["gen_ai.system"] == nil and attributes["langfuse.trace.name"] == nil'

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # base64("pk-lf-local:sk-lf-local"), the local-only keys from docker-compose.yml
      Authorization: Basic cGstbGYtbG9jYWw6c2stbGYtbG9jYWw=

service:
  pipelines:
    traces/jaeger:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp/jaeger]
    traces/langfuse:
      receivers: [otlp]
      processors: [transform/redact, filter/llm-only, batch]
      exporters: [otlphttp/langfuse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
