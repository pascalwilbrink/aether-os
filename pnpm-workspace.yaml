packages:
  - contracts
  - krepis
  - polis
  - hephaestus
  - pistis
  - proxenos
  - kairos
  - kerykes
  - loculus
  - agora
  - seshat
  - pylon
  - ui/iris
  - ui/atlas
  - ui/design
  - ui/sign-in

# Native builds allowed during install.
onlyBuiltDependencies:
  - better-sqlite3
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Krepis is injected (copied) into its consumers so its peer dependencies
# resolve to each consumer's copy of Nest/TypeORM/class-validator. Re-sync the
# copies automatically whenever Krepis is rebuilt.
syncInjectedDepsAfterScripts:
  - build

# Keep injected dependencies (Krepis) as real copies even when pnpm could
# symlink them, so their peer dependencies always resolve from each consumer.
dedupeInjectedDeps: false
